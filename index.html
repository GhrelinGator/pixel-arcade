function sclNew(sex) {
  const r = scRng(SCS.seed ^ 0x5eed);
  const sub = scSubject(r, 'untrained', scWorld(SCS));
  sub.female = sex === 'f'; sub.str = Math.exp(scGauss(r) * 0.1) * (sub.female ? 0.72 : 1); sub.scale = sub.female ? 0.86 : 1;
  return {
    v: 1, sex, block: 0, sub: JSON.parse(JSON.stringify(sub, (k, v) => v instanceof Float64Array ? Array.from(v) : v)), bf: sex === 'f' ? 24 : 17,
    prog: SCL_DEFAULT.map(x => Object.assign({}, x)), diet: 'bulk', protein: 1.6, creatine: false, caffeine: false, drugs: {}, washout: 0,
    mk: Object.assign({}, SCL_BASE), risk: 0, history: [], banned: false, wins: { natural: 0, open: 0 }, over: null, used: [], tab: 'prog', last: null,
  };
}
const sclSub = L => { if (!L._sub) L._sub = scRevive(JSON.parse(JSON.stringify(L.sub))); return L._sub; };
function sclStore(L) { const s = L._sub; if (s) L.sub = JSON.parse(JSON.stringify(s, (k, v) => v instanceof Float64Array ? Array.from(v) : v)); }
const sclGroupX = (limb, g) => scMean(SC_SHOW_GROUPS[g].map(m => limb.X[SC_MI[m]]));
const sclMass = limb => scMean(Object.keys(SC_SHOW_GROUPS).map(g => sclGroupX(limb, g)));
const sclWeight = (L, limb) => { const lbm = (L.sex === 'f' ? 46 : 62) * Math.pow(sclMass(limb), 0.85); return lbm / (1 - L.bf / 100); };
const sclSets = L => L.prog.reduce((a, p) => a + (p.ex ? p.sets : 0), 0);

/* the drug effects for this block */
function sclDrugFx(L) {
  const fx = { grow: 1, ceil: 0, fat: 0, hdl: 0, ldl: 0, hct: 0, bp: 0, alt: 0, estro: 0, supp: 0, glu: 0, hr: 0, block: 0, restore: 0 };
  for (const [id, t] of Object.entries(L.drugs)) { if (!t) continue; const D = SC_DRUGS[id], k = t - 1;
    if (D.grow) { fx.grow += D.grow[k] * (id === 'andrax' ? scWorld(SCS).andrax / 0.85 : 1); fx.ceil += D.ceil[k]; }
    if (D.fat) fx.fat += D.fat[k];
    ['hdl', 'ldl', 'hct', 'bp', 'glu', 'hr'].forEach(m => { if (D[m]) fx[m] += D[m][k]; });
    if (D.liver) fx.alt += D.liver[k]; if (D.estro) fx.estro += D.estro[k]; if (D.supp) fx.supp = Math.max(fx.supp, [0.6, 0.8, 0.92][k]);
    if (D.estroBlock) fx.block = D.estroBlock[k]; if (D.restore) fx.restore = D.restore[k];
  }
  return fx;
}
/* one 12-week block of training, eating and (maybe) pharmacology */
function sclRunBlock(L) {
  const Wd = scWorld(SCS); const sub = sclSub(L); const limb = sub.limbs[0];
  const r = scRng(SCS.seed + 4242 + L.block * 97);
  const fx = sclDrugFx(L); const anyDrug = Object.values(L.drugs).some(t => t);
  const before = { X: Array.from(limb.X), bf: L.bf, mass: sclMass(limb), w: sclWeight(L, limb), lifts: sclLifts(sub, limb) };
  sub.protein = L.protein; sub.kcal = L.diet === 'bulk' ? 1.15 : L.diet === 'cut' ? 0.55 : 1;
  sub.supp = L.creatine ? 'creatine' : 'none'; sub._loaded = L.creatine;
  const prog = L.prog.filter(p => p.ex && p.sets > 0).map(p => Object.assign({}, p, { R: scResolve(scSpec(p.ex)) }));
  const drugWeeks = SCL_BLOCK - L.washout;
  limb._W = limb._W || {};
  for (let w = 0; w < SCL_BLOCK; w++) {
    sub.drug = anyDrug && w < drugWeeks ? { grow: fx.grow, ceil: fx.ceil } : null;
    prog.forEach(p => { limb._W[p.R.key] = sc1RM(sub, limb, p.R) * scLoadFor(p.R, p.reps, Wd); });
    for (let d = 0; d < 7; d++) {
      const out = { stim: new Float64Array(SC_NM), dmg: new Float64Array(SC_NM), act: {} }; let any = false;
      prog.forEach((p, i) => {
        const days = i % 2 ? [1, 4] : [0, 3]; const si = days.indexOf(d); if (si < 0) return;
        const n = Math.floor(p.sets / 2) + (si === 0 ? p.sets % 2 : 0); if (!n) return;
        const proto = { sets: p.sets, rir: p.rir, rest: 120, _sessSets: n }; sub.expect = L.caffeine ? 0.3 : 0;
        scSession(sub, limb, p.R, proto, Wd, r, out); any = true;
      });
      if (any) scAbsorb(sub, limb, out, Wd);
      scDay(sub, limb, Wd);
      if (L.diet === 'cut' && L.bf < 7) for (let i = 0; i < SC_NM; i++) limb.X[i] *= 0.99985;
    }
    const fatW = (L.diet === 'bulk' ? 0.25 : L.diet === 'cut' ? -0.75 : -0.04) - (sub.drug ? fx.fat * 0.5 : 0) + (L.protein < 1 ? 0.04 : 0);
    L.bf = scClamp(L.bf + fatW * (L.bf < 8 && fatW < 0 ? 0.6 : 1), L.sex === 'f' ? 10 : 3.5, 35);
  }
  // bloodwork at the end of the block: drug effects fade over the washout
  const fade = anyDrug ? Math.max(0, 1 - L.washout / 6) : 0;
  const B = SCL_BASE, mk = L.mk;

function sclLifts(sub, limb) {

/* show day */
function sclShow(L, fed) {
  const r = scRng(SCS.seed + L.block * 31 + (fed === 'open' ? 7 : 3)); const F = SCL_RIVALS[fed];
  const limb = sclSub(L).limbs[0];
  if (fed === 'natural') {
    const caught = L.used.find(u => Object.entries(u.drugs).some(([id, t]) => t && (L.block - 1 - u.block) * SCL_BLOCK + u.washout < SC_DRUGS[id].detect[t - 1] + (u.block === L.block - 1 ? 0 : 0)));
    if (caught) { L.banned = true; return { caught: true, fed }; }
  }
  if (fed === 'natural' && L.banned) return { banned: true, fed };
  const groups = Object.keys(SC_SHOW_GROUPS).map(g => sclGroupX(limb, g)); const m = scMean(groups);
  const balance = 1 - Math.min(0.4, scSD(groups) / m * 1.6);
  const cond = scClamp(1 - Math.max(0, L.bf - 5) * 0.045, 0.45, 1) * (L.last && L.last.gyno ? 0.9 : 1);
  const me = { n: 'You', mass: m, bf: L.bf, score: m * 100 * balance * cond };
  const field = [me];
  for (let k = 0; k < 5; k++) { const mass = F.mass[0] + (F.mass[1] - F.mass[0]) * r(); const bf = F.bf[0] + (F.bf[1] - F.bf[0]) * r(); const bal = 0.86 + 0.12 * r();
    field.push({ n: SCL_NAMES[Math.floor(r() * SCL_NAMES.length)], mass, bf, score: mass * 100 * bal * scClamp(1 - Math.max(0, bf - 5) * 0.045, 0.45, 1) }); }
  field.forEach(f => { f.score *= 1 + scGauss(r) * 0.015; });
  field.sort((a, b) => b.score - a.score);
  const place = field.indexOf(me) + 1;
  if (place === 1) L.wins[fed]++;
  return { fed, field, place, balance, cond };
}

function sclDraw(ctx, L, ts) {
  const W = 64, H = 80; ctx.fillStyle = '#161a20'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#232a33'; ctx.fillRect(0, 72, W, 8); ctx.fillStyle = '#2c3540'; for (let x = 2; x < W; x += 8) ctx.fillRect(x, 74, 4, 1);

  const fem = L.sex === 'f'; const skin = fem ? '#e8b58c' : '#c98c5e', sh = dark(skin, 0.28), hi = mix(skin, '#ffffff', 0.18), shorts = fem ? '#ff6b7a' : '#3987e5', ol = '#0b0e12';
  const fat = scClamp((L.bf - 10) / 20, 0, 1), cut = L.bf < 10;
  const cx = 32, flex = !reduced && Math.sin(ts / 900) > 0.55;
  const sw = 9 + g('Shoulders') * 6 + g('Back') * 2, cw = 7 + g('Chest') * 3 + g('Back') * 4 + fat * 2, ww = 5 + fat * 4 + (fem ? 0 : g('Back') * 0.5);
  const aw = 2 + g('Arms') * 2.6 + fat, tw = 3 + g('Legs') * 2.6 + fat * 1.2, kw = 2 + g('Calves') * 1.8;
  const shapes = [];
  const R = (x, y, w, h, c) => shapes.push([Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h)), c]);
  // head and neck
  R(cx - 3, 6, 7, 8, skin); R(cx - 2, 14, 5, 3, skin); R(cx - 3, 5, 7, 3, fem ? '#5d275d' : '#1a1c2c'); if (fem) R(cx + 3, 7, 2, 7, '#5d275d');
  // traps and delts
  R(cx - sw + 2, 16, (sw - 2) * 2 + 1, 3, skin); R(cx - sw, 17, 4, 5, skin); R(cx + sw - 3, 17, 4, 5, skin);
  // torso: V from shoulders to waist
  for (let y = 18; y <= 40; y++) { const k = (y - 18) / 22; const half = Math.round(cw + (ww - cw) * k); R(cx - half, y, half * 2 + 1, 1, skin); }
  // arms (flex = double biceps)
  const ax = sw + 1;
  if (flex) { R(cx - ax - aw - 4, 18, aw + 4, aw + 1, skin); R(cx - ax - aw - 4, 10, aw, 9, skin); R(cx + ax + 1, 18, aw + 4, aw + 1, skin); R(cx + ax + 4 - aw + aw, 10, aw, 9, skin);
    R(cx - ax - aw - 3, 17 - Math.round(g('Arms') * 2), aw + 1, 2 + Math.round(g('Arms') * 2), skin); R(cx + ax + 2, 17 - Math.round(g('Arms') * 2), aw + 1, 2 + Math.round(g('Arms') * 2), skin); }
  else { R(cx - ax - aw + 1, 20, aw, 10, skin); R(cx - ax - aw + 1.5, 30, aw - 0.5, 9, skin); R(cx + ax, 20, aw, 10, skin); R(cx + ax, 30, aw - 0.5, 9, skin); R(cx - ax - aw + 1, 39, aw, 2, skin); R(cx + ax, 39, aw, 2, skin); }
  // shorts, thighs, knees, calves, feet
  R(cx - ww - 1, 40, ww * 2 + 3, 7, shorts);
  R(cx - tw * 2 - 1, 47, tw * 2, 12, skin); R(cx + 2, 47, tw * 2, 12, skin);
  R(cx - tw - 2.5, 59, 3, 2, skin); R(cx + tw + 0.5, 59, 3, 2, skin);
  R(cx - tw - 1 - kw, 61, kw * 2, 6, skin); R(cx + tw + 1 - kw, 61, kw * 2, 6, skin); R(cx - tw - 1 - kw / 2, 67, kw + 1, 4, skin); R(cx + tw + 1 - kw / 2, 67, kw + 1, 4, skin);

  shapes.forEach(([x, y, w, h, c]) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); });
  // details: face, pec line, abs, quad sweep
  ctx.fillStyle = ol; ctx.fillRect(cx - 1, 9, 1, 1); ctx.fillRect(cx + 2, 9, 1, 1);
  ctx.fillStyle = sh; ctx.fillRect(cx - 1, 12, 3, 1);
  if (!fem) { ctx.fillRect(cx - cw + 2, 25, cw - 2, 1); ctx.fillRect(cx + 1, 25, cw - 2, 1); ctx.fillRect(cx, 19, 1, 6); } else { ctx.fillStyle = shorts; ctx.fillRect(cx - cw + 1, 20, cw * 2 - 1, 5); ctx.fillStyle = sh; }
  if (cut) { for (let i = 0; i < 3; i++) { ctx.fillRect(cx - 3, 28 + i * 4, 3, 1); ctx.fillRect(cx + 1, 28 + i * 4, 3, 1); } ctx.fillRect(cx, 27, 1, 12); ctx.fillRect(cx - tw * 2 + 1, 52, 1, 5); ctx.fillRect(cx + tw * 2, 52, 1, 5); }

}
