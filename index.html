  ${sec('MEDICS\' FORECAST', sick.length ? `<div class="fore">${sick.map(s => `<div><span>${esc(s.label)}</span><b>~${s.n}</b><small>${s.base && s.base > s.n ? `${s.base - s.n} prevented · ` : ''}helps: ${esc(s.why)}</small></div>`).join('')}</div>` : '<p class="hint">No non-battle casualties expected. Enjoy it.</p>', 'non-battle casualties')}
  <div class="dr-next"><button class="btn primary big block" data-dr="tab" data-v="armory">TO THE ARMORY ▸</button></div>`;
}

function drArmoryHTML() {
  const L = DRS.L, op = curOp();
  const cards = Object.entries(ARMS).map(([id, a]) => {
    if (a.locked) return `<button class="opt locked" disabled><span class="t">${iconImg('lock', null, 'ico sm')} ${esc(a.n)}</span><small>${esc(a.desc)}</small></button>`;
    const tags = [a.fire && `FIRE +${a.fire}`, a.c2 && `C2 +${a.c2}`, a.mobT && `MOB +${a.mobT[op.terrain]} here`, a.at && 'vs ARMOR', a.eng && 'RIVERS & BELTS', a.evac && 'EVACUATION', `${a.cost} arms`, a.maint && `${a.maint} h upkeep`, a.food && `${a.food} food`];
    return `<button class="opt" data-dr="tog" data-k="arms" data-v="${id}" aria-pressed="${L.arms.includes(id)}"><span class="t">${esc(a.n)}</span><small>${esc(a.sub ? a.sub + '. ' + a.desc : a.desc)}</small><span class="fx">${tagz(tags)}</span></button>`;
  }).join('');
  return `${sec('ISSUE TO THE COLUMN', `<p class="hint">Every fighter already has a bolt-action rifle. Requisition buys what makes deep battle possible. Each kit also costs workshop hours to maintain, the same hours your seamstresses need.</p><div class="opts">${cards}</div>`)}
  <div class="dr-next"><button class="btn primary big block" data-dr="tab" data-v="plan">TO THE PLAN ▸</button></div>`;
}

function drPlanHTML() {
  const L = DRS.L, op = curOp();
  if (L.deception === 'radio' && !L.arms.includes('radio')) L.deception = 'none';
  const P = drProject(L, DRS, op), D = P.D;
  const g = (k, obj, extra = () => []) => `<div class="opts">${Object.entries(obj).map(([id, o]) => opt(k, id, o.n, o.sub ? `${o.sub}. ${o.desc}` : o.desc, extra(id, o), L[k] === id, o.needs && !L.arms.includes(o.needs))).join('')}</div>`;
  const over = drOver(L, DRS);
  const warn = [];
  if (op.enemy.armor && !L.arms.includes('at')) warn.push('The enemy has armor and you have no anti-armor teams.');
  if (op.river && !L.arms.includes('eng')) warn.push('A river line with no engineer kit.');
  if (L.timing === 'onbreak' && D.C2 < 50) warn.push('"On breakthrough" needs fast communication. With C2 under 50 the order arrives hours late.');
  if (D.U.conceal < 5) warn.push(`Your uniforms are easy to see here (${D.U.conceal}/10).`);
  if (D.kratio < 0.9) warn.push('The ration pack is short on calories.');
  if (op.doctrine === 'elastic' && L.timing === 'early') warn.push('Intelligence says the first line is bait. Committing early walks into it.');
  if (L.objective === 'deep' && (D.END < 60 || ((op.doctrine === 'counter' || op.doctrine === 'layered') && !L.arms.includes('at')))) warn.push('Driving beyond the objective here risks overreach.');
  const bars = [['Firepower', D.FIRE], ['Mobility', D.MOB], ['Command (C2)', D.C2], ['Concealment', D.CON], ['Morale', D.MOR], ['Endurance', D.END], ['Medical', D.MED]].map(([n, v]) => `<div class="stat"><span>${n}</span><div class="sbar"><i style="width:${v}%"></i></div><b>${v}</b></div>`).join('');
  const pct2 = x => Math.round(x * 100);
  const blowMax = Math.max(P.shock, P.defense) * 1.15;
  const hints = P.P1 === 'stalled' || P.margin < 2 ? drBlowHints(L, op) : [];
  const H = 30, hx = h => `${clamp(h / H, 0, 1) * 100}%`;
  const tl = `<div class="tl"><div class="tl-axis">${[0, 6, 12, 18, 24, 30].map(h => `<span style="left:${hx(h)}">H+${h}</span>`).join('')}</div>
    ${P.breachH !== null ? `<i class="tl-g" style="left:${hx(P.breachH)}" title="gap opens">GAP</i><i class="tl-m" style="left:${hx(P.enterH)}" title="mobile group enters">YOU</i>` : ''}
    <i class="tl-r" style="left:${hx(P.reserveH)}" title="enemy reserve arrives">RES</i></div>`;
  const raceTxt = P.breachH === null ? 'No gap opens, so there is no race. Fix the breakthrough first.'
    : P.lead >= 2 ? `Your mobile group enters at H+${P.enterH}, ${P.lead} hours before their reserve. You win the race.`
    : P.lead >= -2 ? `Your mobile group (H+${P.enterH}) and their reserve (H+${P.reserveH}) arrive together: a costly meeting fight in the gap.`
    : `Their reserve (H+${P.reserveH}) seals the gap ${-P.lead} hours before your mobile group arrives (H+${P.enterH}).`;
  const projHTML = `<div class="pj3">
    <div class="pjr"><div class="pjh"><span>1 · BREAKTHROUGH</span><b class="${P.P1 === 'stalled' ? 'bad' : P.P1 === 'clean' ? 'ok' : ''}">${P.p1Label}</b></div>
      <div class="vs"><span>Your blow</span><div class="sbar"><i style="width:${P.shock / blowMax * 100}%;background:var(--accent)"></i></div><b>${P.shock}</b></div>
      <div class="vs"><span>Their line</span><div class="sbar"><i style="width:${P.defense / blowMax * 100}%;background:#8a8aa8"></i></div><b>${P.defense}</b></div>
      ${hints.length ? `<p class="hint">Staff suggestions to add weight: ${hints.map(h => `${esc(h.label)} <b class="ok">+${h.g}</b>`).join(' · ')}</p>` : ''}</div>
    <div class="pjr"><div class="pjh"><span>2 · RACE FOR THE GAP</span><b class="${P.lead === null ? 'bad' : P.lead >= 2 ? 'ok' : P.lead < -2 ? 'bad' : ''}">${P.lead === null ? 'No gap' : P.lead >= 2 ? 'You win' : P.lead >= -2 ? 'Too close' : 'They win'}</b></div>
      ${tl}<p class="hint">${esc(raceTxt)}${P.camoH ? ` Camouflage ${P.camoH > 0 ? 'bought' : 'cost'} ${Math.abs(P.camoH)}h.` : ''}</p></div>
    <div class="pjr"><div class="pjh"><span>3 · DEPTH</span><b class="${P.reached >= 1 ? 'ok' : P.reached < 0.5 ? 'bad' : ''}">${pct2(P.reached)}% of ${op.depth} km</b></div>
      <div class="vs"><span>Your drive</span><div class="sbar"><i style="width:${clamp(P.drive / Math.max(P.drive, P.resistance) * 100, 0, 100)}%;background:var(--accent)"></i></div><b>${P.drive}</b></div>
      <div class="vs"><span>Resistance</span><div class="sbar"><i style="width:${clamp(P.resistance / Math.max(P.drive, P.resistance, 1) * 100, 0, 100)}%;background:#8a8aa8"></i></div><b>${P.resistance}</b></div>
      <p class="hint">Enough for about ${pct2(P.depthFrac)}% of the way; you ordered ${pct2(P.target)}%.${P.overextended ? ' Overreach likely beyond the objective.' : ''} Expected dead ~${P.dead}.</p></div>
  </div>`;
  return `${sec('ENEMY PLAN', drEnemyPlanHTML(op), 'partisan intelligence')}
  ${sec('FRONTAGE', g('frontage', FRONTAGE))}
  ${sec('ECHELONS', g('echelon', ECHELONS) + `<button class="tog wide" data-dr="raids" aria-pressed="${L.raids}"><span>Raiding detachments<small>12% of the first echelon infiltrates to strike the enemy's depth at H-hour: the reserve arrives late and weaker.</small></span></button>`)}
  ${sec('COMMITMENT OF THE MOBILE GROUP', g('timing', TIMING))}
  ${sec('DEPTH OF THE OPERATION', g('objective', OBJECTIVES))}
  ${sec('DECEPTION', g('deception', DECEPTION))}
  ${sec('POLITICAL LINE', g('line', LINES), 'what the commissars emphasise')}
  ${sec('STAFF PROJECTION', `${projHTML}<details class="dr-det"><summary>Force statistics</summary><div class="meters">${bars}</div></details>
     ${warn.length ? `<div class="warns">${warn.map(w => `<p>! ${esc(w)}</p>`).join('')}</div>` : ''}`, 'estimates, not promises')}
  <div class="dr-next">${over.length ? `<p class="warns"><b>Over budget:</b> ${over.map(r => DR_RES_N[r]).join(', ')}. Cut something before launching.</p>` : ''}
    <button class="btn primary big block" data-dr="launch" ${over.length ? 'disabled' : ''}>LAUNCH OPERATION ${esc(op.n)}</button></div>`;
}

/* ---------------- report ---------------- */
function drReportHTML() {
  const R = DRS.lastReport, op = OPS.find(o => o.id === R.op), T = R.text;
  const lookIdx = DRS.looks.length - 1;
  const fac = FACTION_ORDER.map(f => { const x = R.factions[f]; return `<div class="voice"><b>${esc(FACTIONS[f].n)}</b><p>"${esc(x.quote)}"</p><small class="${x.total > 0 ? 'up' : x.total < 0 ? 'dn' : ''}">${f === 'critique' ? 'no effect' : (x.total > 0 ? '▲ ' : x.total < 0 ? '▼ ' : '') + sgn(x.total) + ' → ' + x.now}</small></div>`; }).join('');
  const sp = Object.entries(R.spoils).map(([k, v]) => `+${v} ${DR_RES_N[k].toLowerCase()}`).join(', ');
  const last = DRS.cycle >= NOPS();
  return `<header class="dr-hud"><div class="dr-hrow"><button class="ib" data-dr="totitle" aria-label="Menu">◀</button><div class="dr-op"><b>AFTER-ACTION REPORT</b><span>Operation ${esc(op.n)} · cycle ${R.cycle + 1}/${NOPS()}</span></div></div></header>
  <main class="dr-main">
    <div class="rep-top"><div class="grade g-${R.letter}">${R.letter}</div><div class="rep-score">${R.score}/100<small>${R.taken ? `${esc(op.obj[0].toUpperCase() + op.obj.slice(1))} taken.` : `${R.km} of ${op.depth} km. Objective not taken.`}</small></div></div>
    <div class="dr-frame map"><canvas data-scene="dr-map" width="160" height="56" aria-label="Map of the operation: how far each echelon advanced"></canvas><div class="maplg"><span><i style="background:#c8372d"></i>first echelon</span><span><i style="background:#7a1d16"></i>mobile group</span><span><i style="background:#3b3b8a"></i>enemy reserve</span><span>⚑ objective</span></div></div>
    <div class="stats">
      <div><b>${R.km} km</b><span>advance</span></div><div><b>${R.dead}</b><span>dead</span></div><div><b>${R.wounded}</b><span>wounded</span></div>
      <div><b>${R.D.sickN}</b><span>sick & injured</span></div><div><b>+${R.recruits}</b><span>recruits</span></div><div><b>${R.forceNext}</b><span>fighters now</span></div></div>
    <div class="parts">
      <div class="part"><div class="ph2"><span>DEPTH</span><b>${R.depthPts}/40</b></div><div class="pbar"><i style="width:${R.depthPts / 40 * 100}%"></i></div></div>
      <div class="part"><div class="ph2"><span>LOSSES</span><b>${R.lossPts}/25</b></div><div class="pbar"><i style="width:${R.lossPts / 25 * 100}%"></i></div></div>
      <div class="part"><div class="ph2"><span>HEALTH</span><b>${R.healthPts}/15</b></div><div class="pbar"><i style="width:${R.healthPts / 15 * 100}%"></i></div></div>
      <div class="part"><div class="ph2"><span>COHESION</span><b>${R.cohPts}/20</b></div><div class="pbar"><i style="width:${R.cohPts / 20 * 100}%"></i></div></div>
    </div>
    ${sec('DISPATCHES', T.dispatch.map(p => `<p class="disp">${esc(p)}</p>`).join(''), 'from the Operational Section')}
    ${sec('DEEP-OPERATIONS ASSESSMENT', `<ul class="ass">${T.assess.map(a => `<li>${esc(a)}</li>`).join('')}</ul>`)}
    <details class="dr-det" open><summary>GEAR PERFORMANCE</summary><ul class="gear">${T.gear.map(g => `<li class="${g.ok ? 'ok' : 'no'}"><b>${esc(g.k)}</b> ${esc(g.t)}</li>`).join('')}</ul></details>
    <details class="dr-det"><summary>MEDICAL · ${R.dow} died of wounds</summary>${T.medical.map(p => `<p class="disp">${esc(p)}</p>`).join('')}</details>
    <details class="dr-det"><summary>LOGISTICS · ${Math.round(R.D.kcal / op.kcal * 100)}% of calories</summary>${T.logistics.map(p => `<p class="disp">${esc(p)}</p>`).join('')}</details>
    ${sec('BULLETIN OF THE FIELD ATELIER', `<div class="bull"><canvas data-fighter="${lookIdx}" width="48" height="64"></canvas><div><b>"${esc(DRS.looks[lookIdx].name)}"</b><p>${esc(T.bulletin)}</p></div></div>`, 'fashion desk')}
    <details class="dr-det"><summary>FACTION VOICES · ${FACTION_ORDER.filter(f => f !== 'critique').map(f => `${FACTIONS[f].s} ${R.factions[f].total > 0 ? '▲' : R.factions[f].total < 0 ? '▼' : '='}`).join(' ')}</summary><div class="voices">${fac}</div></details>
    ${sec('NEXT CYCLE', `<p class="disp">${sp ? `Captured: ${esc(sp)}. ` : ''}${last ? '' : `Next cycle's supply: ${DR_RES.map(r => `${R.income[r]} ${DR_RES_N[r].toLowerCase()}`).join(', ')}.`}</p>`)}
    <div class="dr-next"><button class="btn primary big block" data-dr="next">${last ? 'FINAL REVIEW ★' : `CYCLE ${DRS.cycle + 1}: ${esc(opList()[DRS.cycle].n)} ▸`}</button></div>
  </main>`;
}

/* ---------------- ending ---------------- */
function drEndHTML() {
  const E = drEnding(DRS);
  const looks = DRS.looks.map((l, i) => `<figure class="runway-look"><canvas data-fighter="${i}" width="48" height="64"></canvas><figcaption><b>${esc(l.name)}</b><small>${esc(OPS.find(o => o.id === l.op).n)} · ${l.letter}</small></figcaption></figure>`).join('');
  const letter = LETTER.body && LETTER.body.trim() ? `<section class="dr-sec"><h3><span>A LETTER IN THE LAST BOLT OF CLOTH</span></h3><div class="dr-paper letter">${LETTER.to ? `<p>${esc(LETTER.to)},</p>` : ''}${LETTER.body.split(/\n\n+/).map(p => `<p>${esc(p)}</p>`).join('')}${LETTER.from ? `<p class="sig">${esc(LETTER.from)}</p>` : ''}</div></section>` : '';
  return `<main class="dr-main"><div class="dr-end">
    <div class="dr-logo sm">${esc(E.title)}</div>
    <p class="dr-lede">${esc(E.text)}</p>
    <div class="stats"><div><b>${E.avgS}</b><span>average score</span></div><div><b>${DRS.reports.filter(r => r.taken).length}/${NOPS()}</b><span>objectives taken</span></div><div><b>${E.totalDead}</b><span>dead</span></div><div><b>${DRS.force}</b><span>fighters at the end</span></div></div>
    ${sec('THE COLLECTION', `<div class="runway">${looks}</div><p class="hint">${DRS.looks.length} looks, ${DRS.looks.length} operations: your campaign as a collection.</p>`, 'runway')}
    ${sec('EPILOGUES', `<div class="voices">${E.epi.map(x => `<div class="voice"><b>${esc(FACTIONS[x.f].n)}</b><p>${esc(x.t)}</p><small>${x.f === 'critique' ? '' : 'approval ' + x.a}</small></div>`).join('')}</div>`)}
    ${letter}
    <div class="dr-btns"><button class="btn primary big" data-dr="newcamp">NEW CAMPAIGN</button><a class="btn" href="#arcade">ARCADE</a></div>
  </div></main>`;
}

/* ---------------- Resolution 907 ---------------- */
function drBirthday() {
  const first = !DRS.bday; DRS.bday = true; DRS.bdayYear = new Date().getFullYear(); drSave();
  confetti(); SFX.level();
  modal(`<div class="lvlup"><span class="tag">COUNCIL RESOLUTION 907</span><div class="big">HAPPY BIRTHDAY</div>
    <p>On 7 September a comrade was born who would one day imagine an atelier-clinic-armory for a column that never existed. The Council has adjourned for cake.</p>
    <div class="voices" style="text-align:left;width:100%">${FACTION_ORDER.map(f => `<div class="voice"><b>${esc(FACTIONS[f].n)}</b><p>"${esc(BDAY_WISHES[f])}"</p></div>`).join('')}</div>
    <p>${first ? 'The atelier issues one (1) ceremonial print: <b>Birthday confetti</b>, now in your pattern list. Terrible camouflage. Excellent morale.' : 'Birthday confetti is waiting in your pattern list.'}</p>
    <button class="btn primary big" data-act="close" data-dr="bdayclose">FOR THE BIRTHDAY COMRADE ★</button></div>`);
}
function confetti() {
  if (reduced) return;
  const cv = document.createElement('canvas'); cv.className = 'confetti'; cv.width = 160; cv.height = Math.round(160 * innerHeight / innerWidth);
  document.body.appendChild(cv); const ctx = cv.getContext('2d');
  const cols = ['#e0533f', '#e3b04b', '#73eff7', '#a7f070', '#f4f4f4', '#b13e53', '#41a6f6'];
  const bits = Array.from({ length: 90 }, () => ({ x: Math.random() * 160, y: -Math.random() * cv.height, v: 0.6 + Math.random() * 1.2, w: Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)] }));
  const t0 = performance.now();
  const step = ts => {
    const k = (ts - t0) / 1000; ctx.clearRect(0, 0, cv.width, cv.height);
    bits.forEach(b => { b.y += b.v; const x = Math.round(b.x + Math.sin(k * 3 + b.w) * 2); ctx.fillStyle = b.c; ctx.fillRect(x, Math.round(b.y), 2, Math.sin(k * 6 + b.w) > 0 ? 2 : 1); });
    if (k < 4.5) requestAnimationFrame(step); else cv.remove();
  };
  requestAnimationFrame(step);
}

/* ---------------- modals ---------------- */
function drHowto() {
  modal(`<button class="x" data-act="close">CLOSE</button><h2>HOW IT WORKS</h2>
    <div class="unl">
      <div>${iconImg('doc')}<span>BRIEF<small>Read the directive: terrain, season, enemy, hazards. Everything else follows from it.</small></span></div>
      <div>${iconImg('cloth')}<span>ATELIER<small>Design this cycle's look: cut, details, fabric, colour, pattern, chemical finishes, webbing, insignia. The preview stands on this operation's terrain.</small></span></div>
      <div>${iconImg('food')}<span>MESS & MEDIC<small>Pack rations (calories, vitamin C, smoke) and the medical kit. The medics forecast sickness from your choices.</small></span></div>
      <div>${iconImg('arms')}<span>ARMORY<small>Spend requisition on firepower, radios, transport, engineers. Upkeep eats workshop hours.</small></span></div>
      <div>${iconImg('flag')}<span>PLAN<small>Shape the deep operation: frontage, echelons, raids, when to commit the mobile group, how deep to go. The Staff projects the outcome.</small></span></div>
    </div>
    <p style="margin-top:12px">Every resource is shared and scarce. Each operation returns an after-action report showing exactly what your gear, food, medicine and plan did. Six factions react, and their mood changes your supplies.</p>
    <p class="hint">Deep battle in one sentence: break the enemy's front with a first echelon, then push a mobile group through the gap and deep into their rear before their reserve can close it, while hitting the whole depth at once.</p>
    <div class="row"><button class="btn primary" data-act="close">GOT IT</button></div>`);
}
function drFaction(f) {
  const F = FACTIONS[f];
  modal(`<button class="x" data-act="close">CLOSE</button><h2>${esc(F.n.toUpperCase())}</h2><p>${esc(F.who)}</p>
    <div class="teach"><b>APPROVAL ${DRS.appr[f]}/100</b>Affects: ${esc(F.eff)}</div>`);
}
function drLookbook() {
  modal(`<button class="x" data-act="close">CLOSE</button><h2>LOOKBOOK</h2><div class="runway">${DRS.looks.map((l, i) => `<figure class="runway-look"><canvas data-fighter="${i}" width="48" height="64"></canvas><figcaption><b>${esc(l.name)}</b><small>${esc(OPS.find(o => o.id === l.op).n)} · ${l.letter}</small></figcaption></figure>`).join('')}</div>`);
  drPaintStatic();
}

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-dr]'); if (!b || UI.view !== 'deep') return;
  const a = b.dataset.dr, k = b.dataset.k, v = b.dataset.v, L = DRS.L;
  const keep = DRS.phase === 'prep';
  switch (a) {
    case 'tab': DRU.tab = v; drRender(false); return;
    case 'set': L[k] = v; if (k === 'pattern' && v !== 'solid' && L.color2 === L.color) L.color2 = Object.keys(COLORS).find(c => c !== L.color); break;
    case 'tog': {
      const max = { details: 3, rations: 6 }[k] || 99; const arr = L[k]; const i = arr.indexOf(v);
      if (i >= 0) arr.splice(i, 1); else if (arr.length < max) arr.push(v); else { toast(`Maximum ${max}.`); return; }
      if (k === 'arms' && v === 'radio' && !arr.includes('radio') && L.deception === 'radio') L.deception = 'none';
      break;
    }
    case 'treat': { const i = +k; L.treat[i] = v === 'none' ? null : { id: v, s: (L.treat[i] && L.treat[i].s) || 2 }; break; }
    case 'str': L.treat[+k].s = +v; break;
    case 'raids': L.raids = !L.raids; break;
    case 'launch': {
      if (drOver(L, DRS).length) return;
      const op = curOp();
      const R = drAdvance(DRS, L, op);
      DRS.lastReport = R; DRS.phase = 'report'; DRU.mapT0 = performance.now();
      DRS.L = JSON.parse(JSON.stringify(L)); DRS.L.name = '';
      drSave(); R.score >= 80 ? SFX.good() : R.score >= 52 ? SFX.ok() : SFX.bad();
      drRender(false); return;
    }
    case 'next': DRS.phase = DRS.cycle >= NOPS() ? 'end' : 'prep'; DRU.tab = 'brief'; drSave(); if (DRS.phase === 'end') SFX.level(); drRender(false); return;
    case 'length': modal(`<h2>HOW LONG A CAMPAIGN?</h2><div class="unl">
        <button class="opt" data-dr="begin" data-v="short"><span class="t">Short · 4 operations</span><small>First Furrow, Birch Echelon, White Road, Saltgrad. About 25 minutes.</small></button>
        <button class="opt" data-dr="begin" data-v="full"><span class="t">Full · 6 operations</span><small>Adds the marsh and the textile kombinat. About 45 minutes.</small></button></div>
        <div class="row"><button class="btn" data-act="close">CANCEL</button></div>`); return;
    case 'begin': closeModal(); DRS = drNewState(); DRS.ops = v === 'short' ? SHORT_CAMPAIGN.slice() : OPS.map(o => o.id); DRS.started = true; DRS.phase = 'prep'; DRU.tab = 'brief'; drSave(); drRender(false); drHowto(); return;
    case 'continue': DRS.phase = DRS.cycle >= NOPS() ? (DRS.phaseBefore === 'report' ? 'report' : 'end') : (DRS.phaseBefore === 'report' ? 'report' : 'prep'); drRender(false); return;
    case 'newcamp': modal(`<h2>START A NEW CAMPAIGN?</h2><p>This erases the current campaign and its lookbook in this browser.</p><div class="row"><button class="btn" data-act="close">CANCEL</button><button class="btn danger" data-dr="length">NEW CAMPAIGN</button></div>`); return;
    case 'totitle': DRS.phaseBefore = DRS.phase; DRS.phase = 'title'; drSave(); drRender(false); return;
    case 'howto': drHowto(); return;
    case 'lookbook': drLookbook(); return;
    case 'fac': drFaction(v); return;
    case 'bdayclose': DRU.bdayOpen = false; if (DRS.phase === 'prep') drRender(true); return;
    default: return;
  }
  SFX.tap(); drSave(); drRender(keep);
});
document.addEventListener('input', e => {
  if (e.target && e.target.id === 'lookname') {
    DRS.L.name = e.target.value.slice(0, 28); drSave();
    if (BDAY_RE.test(DRS.L.name)) { if (!DRU.bdayOpen) { DRU.bdayOpen = true; drBirthday(); } } else DRU.bdayOpen = false;
    const cv = document.querySelector('canvas[data-fighter="cur"]'); if (cv) drPaintStatic();
  }
});

</script>
