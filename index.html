    A.forEach(a => E.forEach(e => { if (e.s === a.s || e.p === a.s) { const z = e.s === a.s ? e.p : e.s; if (z !== a.p) out.push(dpSt('E', a.p, z)); } }));   // illicit process
    return out.filter(x => D.terms.includes(x.s) && D.terms.includes(x.p) && fresh(x) && dpStatus(K, x) === 'open');
  };
  const roll = r(); let q = null, kind = '';
  if (eqs.length && roll < 0.22) {
    const tries = [];
    eqs.forEach(({ e, i }) => D.terms.filter(t => !e.ids.includes(t)).forEach(t => 'AEIO'.split('').forEach(qq => [[-(i + 1), t], [t, -(i + 1)]].forEach(([s, p]) => {
      const x = dpSt(qq, s, p); if (asked.has(dpKey(x))) return; const st = dpSenses(x, R.eqs).map(y => dpStatus(K, y)); if (new Set(st).size > 1) tries.push({ x, sc: (st.includes('seq') && st.includes('rep') ? 3 : 1) + r() });
    }))));
    if (tries.length) { tries.sort((a, b) => b.sc - a.sc); q = tries[0].x; kind = 'equiv'; }
  }
  if (!q && roll < 0.55 && by.seq.length) { q = pickHard(by.seq, false); kind = 'seq'; }
  if (!q && roll < 0.85 && by.rep.length) { q = pickHard(by.rep, true); kind = 'rep'; }
  if (!q) { const b = baits(); if (b.length) { q = dpPick(b, r); kind = 'bait'; } }
  if (!q && by.open.length) { q = dpPick(by.open, r); kind = 'open'; }
  if (!q && by.seq.length) { q = dpPick(by.seq, r); kind = 'seq'; }
  if (!q && by.rep.length) { q = dpPick(by.rep, r); kind = 'rep'; }
  return q && { st: q, kind };
}
/* judge one answer. parts: [{st, a: 'C' | 'N' | 'D'}] (one part, or one per sense after a distinction) */
function dpJudge(K, parts) {
  let k = K.slice(); const commit = [];
  for (const pt of parts) {
    const s = dpStatus(k, pt.st);
    if (pt.a === 'C' && s === 'rep') return { fault: 'repGranted', st: pt.st, why: dpWhy(k, dpNeg(pt.st)) };
    if (pt.a === 'N' && s === 'seq') return { fault: 'seqDenied', st: pt.st, why: dpWhy(k, pt.st) };
    if (pt.a === 'D' && s !== 'open') return { fault: 'doubtBad', st: pt.st, status: s, why: s === 'seq' ? dpWhy(k, pt.st) : dpWhy(k, dpNeg(pt.st)) };
    if (pt.a === 'C') { commit.push(pt.st); k.push(pt.st); } else if (pt.a === 'N') { commit.push(dpNeg(pt.st)); k.push(dpNeg(pt.st)); }
  }
  return { fault: null, commit };
}

    case 'doyield': closeModal(); dpFinishDisp(false, R.D.bell ? 'yield' : 'timeout'); break;
    case 'ans': { const q = R.D.q.st; const bare = q.s < 0 || q.p < 0; const parts = dpSenses(q, R.eqs).map(st => ({ st, a: id })); DPU.distUsed = false; dpAnswer(parts, bare); break; }
    case 'distinguo': {
      const q = R.D.q.st; if (!(q.s < 0 || q.p < 0)) { if (R.school !== 'gate') R.fame = Math.max(0, R.fame - 1); toast('Nothing to distinguish: every word here has one sense. The hall smirks (−1 fame).'); SFX.bad(); dpSave(); dpRender(true); break; }
      DPU.dist = {}; DPU.distUsed = true; SFX.tap(); dpRender(true); break;
    }
    case 'dans': { const [i, a] = id.split(':'); DPU.dist[+i] = a; dpRender(true); break; }
    case 'undist': DPU.dist = null; DPU.distUsed = false; dpRender(true); break;
    case 'dsubmit': { const q = R.D.q.st; const parts = dpSenses(q, R.eqs).map((st, i) => ({ st, a: DPU.dist[i] })); dpAnswer(parts, true); break; }
    case 'afterfault': closeModal(); dpFinishDisp(false, 'refuted'); break;
    case 'next': dpNext(); break;
    case 'buy': {
      const it = DP_SHOP.find(x => x.id === id); if (!it || R.fame < it.c) break;
      if (id === 'retract') { DPU.retract = true; dpRender(true); break; }
      R.fame -= it.c; if (id === 'letter') R.rep += 2; else R.items[id] = (R.items[id] || 0) + (id === 'candle' ? 2 : id === 'tablet' ? 5 : 1); SFX.good(); dpSave(); dpRender(true); break;
    }
    case 'strike': { const i = +id; if (R.fame >= 4 && R.book[i] && R.book[i].how !== 'school') { R.fame -= 4; R.book.splice(i, 1); DPU.retract = false; SFX.paper(); dpSave(); } dpRender(true); break; }
    case 'leaveshop': R.shop = false; DPU.retract = false; dpSave(); dpRender(); break;
  }
});

/* ---------- pictures: an illuminated initial and a candle ---------- */
function dpScene(cv, ts) {
  const dpr = Math.min(3, window.devicePixelRatio || 1), w = cv.clientWidth || cv.width, h = cv.clientHeight || cv.height; if (!w || !h) return;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = ctx.createRadialGradient(w * 0.5, h * 0.45, 10, w * 0.5, h * 0.5, Math.max(w, h) * 0.75); g.addColorStop(0, '#f6ecd2'); g.addColorStop(1, '#dcc79c'); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  // ruled text lines
  const s = Math.min(w, h) / 100, x0 = w * 0.5 - 44 * s, y0 = h * 0.5 - 34 * s, box = 52 * s;
  ctx.strokeStyle = 'rgba(122,98,72,.25)'; ctx.lineWidth = 1; for (let y = h * 0.16; y < h * 0.9; y += 9 * s) { ctx.beginPath(); ctx.moveTo(w * 0.08, y); ctx.lineTo(w * 0.92, y); ctx.stroke(); }
  ctx.fillStyle = 'rgba(42,26,16,.55)'; for (let y = h * 0.16 + 6 * s, row = 0; y < h * 0.88; y += 9 * s, row++) { let x = x0 + box + 8 * s; if (y < y0 || y > y0 + box) x = w * 0.1; while (x < w * 0.9) { const len = (6 + ((row * 7 + Math.floor(x)) % 13)) * s * 0.7; ctx.fillRect(x, y - 1.2 * s, Math.min(len, w * 0.9 - x), 1.6 * s); x += len + 3 * s; } }
  // the initial
  ctx.fillStyle = '#efe0b8'; ctx.fillRect(x0, y0, box, box); ctx.strokeStyle = '#b38728'; ctx.lineWidth = 2.2 * s * 0.6; ctx.strokeRect(x0, y0, box, box);
  ctx.strokeStyle = '#2f5d4a'; ctx.lineWidth = 1.2; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(x0 + (i % 2 ? box - 7 * s : 7 * s), y0 + (i < 2 ? 7 * s : box - 7 * s), 4 * s, 0, 7); ctx.stroke(); }
  ctx.fillStyle = '#a3271c'; ctx.font = `${Math.round(44 * s)}px UnifrakturMaguntia, "EB Garamond", Georgia, serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('D', x0 + box / 2, y0 + box / 2 + 2 * s);
  // a candle on the right
  const cx = w * 0.84, cb = h * 0.86, chh = 30 * s; ctx.fillStyle = '#efe6d0'; ctx.fillRect(cx - 4 * s, cb - chh, 8 * s, chh); ctx.strokeStyle = 'rgba(42,26,16,.4)'; ctx.strokeRect(cx - 4 * s, cb - chh, 8 * s, chh);
  const fl = Math.sin(ts / 140) * 0.8 + Math.sin(ts / 53) * 0.5; const fy = cb - chh - 2 * s;
  const fg = ctx.createRadialGradient(cx, fy - 6 * s, 0, cx, fy - 6 * s, 16 * s); fg.addColorStop(0, 'rgba(255,214,120,.55)'); fg.addColorStop(1, 'rgba(255,214,120,0)'); ctx.fillStyle = fg; ctx.fillRect(cx - 16 * s, fy - 22 * s, 32 * s, 32 * s);
  ctx.fillStyle = '#e8a33a'; ctx.beginPath(); ctx.moveTo(cx + fl * 0.6 * s, fy - 11 * s); ctx.quadraticCurveTo(cx + 4 * s, fy - 3 * s, cx, fy); ctx.quadraticCurveTo(cx - 4 * s, fy - 3 * s, cx + fl * 0.6 * s, fy - 11 * s); ctx.fill();
}
