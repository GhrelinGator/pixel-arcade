<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Arcade</title>
<meta name="description" content="Free pixel-art browser games: Pixel Clinic and The Deep Rear.">
<meta name="theme-color" content="#1a1c2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pixel Arcade">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  /* Pixel Arcade: one dark arcade world, Sweetie-16 palette, pixel display face + terminal body face */
  --bg: #1a1c2c;
  --bg2: #222842;
  --panel: #29366f;
  --panel2: #333c57;
  --line: #566c86;
  --ink: #f4f4f4;
  --mute: #94b0c2;
  --accent: #73eff7;
  --good: #a7f070;
  --warn: #ffcd75;
  --bad: #ef7d57;
  --red: #b13e53;
  --paper: #f3ead3;
  --paper-ink: #1a1c2c;
  --font-d: 'Press Start 2P', 'Courier New', monospace;
  --font-b: 'VT323', 'Courier New', monospace;
  /* layout: phone = HUD / scene / dialog / tabs / scrolling panel in one screen; desktop = scene column + work column */
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-b); font-size: 22px; line-height: 1.12; -webkit-font-smoothing: none; -webkit-tap-highlight-color: transparent; }
#app { height: 100%; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 3px solid var(--warn); outline-offset: 3px; }
img.ico { width: 30px; height: 30px; image-rendering: pixelated; flex: none; }
img.ico.sm { width: 20px; height: 20px; }
img.ico.lg { width: 40px; height: 40px; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
h1, h2, h3 { text-wrap: balance; }

/* pixel boxes and buttons */
.pbox { background: var(--panel2); box-shadow: 0 -3px 0 0 var(--line), 0 3px 0 0 var(--line), -3px 0 0 0 var(--line), 3px 0 0 0 var(--line); margin: 3px; }
.btn { font-family: var(--font-d); font-size: 10px; letter-spacing: .5px; text-transform: uppercase; padding: 12px 14px; background: var(--panel2); color: var(--ink);
  box-shadow: 0 -3px 0 0 var(--bg), 0 3px 0 0 var(--bg), -3px 0 0 0 var(--bg), 3px 0 0 0 var(--bg), inset 0 -4px 0 0 rgba(0,0,0,.35); margin: 3px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; line-height: 1.3; }
.btn:hover { filter: brightness(1.15); }
.btn:active { transform: translateY(2px); box-shadow: 0 -3px 0 0 var(--bg), 0 3px 0 0 var(--bg), -3px 0 0 0 var(--bg), 3px 0 0 0 var(--bg), inset 0 -1px 0 0 rgba(0,0,0,.35); }
.btn.primary { background: #38b764; color: var(--bg); }
.btn.warn { background: var(--warn); color: var(--bg); }
.btn.danger { background: var(--red); }
.btn.big { font-size: 12px; padding: 16px 20px; }
.btn.block { display: flex; width: calc(100% - 6px); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }

/* ====================== HUB ====================== */
.hub-view { height: 100%; overflow: auto; background:
  radial-gradient(ellipse at 50% -10%, #29366f 0%, transparent 60%), var(--bg); }
.hub-view::after { content: ''; position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 1px, transparent 1px 3px); }
.hub { max-width: 1080px; margin: 0 auto; padding: 28px 16px 40px; display: grid; gap: 28px; }
.hub-top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
.logo { font-family: var(--font-d); font-size: clamp(26px, 6vw, 46px); line-height: 1.15; margin: 0; color: var(--ink);
  text-shadow: 3px 3px 0 var(--red), 6px 6px 0 var(--panel); }
.logo span { color: var(--accent); }
.hub-top p { margin: 0; color: var(--mute); max-width: 32ch; font-size: 24px; }
.marquee { display: flex; gap: 6px; }
.marquee i { width: 12px; height: 12px; background: var(--warn); display: block; animation: blink 1.2s steps(1) infinite; }
.marquee i:nth-child(2n) { background: var(--red); animation-delay: .6s; }
@keyframes blink { 50% { opacity: .25; } }
.feature { display: grid; grid-template-columns: 1fr; gap: 0; background: var(--panel); }
.feature .thumb { background: #10121e; padding: 10px; display: grid; place-items: center; }
.feature .thumb canvas { width: 100%; max-width: 640px; height: auto; display: block; }
.feature .ftext { padding: 20px 18px 22px; display: grid; gap: 12px; align-content: start; }
.tag { font-family: var(--font-d); font-size: 9px; color: var(--bg); background: var(--warn); padding: 6px 8px; justify-self: start; }
.feature h2 { font-family: var(--font-d); font-size: clamp(20px, 3.4vw, 28px); margin: 0; color: var(--accent); text-shadow: 3px 3px 0 var(--bg); }
.feature p { margin: 0; font-size: 24px; color: #dfe7ee; max-width: 46ch; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 0; list-style: none; }
.chips li { font-size: 19px; padding: 2px 10px; background: var(--bg2); color: var(--mute); }
.save-note { font-size: 20px !important; color: var(--good) !important; }
.shelf-h { font-family: var(--font-d); font-size: 12px; color: var(--mute); margin: 0; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; }
.cart { background: var(--panel2); padding: 14px 14px 18px; position: relative; clip-path: polygon(0 10px, 10px 10px, 10px 0, calc(100% - 10px) 0, calc(100% - 10px) 10px, 100% 10px, 100% 100%, 0 100%); }
.cart .label { background: var(--bg2); height: 92px; display: grid; place-items: center; font-family: var(--font-d); font-size: 22px; color: var(--line); }
.cart .ridges { display: flex; gap: 6px; margin-top: 12px; }
.cart .ridges i { flex: 1; height: 6px; background: var(--bg2); }
.cart h4 { font-family: var(--font-d); font-size: 9px; color: var(--mute); margin: 12px 0 4px; }
.cart p { margin: 0; color: var(--line); font-size: 20px; }
.hub-foot { color: var(--line); font-size: 19px; display: flex; flex-wrap: wrap; gap: 6px 18px; }
@media (min-width: 820px) {
  .feature { grid-template-columns: 1.15fr 1fr; }
  .feature .thumb { padding: 18px; }
}

/* ====================== GAME ====================== */
.game { height: 100%; display: flex; flex-direction: column; max-width: 1280px; margin: 0 auto; }
.hud { flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: var(--bg2); border-bottom: 3px solid var(--bg); }
.hud .ib { width: 38px; height: 38px; color: var(--ink); text-decoration: none; display: grid; place-items: center; background: var(--panel2); font-family: var(--font-d); font-size: 12px; flex: none; }
.hud .rank { display: grid; gap: 4px; min-width: 0; flex: 1; }
.hud .rank b { font-family: var(--font-d); font-size: 9px; color: var(--warn); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud .bar { height: 8px; background: var(--bg); position: relative; }
.hud .bar i { position: absolute; inset: 0 auto 0 0; background: var(--good); }
.hud .bar small { display: none; }
.hud .meta { font-size: 19px; color: var(--mute); text-align: right; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }
.hud .meta b { color: var(--ink); font-weight: normal; font-size: 24px; display: block; }

.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.stage > * { min-width: 0; }
.left { flex: none; padding: 6px 10px 0; display: grid; gap: 6px; }
.scene { background: #10121e; padding: 4px; display: grid; place-items: center; position: relative; }
.scene canvas { width: 100%; max-width: calc(23vh * 1.6); height: auto; display: block; }
.pt-tag { position: absolute; left: 8px; bottom: 8px; background: rgba(26,28,44,.85); padding: 1px 8px; font-size: 18px; color: var(--ink); }
.dialog { background: var(--bg2); padding: 6px 12px 8px; min-height: 74px; max-height: 19vh; overflow: auto; box-shadow: inset 0 0 0 3px var(--panel); cursor: pointer; }
.dialog .who { font-family: var(--font-d); font-size: 9px; color: var(--accent); margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; }
.dialog .who em { font-style: normal; color: var(--line); }
.dialog.exam .who { color: var(--good); }
.dialog.sys .who { color: var(--warn); }
.dialog .txt { white-space: pre-line; font-size: 22px; }
.right { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; padding: 6px 10px 0; }
.tabs { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.tabs button { font-family: var(--font-d); font-size: 8px; padding: 7px 2px 7px; background: var(--panel2); color: var(--mute); display: grid; justify-items: center; gap: 5px; position: relative; }
.tabs button img { width: 16px; height: 16px; image-rendering: pixelated; }
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: inset 0 -3px 0 var(--accent); }
.tabs .badge { position: absolute; top: 3px; right: 6px; background: var(--warn); color: var(--bg); font-size: 7px; padding: 2px 3px; }
.panel { flex: 1; min-height: 0; min-width: 0; overflow: auto; padding: 10px 2px 24px; overscroll-behavior: contain; }
.panel h3 { font-family: var(--font-d); font-size: 9px; color: var(--mute); margin: 14px 2px 8px; display: flex; justify-content: space-between; gap: 8px; }
.panel h3:first-child { margin-top: 2px; }
.hint { color: var(--mute); font-size: 19px; margin: 4px 2px 8px; }

/* talk */
.qlist { display: grid; gap: 6px; }
.q { text-align: left; padding: 8px 10px; background: var(--panel2); display: flex; gap: 10px; align-items: center; font-size: 22px; }
.q:hover { background: var(--panel); }
.q .cost { margin-left: auto; font-size: 17px; color: var(--line); white-space: nowrap; }
.q.done { color: var(--mute); background: var(--bg2); }
.q.done .cost { color: var(--good); }

/* tools / files */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.tile { background: var(--panel2); padding: 10px 6px 8px; display: grid; justify-items: center; gap: 6px; text-align: center; font-size: 20px; position: relative; }
.tile:hover { background: var(--panel); }
.tile small { font-size: 16px; color: var(--line); }
.tile.done { background: var(--bg2); color: var(--mute); }
.tile.done small { color: var(--good); }
.tile.locked { opacity: .5; }
.tile.locked small { color: var(--warn); }
.tile .new { position: absolute; top: 4px; right: 4px; background: var(--warn); color: var(--bg); font-family: var(--font-d); font-size: 7px; padding: 2px 3px; }

/* notes */
.notes { display: grid; gap: 4px; }
.note { background: var(--bg2); padding: 6px 10px; font-size: 21px; }
.note b { color: var(--accent); font-weight: normal; display: block; font-size: 18px; }
.note.ex b { color: var(--good); }
.note .ln { white-space: pre-line; }
.empty { color: var(--line); padding: 6px 2px; font-size: 20px; }

/* treat */
.pick { width: 100%; text-align: left; background: var(--panel); padding: 12px; display: flex; align-items: center; gap: 10px; font-size: 23px; }
.pick em { margin-left: auto; font-style: normal; font-family: var(--font-d); font-size: 9px; color: var(--accent); }
.pick.unset { background: var(--panel2); color: var(--mute); box-shadow: inset 0 0 0 2px var(--warn); }
.chipsel { display: flex; flex-wrap: wrap; gap: 6px; min-height: 40px; align-items: center; }
.chipsel button { background: var(--good); color: var(--bg); padding: 4px 8px; font-size: 20px; display: inline-flex; gap: 6px; align-items: center; }
.chipsel button.stopchip { background: var(--bad); }
.chipsel button.refchip { background: var(--warn); }
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 4px; scrollbar-width: thin; }
.filters button { white-space: nowrap; font-size: 19px; padding: 4px 10px; background: var(--bg2); color: var(--mute); }
.filters button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
.drugs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px; }
.drug { display: flex; background: var(--panel2); }
.drug .main { flex: 1; display: flex; gap: 8px; align-items: center; padding: 6px 8px; text-align: left; min-width: 0; }
.drug .main span { display: grid; min-width: 0; font-size: 21px; line-height: 1; }
.drug .main img.ico { width: 24px; height: 24px; }
.drug .main small { color: var(--line); font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.drug .inf { width: 32px; flex: none; font-family: var(--font-d); font-size: 10px; color: var(--accent); background: var(--bg2); }
.drug.sel { box-shadow: inset 0 0 0 3px var(--good); background: #2c4a3c; }
.drug:hover .main { background: rgba(255,255,255,.05); }
.locknote { color: var(--line); font-size: 19px; padding: 6px 2px; }
.toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tog { background: var(--panel2); padding: 10px; display: flex; gap: 8px; align-items: center; text-align: left; font-size: 21px; line-height: 1; }
.tog small { display: block; color: var(--line); font-size: 16px; }
.tog[aria-pressed="true"] { box-shadow: inset 0 0 0 3px var(--good); background: #2c4a3c; }
.tog.refer[aria-pressed="true"] { box-shadow: inset 0 0 0 3px var(--warn); background: #4a3d2a; }
.medrow { display: flex; align-items: center; gap: 8px; background: var(--bg2); padding: 6px 8px; margin-bottom: 6px; }
.medrow span { flex: 1; display: grid; font-size: 21px; line-height: 1.05; }
.medrow small { color: var(--line); font-size: 16px; }
.medrow button { font-family: var(--font-d); font-size: 8px; padding: 8px; background: var(--panel2); color: var(--good); min-width: 82px; }
.medrow button[aria-pressed="true"] { background: var(--red); color: var(--ink); }
.sign { padding-top: 14px; }

/* menu (title) */
.menu { display: grid; gap: 10px; align-content: start; padding: 4px 2px 20px; }
.menu .gt { font-family: var(--font-d); font-size: clamp(18px, 4vw, 26px); color: var(--accent); margin: 4px 0 0; text-shadow: 3px 3px 0 var(--red); }
.menu .sub { margin: 0; color: var(--mute); }
.menu .mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.card { background: var(--bg2); padding: 10px 12px; display: grid; gap: 6px; }
.card .k { font-family: var(--font-d); font-size: 8px; color: var(--mute); }
.meter { height: 12px; background: var(--bg); position: relative; }
.meter i { position: absolute; inset: 0 auto 0 0; background: var(--good); }
.meter b { position: absolute; top: -3px; bottom: -3px; width: 3px; background: var(--warn); }

/* modal */
.modal { position: fixed; inset: 0; background: rgba(16,18,30,.82); display: flex; align-items: flex-end; justify-content: center; z-index: 20; padding: 0; }
.sheet { background: var(--panel2); width: 100%; max-width: 620px; max-height: 92%; overflow: auto; padding: 16px 16px 20px; box-shadow: 0 -4px 0 0 var(--line); }
.sheet h2 { font-family: var(--font-d); font-size: 13px; margin: 2px 0 12px; color: var(--accent); line-height: 1.4; }
.sheet .x { position: relative; z-index: 2; float: right; font-family: var(--font-d); font-size: 10px; padding: 8px 10px; background: var(--bg2); margin: -4px -4px 0 8px; }
.sheet p { margin: 0 0 10px; }
.sheet .row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; margin-top: 14px; }
@media (min-width: 700px) { .modal { align-items: center; padding: 20px; } .sheet { box-shadow: 0 -4px 0 0 var(--line), 0 4px 0 0 var(--line), -4px 0 0 0 var(--line), 4px 0 0 0 var(--line); } }

/* paper documents */
.paper { background: var(--paper); color: var(--paper-ink); padding: 16px 16px 20px; position: relative; background-image: repeating-linear-gradient(0deg, transparent 0 27px, #e2d6b8 27px 28px); font-size: 22px; }
.paper .ph { font-family: var(--font-d); font-size: 10px; border-bottom: 3px solid var(--paper-ink); padding-bottom: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; gap: 8px; }
.paper .ph span { color: #566c86; }
.paper table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.paper td { padding: 3px 4px; vertical-align: top; border-bottom: 1px dashed #c9bb98; }
.paper td:first-child { color: #566c86; width: 40%; }
.paper ul { margin: 0; padding-left: 20px; }
.paper li { margin: 4px 0; }
.paper .stamp { position: absolute; right: 14px; bottom: 10px; transform: rotate(-12deg); border: 3px solid var(--red); color: var(--red); font-family: var(--font-d); font-size: 8px; padding: 6px; opacity: .8; }
.paper.allergy { background-color: #ffe9e4; }
.paper.allergy .ph { color: var(--red); border-color: var(--red); }
.paper.slip { background-color: #e8f6ff; }

/* report */
.rep-top { display: flex; gap: 16px; align-items: center; }
.grade { font-family: var(--font-d); font-size: 54px; width: 96px; height: 96px; display: grid; place-items: center; background: var(--bg2); flex: none; animation: stamp .45s steps(5) both; }
@keyframes stamp { from { transform: scale(2.2) rotate(-12deg); opacity: 0; } to { transform: none; opacity: 1; } }
.g-S { color: var(--warn); } .g-A { color: var(--good); } .g-B { color: var(--accent); } .g-C { color: var(--ink); } .g-D { color: var(--bad); } .g-F { color: #ff5d73; }
.rep-score { font-family: var(--font-d); font-size: 14px; }
.rep-score small { display: block; font-family: var(--font-b); font-size: 21px; color: var(--mute); margin-top: 6px; }
.parts { display: grid; gap: 8px; margin: 14px 0; }
.part { background: var(--bg2); padding: 8px 10px; }
.part .ph2 { display: flex; justify-content: space-between; font-family: var(--font-d); font-size: 8px; color: var(--mute); margin-bottom: 6px; }
.part .ph2 b { color: var(--ink); font-weight: normal; }
.pbar { height: 6px; background: var(--bg); margin-bottom: 6px; }
.pbar i { display: block; height: 100%; background: var(--accent); }
.part ul { list-style: none; margin: 0; padding: 0; font-size: 20px; }
.part li { padding: 2px 0 2px 22px; position: relative; }
.part li::before { position: absolute; left: 0; top: 2px; font-family: var(--font-d); font-size: 9px; }
.part li.ok::before { content: '+'; color: var(--good); }
.part li.no::before { content: 'x'; color: var(--bad); }
.part li.info::before { content: '>'; color: var(--mute); }
.issue { background: #3a2230; padding: 8px 10px; margin-bottom: 6px; font-size: 20px; display: flex; gap: 10px; align-items: baseline; }
.issue b { font-family: var(--font-d); font-size: 8px; padding: 3px 5px; flex: none; }
.issue.major b { background: var(--red); } .issue.moderate b { background: var(--bad); color: var(--bg); } .issue.minor b { background: var(--line); }
.issue span { flex: 1; } .issue em { font-style: normal; color: var(--bad); white-space: nowrap; }
.goodl { background: #24402f; padding: 8px 10px; margin-bottom: 6px; font-size: 20px; }
.teach { background: var(--bg2); padding: 10px 12px; border-left: 4px solid var(--warn); font-size: 21px; }
.teach b { font-family: var(--font-d); font-size: 8px; color: var(--warn); display: block; margin-bottom: 6px; }

/* level up / lists */
.lvlup { text-align: center; display: grid; gap: 10px; justify-items: center; }
.lvlup .big { font-family: var(--font-d); font-size: 20px; color: var(--warn); line-height: 1.4; animation: stamp .5s steps(5) both; }
.unl { display: grid; gap: 6px; width: 100%; text-align: left; }
.unl div { display: flex; align-items: center; gap: 10px; background: var(--bg2); padding: 6px 10px; font-size: 21px; }
.unl small { color: var(--mute); font-size: 17px; display: block; }
.ladder { display: grid; gap: 6px; }
.rung { background: var(--bg2); padding: 8px 10px; display: grid; grid-template-columns: 34px 1fr; gap: 4px 10px; align-items: center; }
.rung .n { font-family: var(--font-d); font-size: 11px; color: var(--line); }
.rung.done .n { color: var(--good); } .rung.cur { box-shadow: inset 0 0 0 3px var(--warn); } .rung.cur .n { color: var(--warn); }
.rung b { font-weight: normal; font-size: 22px; }
.rung small { grid-column: 2; color: var(--mute); font-size: 17px; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; margin: 10px 0; }
.stats div { background: var(--bg2); padding: 8px; }
.stats b { display: block; font-family: var(--font-d); font-size: 14px; color: var(--accent); font-weight: normal; margin-bottom: 4px; }
.stats span { color: var(--mute); font-size: 17px; }
.hb-item { background: var(--bg2); padding: 8px 10px; margin-bottom: 6px; }
.hb-item b { font-weight: normal; color: var(--accent); }
.hb-item small { color: var(--mute); font-size: 17px; }
.hb-item p { margin: 4px 0 0 !important; font-size: 20px; }
.caut { list-style: none; padding: 0; margin: 6px 0 0; font-size: 19px; }
.caut li { padding: 2px 0; }
.caut li b { font-family: var(--font-d); font-size: 7px; padding: 2px 4px; margin-right: 6px; vertical-align: 2px; }

/* ===================== PIXEL CLINIC — ENGINE ===================== */
const DIS = Object.fromEntries(DISEASES.map(d => [d.id, d]));
const TOOL = Object.fromEntries(TOOLS.map(t => [t.id, t]));
const QMAP = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));
const SEV_PTS = { major: 25, moderate: 10, minor: 3 };

function RNG(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const pick = (r, a) => a[Math.floor(r() * a.length)];
const ri = (r, a, b) => a + Math.floor(r() * (b - a + 1));
function wpick(r, items, w) { const tot = w.reduce((s, x) => s + x, 0); let x = r() * tot; for (let i = 0; i < items.length; i++) { x -= w[i]; if (x <= 0) return items[i]; } return items[items.length - 1]; }

/* ---------- rules ---------- */
const tagsOf = id => (DRUGS[id] && DRUGS[id].tags) || [];
function splitSel(s) { const i = s.indexOf(':'); return [s.slice(0, i), s.slice(i + 1)]; }
function selDrug(sel, id) { const [k, v] = splitSel(sel); if (k === 'd') return id === v; if (k === 't') return tagsOf(id).includes(v); return false; }
const isDrugSel = s => s[0] === 'd' || s[0] === 't';
function selCtx(sel, ctx) {
  const [k, v] = splitSel(sel);

  if (k === 'age') return ctx.age < +v.slice(1);

/* issues for prescribed list rx against ctx {age,conds,allergies,cur} */
function safety(rx, ctx) {
  const out = [], seen = new Set();
  const list = rx.filter(id => DRUGS[id]);
  list.forEach((d, i) => {
    RULES.forEach((r, ix) => {
      const [A, B, sev, msg] = r;
      const tryPair = (X, Y) => {
        if (!selDrug(X, d)) return;
        if (isDrugSel(Y)) {
          const others = ctx.cur.map(id => ({ id, src: 'cur' })).concat(list.filter((_, j) => j !== i).map(id => ({ id, src: 'rx' })));
          for (const o of others) {
            if (o.id === d || !selDrug(Y, o.id)) continue;
            const key = ix + ':' + [d, o.id].sort().join('+');
            if (seen.has(key)) continue; seen.add(key);
            out.push({ sev, msg, drug: d, with: o.id, src: o.src });
          }
        } else if (selCtx(Y, ctx)) {
          const key = ix + ':' + d; if (seen.has(key)) return; seen.add(key);
          out.push({ sev, msg, drug: d, with: Y, src: 'ctx' });
        }

      tryPair(A, B); tryPair(B, A);
    });
  });
  return out;
}
const serious = iss => iss.filter(i => i.sev !== 'minor');

/* drug cautions for the formulary card */
function cautionsFor(id) {
  const out = [];
  RULES.forEach(([A, B, sev, msg]) => { if (selDrug(A, id) || selDrug(B, id)) out.push({ sev, msg }); });
  return out;
}

/* ---------- helpers ---------- */
const unlockedDrugs = lvl => Object.keys(DRUGS).filter(id => DRUGS[id].rx !== false && DRUGS[id].lvl <= lvl);
const toolOK = (id, lvl) => TOOL[id] && TOOL[id].lvl <= lvl;
function ctxOf(p, stops = []) { return { age: p.age, conds: p.conds, allergies: p.allergies, cur: p.meds.map(m => m.id).filter(id => !stops.includes(id)) }; }
function requiredStops(p) {
  const d = DIS[p.did];
  const s = new Set(d.stop || []);
  (d.stopTags || []).forEach(t => p.meds.forEach(m => { if (tagsOf(m.id).includes(t)) s.add(m.id); }));
  return [...s].filter(id => p.meds.some(m => m.id === id));
}
function isNewOrOtc(p, id) { const m = p.meds.find(x => x.id === id); return !!m && (m.otc || m.slip); }

/* find a safe treatment the player could choose; null if impossible */
function solve(p, lvl) {
  const d = DIS[p.did];
  const avail = new Set(unlockedDrugs(lvl).concat(['rest']));
  const req = requiredStops(p);
  if (req.length && lvl < 3) return null;
  const removable = lvl >= 3 ? p.meds.filter(m => !req.includes(m.id) && (DRUGS[m.id].stop === null || DRUGS[m.id].stop === 'minor' || m.otc || m.slip)).map(m => m.id) : [];
  const slots = (d.rx || []).map(s => {
    const c = s.any.filter(id => avail.has(id));
    return c.sort((a, b) => (s.first.includes(b) ? 1 : 0) - (s.first.includes(a) ? 1 : 0));
  });
  if (slots.some(s => !s.length)) return null;
  const combos = [];
  const rec = (i, acc) => {
    if (combos.length > 400) return;
    if (i === slots.length) { combos.push(acc.slice()); return; }
    for (const id of slots[i]) if (!acc.includes(id)) { acc.push(id); rec(i + 1, acc); acc.pop(); }
  };
  rec(0, []);
  let best = null;
  for (const combo of combos) {
    let stops = req.slice();
    let ok = false;
    for (let guard = 0; guard < 4; guard++) {
      const iss = serious(safety(combo, ctxOf(p, stops)));
      if (!iss.length) { ok = true; break; }
      const fix = iss.filter(x => x.src === 'cur' && removable.includes(x.with)).map(x => x.with);
      if (!fix.length || fix.length < iss.length) break;
      stops = [...new Set(stops.concat(fix))];
    }
    if (ok) {
      const score = combo.filter((id, i) => d.rx[i].first.includes(id)).length * 10 - stops.length;
      if (!best || score > best.score) best = { rx: combo, stops, score };
    }
  }
  return best;
}

/* ---------- case generation ---------- */
function modFits(m, sex, age) {
  if (m.sex && m.sex !== sex) return false;
  if (m.age && (age < m.age[0] || age > m.age[1])) return false;
  return true;
}
function modRelevant(mid, d, lvl, age) {
  const m = MODS[mid];
  const ctx = { age, conds: m.cond ? [m.cond] : [], allergies: m.allergy ? [m.allergy] : [], cur: m.meds || [] };
  const pool = new Set();
  (d.rx || []).forEach(s => s.any.forEach(x => pool.add(x))); (d.opt || []).forEach(x => pool.add(x));
  const cand = [...pool].filter(id => DRUGS[id] && DRUGS[id].lvl <= lvl);
  if ((m.meds || []).some(x => (d.stop || []).includes(x))) return true;
  if ((m.meds || []).some(x => (d.stopTags || []).some(t => tagsOf(x).includes(t)))) return true;
  return serious(safety(cand, ctx)).length > 0;
}
function modHitsFirst(mid, d, lvl, age) {
  const m = MODS[mid];
  const ctx = { age, conds: m.cond ? [m.cond] : [], allergies: m.allergy ? [m.allergy] : [], cur: m.meds || [] };
  const firsts = (d.rx || []).flatMap(s => s.first).filter(id => DRUGS[id] && DRUGS[id].lvl <= lvl);
  return serious(safety(firsts, ctx)).length > 0;
}
function modCount(r, lvl, kid) {
  if (kid) return r() < 0.4 ? 1 : 0;
  return [0, r() < 0.5 ? 1 : 0, r() < 0.75 ? 1 : 0, 1 + (r() < 0.3), 1 + (r() < 0.5), 2, 2 + (r() < 0.4), 2 + (r() < 0.5), 3 + (r() < 0.5)][lvl] | 0;
}

function pickDisease(r, lvl, recent) {
  const pool = DISEASES.filter(d => d.lvl <= lvl);
  const w = pool.map(d => {
    let x = d.lvl === lvl && lvl < 8 ? 3 : 1;
    const k = recent.indexOf(d.id);
    if (k >= 0) x *= k < 3 ? 0.05 : 0.4;
    return x;
  });
  return wpick(r, pool, w);
}

function genPatient(lvl, seed, recent = [], forceId) {
  const r = RNG(seed);
  const d = forceId ? DIS[forceId] : pickDisease(r, lvl, recent);
  let p = null;
  for (let attempt = 0; attempt < 60; attempt++) {
    const sex = d.sex || (r() < (d.sexF ?? 0.5) ? 'f' : 'm');
    const age = ri(r, d.age[0], d.age[1]);
    let mods = (d.addMods || []).slice();
    if (attempt < 50) {
      const want = modCount(r, lvl, d.kid);
      const usedConds = new Set(mods.map(id => MODS[id].cond).filter(Boolean));
      const usedMeds = new Set(mods.flatMap(id => MODS[id].meds || []));
      let cands = Object.keys(MODS).filter(id => {
        const m = MODS[id];
        if (m.only || m.lvl > lvl || mods.includes(id) || (d.excl || []).includes(id)) return false;
        if (d.kid && id !== 'pen_allergy') return false;
        if (!modFits(m, sex, age)) return false;
        if (m.cond && usedConds.has(m.cond)) return false;
        if ((m.meds || []).some(x => usedMeds.has(x))) return false;
        return true;
      });
      for (let k = 0; k < want && cands.length; k++) {
        const rel = cands.map(id => modRelevant(id, d, lvl, age) ? (modHitsFirst(id, d, lvl, age) ? 2 : 1) : 0);
        const forceRel = k === 0 && rel.some(Boolean) && r() < (lvl >= 4 ? 0.85 : lvl >= 2 ? 0.7 : 0.5);
        const w = cands.map((id, i) => rel[i] === 2 ? 16 : rel[i] === 1 ? 4 : (forceRel ? 0 : 1));
        const id = wpick(r, cands, w);
        mods.push(id);
        const m = MODS[id];
        cands = cands.filter(c => c !== id && !(m.cond && MODS[c].cond === m.cond) && !(MODS[c].meds || []).some(x => (m.meds || []).includes(x)));
        if (m.allergy) cands = cands.filter(c => !MODS[c].allergy || r() < 0.3);
      }
    }
    p = buildPatient(r, d, lvl, sex, age, mods, seed);
    if (solve(p, lvl)) break;
  }

}

const SKINS = ['#f6d3b3', '#e8b58c', '#c98c5e', '#9a6340', '#6b4128', '#4a2c1c'];
const HAIRS = ['#1a1c2c', '#4a2f22', '#7a4a2b', '#c8873c', '#e8c36a', '#b13e53', '#29366f'];
const SHIRTS = ['#3b5dc9', '#b13e53', '#38b764', '#ef7d57', '#5d275d', '#ffcd75', '#257179', '#41a6f6', '#a7f070', '#94b0c2'];
const PANTS = ['#29366f', '#333c57', '#566c86', '#4a2f22', '#1a1c2c', '#257179'];
const SOCIAL = ['I don\'t smoke. A drink at the weekend, maybe.', 'Never smoked. I hardly drink.', 'About ten cigarettes a day. I drink socially.', 'I quit smoking years ago. A glass of wine with dinner.'];

function buildPatient(r, d, lvl, sex, age, mods, seed) {
  const kid = age < 12;
  const M = mods.map(id => MODS[id]);
  const conds = [...new Set(M.map(m => m.cond).filter(Boolean))];
  const allergies = [...new Set(M.map(m => m.allergy).filter(Boolean))];
  const forgetP = lvl >= 6 ? 0.45 : lvl >= 4 ? 0.3 : 0;
  const hasPlanMeds = M.some(m => m.meds && !m.otc && !m.slip);
  const planHome = lvl >= 6 && hasPlanMeds && r() < 0.2;
  const forgot = {};
  mods.forEach(id => { const m = MODS[id]; if (!m.otc && !m.slip && (m.meds || m.pmh) && !planHome && r() < forgetP) forgot[id] = true; });
  const meds = [];
  mods.forEach(id => {
    const m = MODS[id];
    (m.meds || []).forEach(mid => {
      if (meds.some(x => x.id === mid)) return;
      meds.push({ id: mid, mod: id, otc: !!m.otc, slip: !!m.slip, said: !forgot[id] || !!m.otc || !!m.slip, inPlan: !m.otc && !m.slip && !planHome });
    });
  });
  const name = pick(r, NAMES[sex]) + ' ' + pick(r, NAMES.last);
  const x = d.x || {};
  const temp = x.thermo ?? +(36.4 + r() * 0.7).toFixed(1);
  let bp = x.bp ? x.bp.slice() : kid ? [100, 62, ri(r, 90, 110)] : [Math.round(110 + (age - 20) * 0.45 + ri(r, -6, 6)), Math.round(70 + (age - 20) * 0.2 + ri(r, -4, 4)), ri(r, 62, 84)];
  if (!x.bp) M.forEach(m => { if (m.bp) { bp[0] += m.bp; bp[1] += Math.round(m.bp / 2); } });
  const spo2 = x.spo2 ?? ri(r, 97, 99);
  const gluc = x.gluc ?? (conds.includes('dm') ? ri(r, 128, 165) : ri(r, 84, 108));
  const fertile = sex === 'f' && age >= 14 && age <= 50;
  const preg = conds.includes('preg');

  const cPick = pick(r, d.complaint);
  const cText = Array.isArray(cPick) ? cPick[0] : cPick;
  const toldRaw = (d.told || []).concat(Array.isArray(cPick) ? cPick[1] : []);
  /* ---- answers ---- */
  const ans = {};
  QUESTIONS.forEach(q => {
    const tmp = { sex, age };
    if (q.when && !q.when(tmp)) return;
    let a;
    if (q.id === 'meds') {
      const said = meds.filter(m => m.said).map(m => MODS[m.mod].medSay[m.id]);
      if (!meds.length) a = 'No regular medicines.';
      else if (!said.length) a = 'Hmm, I can\'t remember the names. It\'s all on the plan I brought.';
      else a = (planHome ? 'I left my medication plan at home, sorry. Let me think... ' : '') + said.join(' ');
    } else if (q.id === 'allergy') {
      const s = mods.filter(id => MODS[id].allergy).map(id => kid ? (MODS[id].kidSay || MODS[id].say) : MODS[id].say);
      a = s.length ? s.join(' ') : 'No allergies that I know of.';
    } else if (q.id === 'pmh') {
      const s = mods.filter(id => MODS[id].pmh && !forgot[id]).map(id => MODS[id].pmh);
      a = s.length ? s.join(' ') : (conds.length && Object.keys(forgot).length ? 'Nothing serious, I think.' : (kid ? 'No, they\'re usually healthy.' : 'No, I\'m healthy otherwise.'));
    } else if (q.id === 'preg') {
      a = preg ? MODS.preg.pregSay : 'No, definitely not.';
    } else if (q.id === 'social') {
      const e = mods.find(id => MODS[id].socialSay);
      a = e ? MODS[e].socialSay : (d.a.social || pick(r, SOCIAL));
    } else {
      a = (d.a && d.a[q.id]) || QDEF[q.id] || '...';
    }

  });

  find.bp = [`Blood pressure ${bp[0]}/${bp[1]} mmHg` + (bp[0] >= 140 ? '  HIGH' : bp[0] < 90 ? '  LOW' : ''), `Pulse ${bp[2]}/min, ${bp[3] ? 'IRREGULAR' : 'regular'}` + (bp[2] > 100 ? '  FAST' : bp[2] < 60 ? '  SLOW' : '')];
  if (x.bpNote) find.bp.push(x.bpNote);
  const st = ov({ heart: 'Heart: regular, no murmurs.', lungs: 'Lungs: clear on both sides.' }, x.steth);
  find.steth = [st.heart, st.lungs].concat(st.bowel ? [st.bowel] : []);
  const li = ov({ throat: 'Throat: normal, tonsils not enlarged.', nose: 'Nose: normal.', eyes: 'Eyes: pupils equal and reactive.' }, x.light);
  find.light = [li.throat, li.nose, li.eyes];
  const pa = ov({ abd: 'Abdomen soft, not tender.', nodes: 'No swollen lymph nodes.', skin: 'Skin: no rash.' }, x.palp);
  find.palp = (pa.focus ? [pa.focus] : []).concat([pa.abd, pa.nodes, pa.skin]);
  find.oto = [x.oto || 'Ears: both eardrums look normal.'];
  find.spo2 = [`Oxygen saturation ${spo2}%` + (spo2 < 94 ? '  LOW' : '')];
  find.dip = [x.dip || 'Leukocytes − · Nitrite − · Blood − · Glucose − · Protein −'];
  if (fertile) find.dip.push(preg ? MODS.preg.dip : 'hCG (pregnancy test): negative');
  find.gluc = [`Blood glucose ${gluc} mg/dL` + (gluc < 70 ? '  LOW' : gluc > 180 ? '  HIGH' : '')];
  const ra = ov({ strep: 'Strep A: negative', flu: 'Influenza A/B: negative', covid: 'COVID-19: negative' }, x.rapid);
  find.rapid = [ra.strep, ra.flu, ra.covid];
  find.ecg = [x.ecg || `Sinus rhythm ${bp[2]}/min. Normal ECG.`];
  const lab = { hb: 'Hb 13.8 g/dL (normal)', wbc: 'WBC 7.1 (normal)', crp: 'CRP 3 mg/L (normal)', kidney: 'Creatinine 0.9 mg/dL · eGFR 92 (normal)', k: 'Potassium 4.2 (normal)', glu: `Glucose ${gluc} mg/dL` + (gluc < 70 ? ' (LOW)' : gluc > 140 ? ' (HIGH)' : ' (normal)'), tsh: 'TSH 2.0 (normal)', inr: 'INR 1.0 (normal)' };
  if (fertile) lab.hcg = 'β-hCG: negative';
  M.forEach(m => ov(lab, m.lab));
  const lx = Object.assign({}, x.lab || {}); const extra = lx.extra || []; delete lx.extra;
  ov(lab, lx);
  find.lab = Object.values(lab).concat(extra);
  find.xray = [x.xray || 'Chest X-ray: no abnormality.'];
  find.us = [x.us || 'Ultrasound (belly, kidneys, leg veins): no abnormality.'];
  find.ct = [x.ct || 'CT head and chest: no abnormality.'];
  const tox = { ck: 'CK 140 U/L (normal)' };

  find.tox = Object.values(tox).concat(['Drug screen: negative']);

  /* ---- documents ---- */
  const docs = [];
  const born = 2026 - age;
  const card = [['Name', name], ['Born', String(born)], ['Age', String(age)], ['Sex', sex === 'f' ? 'Female' : 'Male'], ['Weight', (kid ? ri(r, 12, 28) : ri(r, 52, 108)) + ' kg'], ['Insurance', 'PX-' + ri(r, 10000, 99999)], ['Family doctor', pick(r, ['Dr. Okoro', 'Dr. Lund', 'Dr. Vega', 'Dr. Haas'])]];
  if (lvl <= 2) card.push(['Allergies', allergies.length ? mods.filter(id => MODS[id].allergy).map(id => MODS[id].doc).join('; ') : 'none known']);
  docs.push({ id: 'card', t: 'Patient card', kind: 'card', rows: card });
  if (allergies.length) docs.push({ id: 'allergy', t: 'Allergy pass', kind: 'allergy', lines: mods.filter(id => MODS[id].allergy).map(id => MODS[id].doc) });
  const plan = meds.filter(m => m.inPlan);
  if (plan.length) docs.push({ id: 'meds', t: 'Medication plan', kind: 'meds', rows: plan.map(m => [DRUGS[m.id].n, DRUGS[m.id].dose]) });
  const letters = mods.filter(id => MODS[id].letter).map(id => MODS[id].letter);
  if (letters.length) docs.push({ id: 'letter', t: 'Doctor\'s letter', kind: 'letter', lines: letters });
  const old = M.flatMap(m => m.oldLab || []);
  if (old.length) docs.push({ id: 'lab', t: 'Old lab report', kind: 'lab', lines: old });
  const slips = M.filter(m => m.slip);

  /* ---- keys (clues the player should find) ---- */

  const keys = [];

  mods.forEach(id => {
    const m = MODS[id];

    const rev = [];
    if (m.meds) {
      if (meds.some(x => x.mod === id && x.inPlan)) rev.push('doc:meds');
      if (meds.some(x => x.mod === id && x.said)) rev.push('q:meds');

  });
  const told = [...new Set(toldRaw)].filter(q => q in ans);
  const cost = o => { const [k, v] = o.split(':'); return k === 'x' ? TOOL[v].t : (k === 'q' && told.includes(v)) ? 0 : 1; };
  const par = keys.reduce((s, k) => s + Math.min(...k.o.map(cost)), 0) + 3;

  const look = {
    skin: pick(r, SKINS), hair: grey ? (r() < 0.5 ? '#c2c3c7' : '#f4f4f4') : pick(r, HAIRS), style: pick(r, styles),
    shirt: pick(r, SHIRTS), pants: pick(r, PANTS), glasses: r() < (age > 45 ? 0.45 : 0.15), kid, elder,
    fx: (d.look || []).slice(),
  };
  if (temp >= 38 && !look.fx.includes('fever')) look.fx.push('fever');

  return {
    seed, did: d.id, name, sex, age, kid, mods, conds, allergies, meds, planHome, forgot,
    complaint: cText, told, ans, find, docs, keys, par, look,
  };
}

/* ---------- player-visible knowledge ---------- */
function knownMeds(p, st) {

}
function actionLabel(o) {

const done = (st, p) => st.asked.concat((p && p.told) || []).map(q => 'q:' + q).concat(st.exams.map(x => 'x:' + x), st.docs.map(x => 'doc:' + x));

/* ---------- grading ---------- */
function matchSlots(slots, items) {
  /* each chosen item fills at most one slot; maximise filled slots */
  let best = null;
  const full = (i, acc) => {
    if (i === slots.length) { const n = acc.filter(Boolean).length; if (!best || n > best.filter(Boolean).length) best = acc.slice(); return; }
    let used = false;
    for (const id of items) if (slots[i].any.includes(id) && !acc.includes(id)) { used = true; acc[i] = id; full(i + 1, acc); acc[i] = null; }
    full(i + 1, acc);
  };
  full(0, new Array(slots.length).fill(null));
  return best || [];
}

function gradeCase(p, st, lvl) {
  const d = DIS[p.did];
  const items = st.rx.slice();
  const drugs = items.filter(id => DRUGS[id]);
  const stops = st.stops.slice();
  const ctx = ctxOf(p, stops);
  const lines = []; // {ok:bool|null, text, pts}
  const issues = [];
  const good = [];
  const pen = (sev, msg, pts) => issues.push({ sev, msg, pts: pts ?? SEV_PTS[sev] });

  /* diagnosis */
  const dxPts = st.dx === d.id ? 35 : (d.related || []).includes(st.dx) ? 15 : 0;

  /* treatment requirements */
  const slots = d.rx || [];
  const asg = matchSlots(slots, items);
  const reqStops = requiredStops(p);
  let reqTotal = slots.length + reqStops.length + (d.refer ? 1 : 0);
  let reqMet = asg.filter(Boolean).length + reqStops.filter(s => stops.includes(s)).length + (d.refer && st.refer ? 1 : 0);
  const txNotes = [];
  slots.forEach((s, i) => {
    const firstNames = s.first.filter(id => DRUGS[id] || id === 'rest').map(nameOf);
    if (asg[i]) {
      const id = asg[i];
      if (!s.first.includes(id)) {
        const safeFirst = s.first.filter(f => f === 'rest' || (DRUGS[f] && DRUGS[f].lvl <= lvl && !serious(safety([f], ctx)).length));
        if (safeFirst.length) { pen('minor', `${nameOf(id)} works, but ${safeFirst.map(nameOf).join(' or ')} is first choice here.`, 4); txNotes.push({ ok: true, t: nameOf(id) + ' (second-line)' }); }
        else txNotes.push({ ok: true, t: nameOf(id) + ' (right call: first choice was unsafe)' });
      } else txNotes.push({ ok: true, t: nameOf(id) });
    } else txNotes.push({ ok: false, t: 'Missing: ' + (s.first.length ? firstNames.join(' / ') : s.any.map(nameOf).join(' / ')) });
  });
  reqStops.forEach(s => txNotes.push(stops.includes(s) ? { ok: true, t: 'Stopped ' + DRUGS[s].n } : { ok: false, t: 'Should have stopped ' + DRUGS[s].n }));
  if (d.refer) txNotes.push(st.refer ? { ok: true, t: 'Referred to hospital' } : { ok: false, t: 'Needed a hospital referral' });
  const txPts = reqTotal ? Math.round(35 * reqMet / reqTotal) : 35;

  /* safety */
  safety(drugs, ctx).forEach(i => {
    const w = i.src === 'ctx' ? '' : ` (${nameOf(i.drug)} + ${nameOf(i.with)})`;
    pen(i.sev, i.msg + (i.src === 'ctx' ? ` [${nameOf(i.drug)}]` : w));
  });
  const slotDrugs = new Set(slots.flatMap(s => s.any));
  drugs.forEach(id => {
    if (ctx.cur.includes(id) && !slotDrugs.has(id)) pen('minor', `${nameOf(id)}: the patient already takes it.`);
    if (slotDrugs.has(id) || (d.opt || []).includes(id)) return;
    if (d.harm && d.harm[id]) pen('moderate', d.harm[id][1], d.harm[id][0]);
    else if (d.nonbac && tagsOf(id).includes('abx')) pen('moderate', `${nameOf(id)}: antibiotics don't help here. Side effects and resistance for nothing.`, 10);
    else pen('minor', `${nameOf(id)} wasn't needed for ${d.n.toLowerCase()}.`, 4);
  });
  if (d.refer && !st.refer) pen('major', 'This patient needed hospital care. Sending them home was dangerous.', 20);
  if (!d.refer && st.refer) pen('moderate', 'Unnecessary hospital referral. This could be handled in clinic.', 10);

  /* stops */
  stops.forEach(s => {
    if (reqStops.includes(s) || (d.stopOk || []).includes(s)) return;
    const withRx = safety(drugs, ctxOf(p, stops.filter(x => x !== s))).some(i => i.sev !== 'minor' && i.with === s);
    const hazard = isNewOrOtc(p, s) && serious(safety([s], ctxOf(p, stops.concat([s])))).length > 0;
    if (hazard) { good.push({ msg: `Good catch: stopped ${DRUGS[s].n}, which was risky for this patient.`, pts: 3 }); return; }
    if (withRx) { good.push({ msg: `Held ${DRUGS[s].n} to make room for the new treatment.`, pts: 0 }); return; }
    const sev = DRUGS[s].stop;
    if (sev) pen(sev, `Stopped ${DRUGS[s].n} without a good reason.`);
  });

  /* investigation */
  const dn = done(st, p);
  const found = p.keys.filter(k => k.o.some(o => dn.includes(o)));
  const missed = p.keys.filter(k => !k.o.some(o => dn.includes(o))).map(k => ({ why: k.why, how: k.o.map(actionLabel) }));
  const thorPts = p.keys.length ? Math.round(15 * found.length / p.keys.length) : 15;

  /* efficiency */
  const over = st.time - p.par;
  const effPts = Math.max(0, Math.min(15, Math.round(15 - Math.max(0, over - 5) * 0.6)));

  const penalty = issues.reduce((s, i) => s + i.pts, 0);
  const bonus = good.reduce((s, g) => s + g.pts, 0);
  const raw = dxPts + txPts + thorPts + effPts - penalty + bonus;
  const score = Math.max(0, Math.min(100, raw));
  return { score, letter: letterOf(score), dxPts, txPts, thorPts, effPts, txNotes, issues, good, missed, over, par: p.par, time: st.time, correct: d, chosen: st.dx };
}

function nameOf(id) { if (id === 'rest') return 'Rest & home care'; return DRUGS[id] ? DRUGS[id].n : (DIS[id] ? DIS[id].n : id); }

function newSave() {

}
function rankProgress(s) {
  const R = RANKS[s.lvl - 1];
  if (!R.need) return { max: true, n: s.atRank.length, need: 0, avg: avg(s.atRank), target: 0 };
  const last = s.atRank.slice(-R.need);
  return { max: false, n: Math.min(s.atRank.length, R.need), need: R.need, avg: avg(last), target: R.avg };
}
function avg(a) { return a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : 0; }
function recordResult(s, p, res) {
  s.total++; s.atRank.push(res.score); s.dayDone++; s.dayScores.push(res.score);
  s.best = Math.max(s.best, res.score);
  s.majors += res.issues.filter(i => i.sev === 'major').length;
  s.seen[p.did] = (s.seen[p.did] || 0) + 1;
  s.recent.unshift(p.did); s.recent = s.recent.slice(0, 6);
  s.history.unshift({ d: p.did, s: res.score, g: res.letter, day: s.day }); s.history = s.history.slice(0, 40);
  const R = RANKS[s.lvl - 1];
  if (R.need && s.atRank.length >= R.need && avg(s.atRank.slice(-R.need)) >= R.avg) {
    s.lvl++; s.atRank = []; return s.lvl;
  }
  return 0;
}

/* ---------- costs ---------- */
function drCosts(L, st) {
  const cut = CUTS[L.cut], civ = !!cut.civ;
  const fab = FABRICS[L.fabric];
  const det = civ ? [] : L.details.map(id => DETAILS[id]);
  const tr = L.treat.filter(Boolean);
  const c = { cloth: 0, dye: 0, hours: 0, food: 0, med: 0, arms: 0 };
  c.cloth = (civ ? 0 : Math.ceil((cut.cloth + sum(det.map(d => d.cloth))) * fab.mult)) + LOADS[L.load].cloth;
  c.dye = (civ ? 0 : PATTERNS[L.pattern].dye) + sum(tr.map(t => TREATMENTS[t.id].dye[t.s - 1])) + INSIGNIA[L.insignia].dye;
  c.hours = cut.hours + sum(det.map(d => d.hours)) + (civ ? 0 : PATTERNS[L.pattern].hours) + tr.length + LOADS[L.load].hours + INSIGNIA[L.insignia].hours
    + sum(L.arms.map(a => ARMS[a].maint)) + (DISTRIB[L.distrib].hours || 0) + (DECEPTION[L.deception].hours || 0) + drRetool(L, st);
  c.food = sum(L.rations.map(r => RATIONS[r].cost)) + (L.arms.includes('horses') ? ARMS.horses.food : 0);
  c.med = sum(L.med.map(m => MEDKIT[m].cost));
  c.arms = sum(L.arms.map(a => ARMS[a].cost));
  return c;
}
const drRetool = (L, st) => (st && st.lastCut && st.lastCut !== L.cut && !CUTS[L.cut].civ) ? 3 : 0;
function drOver(L, st) { const c = drCosts(L, st); return DR_RES.filter(r => c[r] > st.stock[r]); }

/* ---------- uniform ---------- */
function drUniform(L, op) {
  const cut = CUTS[L.cut], civ = !!cut.civ;
  const fab = civ ? { weight: 2, warm: 1, breath: 3, dur: 1, fire: 0, wet: 0, chem: 0 } : FABRICS[L.fabric];
  const det = civ ? [] : L.details.map(id => DETAILS[id]);
  const load = LOADS[L.load];
  const tr = L.treat.filter(Boolean);
  const T = id => tr.find(t => t.id === id);
  const si = id => T(id) ? T(id).s - 1 : -1;
  const U = {};
  U.mob = cut.mob + sum(det.map(d => d.mob)) - fab.weight - load.weight - (T('phos') ? TREATMENTS.phos.stiff[si('phos')] : 0);
  U.warm = cut.warm + sum(det.map(d => d.warm)) + fab.warm;
  U.breath = fab.breath + sum(det.map(d => d.vent)) - (T('wax') ? TREATMENTS.wax.breath[si('wax')] : 0);
  U.dur = cut.prot + sum(det.map(d => d.dur)) + fab.dur;
  U.access = cut.access + sum(det.map(d => d.access)) + load.access;
  U.ammo = load.ammo + sum(det.map(d => d.cap)) + (cut.cap || 0);
  U.weight = fab.weight + load.weight + (L.details.includes('quilting') && !civ ? 2 : 0) + (L.cut === 'quilt' ? 3 : 0);
  if (civ) U.conceal = CIV_CONCEAL[op.terrain];
  else {
    const p = PATTERNS[L.pattern], c1 = COLORS[L.color].m[op.terrain];
    const base = L.pattern === 'solid' ? c1 : 0.6 * c1 + 0.4 * COLORS[L.color2].m[op.terrain];
    U.conceal = base * (p[op.terrain] || p.mult);
  }
  U.conceal = Math.min(10, Math.round(U.conceal * 10) / 10);
  const wetOp = op.haz.wet >= 3;
  U.p = {
    insects: clamp((T('perm') ? TREATMENTS.perm.eff[si('perm')] + (T('wax') ? 0.05 : 0) : 0) + sum(det.map(d => d.insect)), 0, 0.95),
    fire: clamp(fab.fire + (T('phos') ? TREATMENTS.phos.eff[si('phos')] * (T('wax') ? 0.5 : 1) * (wetOp ? 0.5 : 1) : 0) - (T('wax') ? TREATMENTS.wax.fire[si('wax')] : 0), -0.8, 0.95),
    wet: clamp((T('wax') ? TREATMENTS.wax.eff[si('wax')] : 0) + fab.wet + sum(det.map(d => d.wet)) - (L.details.includes('quilting') && !civ ? 0.1 : 0) + (L.cut === 'smock' ? 0.05 : 0), -0.3, 0.9),
    chem: clamp((cut.chem || 0) + (fab.chem || 0) + (T('wax') ? 0.3 : 0), 0, 0.85),
    micro: clamp((T('copper') ? TREATMENTS.copper.eff[si('copper')] : 0) + (T('chitosan') ? TREATMENTS.chitosan.eff[si('chitosan')] : 0) + (T('copper') && T('chitosan') ? 0.1 : 0), 0, 0.85),
  };
  U.irr = sum(tr.map(t => (TREATMENTS[t.id].irr || [0, 0, 0])[t.s - 1]));
  U.notes = [];
  if (T('wax') && T('phos')) U.notes.push('The wax film seals the phosphate away from any flame: flame retardancy halved.');
  if (T('wax') && T('perm')) U.notes.push('Wax helps the permethrin survive the rain.');
  if (T('copper') && T('chitosan')) U.notes.push('Chitosan binds the copper ions: a stronger, longer-lasting antimicrobial finish.');
  if (T('phos') && wetOp && !T('wax')) U.notes.push('Phosphate is water-soluble: in this wet a lot of it will wash out.');
  if (fab.fire < 0) U.notes.push('Nylon melts in fire. Any flame becomes a skin burn.');
  return U;
}

/* ---------- derived force stats ---------- */
function drDerive(L, st, op) {
  const U = drUniform(L, op);
  const has = a => L.arms.includes(a);
  const med = id => L.med.includes(id);
  const R = L.rations.map(r => RATIONS[r]);
  const kcal = sum(R.map(r => r.kcal));
  const kratio = kcal / op.kcal + (L.load === 'ruck' ? 0.06 : 0);
  const rw = sum(R.map(r => r.w)), smoke = sum(R.map(r => r.smoke)), vit = sum(R.map(r => r.vit));
  const rmor = sum(R.map(r => r.mor)) + (R.length >= 5 ? 2 : 0);
  const apAvg = sum(FACTION_ORDER.filter(f => f !== 'critique').map(f => st.appr[f])) / 5;
  const D = { U, kcal, kratio, rw, smoke, vit };
  const transport = Math.min(24, sum(L.arms.filter(a => ARMS[a].mobT).map(a => ARMS[a].mobT[op.terrain])));
  D.transport = transport;
  D.FIRE = Math.round(30 + sum(L.arms.map(a => ARMS[a].fire)) + U.ammo * 2.2 + (L.distrib === 'shock' ? 3 : 0));
  D.MOB = Math.round(clamp(38 + U.mob * 2.2 + transport - Math.max(0, rw - 7) * 1.5, 5, 100));
  D.C2 = Math.round(clamp(25 + (has('radio') ? ARMS.radio.c2 : 0) + INSIGNIA[L.insignia].c2 + (st.appr.staff - 50) * 0.2 + (L.line === 'discipline' ? 4 : 0), 5, 100));
  D.CON = Math.round(clamp(U.conceal * 6 + (DECEPTION[L.deception].con || 0) - smoke * 1.5 + (CUTS[L.cut].civ && op.terrain === 'urban' ? 6 : 0), 0, 100));
  const lineMor = { discipline: 2, land: op.pop === 'rural' ? 9 : 2, equality: 5, inter: op.pop === 'urban' ? 6 : 2, bread: kratio >= 1 ? 7 : -3 }[L.line];
  const distMor = { equal: 4, shock: -2, need: 5 }[L.distrib];
  const redMor = !CUTS[L.cut].civ && (L.color === 'red' || (L.pattern !== 'solid' && L.color2 === 'red')) ? 3 : 0;
  const itch = !CUTS[L.cut].civ && L.fabric === 'serge' && op.heat >= 2 ? -4 : 0;
  const party = !CUTS[L.cut].civ && L.pattern === 'confetti' ? 5 : 0;

function drSickness(L, st, op, U, D) {

    const mal = op.terrain === 'marsh';
    const f = mal && med('antimal') ? 0.4 : 1;
    const n = F * h.insects * k * (1 - U.p.insects) * f;

  }

    const n = F * h.fire * k * (1 - U.p.fire);

  }

  }
  const coldLvl = op.warmNeed / 3;
  if (op.warmNeed >= 5) {
    const ratio = U.warm / op.warmNeed;
    const n = F * coldLvl * k * Math.max(0, 1 - ratio) * 1.6 * (med('foot') ? 0.8 : 1);
    add('cold', op.warmNeed >= 12 ? 'Frostbite & hypothermia' : 'Cold injuries', n, F * coldLvl * k * 1.6 * 0.6, n * 0.05, 'warmer cut, quilting, wool, hoods');
  }

    add('heat', 'Heat exhaustion', n, F * op.heat * 0.008 * 0.6, 0, 'breathable fabric, vents, less insulation');
  }

    const n = F * h.chem * k * (1 - U.p.chem);
    add('chem', 'Chemical skin burns', n, F * h.chem * k, 0, 'coverall, canvas, wax proofing');
  }
  if (h.water) {
    const n = F * h.water * k * (1 - (med('water') ? 0.7 : 0));
    add('water', 'Dysentery', n, F * h.water * k, n * 0.08 * (med('ors') ? 0.2 : 1), 'water tablets, rehydration salts');
  }
  if (st.scurvy >= 2) add('scurvy', 'Scurvy', F * 0.02 * (st.scurvy - 1), 0, 0, 'pickled cabbage, onions, dried fruit');
  if (U.irr >= 2) add('irr', 'Chemical rashes from your finishes', F * 0.004 * U.irr, 0, 0, 'lighter treatment strengths');
  return out;
}

/* ---------- staff projection (no dice) ---------- */

/* ---------- factions ---------- */
function drFactionDeltas(L, st, op, R) {

  ({ rank: () => A('staff', 8, 'rank'), none: () => A('staff', -6, 'norank'), star: () => A('staff', 2, 'pos'), elected: () => A('staff', 1, 'pos') })[L.insignia]?.();

  if (L.echelon === 'deep') A('staff', 3, 'deep'); if (L.echelon === 'allin') A('staff', -4, 'allin');
  if (L.distrib === 'shock') A('staff', 4, 'shock');

  if (L.insignia === 'star') A('bunker', 5, 'star');

  if (L.insignia === 'rank') A('commune', -6, 'rank'); if (L.insignia === 'none') A('commune', 3, 'pos');

/* apply a resolved operation to the campaign state; returns the full report */

/* terrain backdrops */
function drawTerrain(ctx, terrain, w, h, t = 0) {
  const R = (x, y, ww, hh, c) => { ctx.fillStyle = c; ctx.fillRect(x, y, ww, hh); };
  const hz = Math.round(h * 0.38);
  switch (terrain) {
    case 'steppe':
      R(0, 0, w, hz, '#efd9a0'); R(0, hz, w, h - hz, '#b99a52');
      for (let y = hz + 2; y < h; y += 3) for (let x = (y % 2) * 2; x < w; x += 4) R(x, y, 2, 1, '#a3843e');
      R(Math.round(w * 0.7), hz - 9, 5, 9, '#8d7a5a'); R(Math.round(w * 0.7) + 5, hz - 6, 4, 6, '#8d7a5a'); break;
    case 'marsh':
      R(0, 0, w, hz, '#b7c2b0'); R(0, hz, w, h - hz, '#6d7a4a');
      for (let y = hz + 4; y < h; y += 7) R(0, y, w, 2, '#5f7f84');
      for (let x = 1; x < w; x += 3) { const hh = 5 + Math.floor(hsh(x, 1) * 9); R(x, hz + 2 - hh + 6, 1, hh, '#4e5a2c'); } break;
    case 'forest':
      R(0, 0, w, h, '#3f5a33'); for (let i = 0; i < w; i += 2) R(i, Math.floor(hsh(i, 2) * 6), 2, 8, '#57753f');
      for (let x = 2; x < w; x += 11) { R(x, 0, 3, h, '#e7e5dc'); for (let y = 2; y < h; y += 4) R(x + (y % 8 ? 0 : 1), y, 2, 1, '#26252b'); }
      R(0, h - 8, w, 8, '#5b4a2e'); for (let x = 0; x < w; x += 3) R(x, h - 9, 2, 1, '#8a7a3a'); break;
    case 'urban':
      R(0, 0, w, h, '#6a6d70'); for (let y = 0; y < h; y += 4) for (let x = (y / 4 % 2) * 4; x < w; x += 8) R(x, y, 7, 3, '#5a5d60');
      R(Math.round(w * 0.15), 6, 8, 10, '#1f1f22'); R(Math.round(w * 0.65), 4, 10, 12, '#1f1f22'); R(0, h - 6, w, 6, '#4a4c4f'); break;
    case 'snow':
      R(0, 0, w, hz, '#cfd8e2'); R(0, hz, w, h - hz, '#eef2f5');
      for (let y = hz + 3; y < h; y += 5) for (let x = (y % 3) * 3; x < w; x += 9) R(x, y, 5, 1, '#c8d3df');
      for (let i = 0; i < 12; i++) { const fx = (hsh(i, 5) * w + t / 60 * (1 + i % 3)) % w; const fy = (hsh(i, 9) * h + t / 30) % h; R(fx | 0, fy | 0, 1, 1, '#ffffff'); } break;
    case 'thaw':
      R(0, 0, w, hz, '#a9adb0'); R(0, hz, w, h - hz, '#6e5638');
      for (let i = 0; i < 9; i++) R(Math.floor(hsh(i, 4) * w), hz + 3 + Math.floor(hsh(i, 6) * (h - hz - 6)), 6 + (i % 3) * 3, 2, '#e3e6e8');
      for (let x = 0; x < w; x += 4) R(x, hz - 6, 1, 6, '#4a3a2a'); R(0, hz - 4, w, 1, '#4a3a2a'); break;
  }
}

/* operational map for reports (160×56) */
const TERRAIN_C = { steppe: ['#b99a52', '#a3843e'], marsh: ['#6d7a4a', '#5f7f84'], forest: ['#3f5a33', '#57753f'], urban: ['#6a6d70', '#5a5d60'], snow: ['#e3e9ef', '#c8d3df'], thaw: ['#6e5638', '#8a7050'] };
function drawOpMap(ctx, op, R, k) {
  const W = 160, H = 56, [a, b] = TERRAIN_C[op.terrain];
  ctx.fillStyle = a; ctx.fillRect(0, 0, W, H);
  for (let x = 0; x < W; x += 6) for (let y = (x / 6 % 2) * 3; y < H; y += 6) { ctx.fillStyle = b; ctx.fillRect(x, y, 3, 2); }
  const X0 = 14, X1 = 128; /* start line, objective */
  const xAt = f => X0 + (X1 - X0) * f;
  /* enemy belts in the tactical zone */
  for (let i = 0; i < op.enemy.belts; i++) { const x = X0 + 10 + i * 9; for (let y = 4; y < H - 4; y += 3) { ctx.fillStyle = '#1a1414'; ctx.fillRect(x, y, 2, 2); } }
  /* reserve */
  ctx.fillStyle = '#3b3b8a'; ctx.fillRect(xAt(0.62), 8, 8, 6); ctx.fillStyle = '#f1e7d0'; ctx.fillRect(xAt(0.62) + 2, 10, 4, 2);
  /* objective */
  blit(ctx, ICONS.flag, X1 - 1, 18);
  ctx.fillStyle = 'rgba(20,17,19,.5)'; for (let y = 2; y < H; y += 4) ctx.fillRect(xAt(R ? R.target : 1), y, 1, 2);
  /* start line */
  ctx.fillStyle = '#c8372d'; ctx.fillRect(X0 - 2, 2, 2, H - 4);
  if (!R) return;
  const p1f = { clean: 0.32, costly: 0.25, stalled: 0.1 }[R.P1];
  const g1 = Math.min(1, k * 2) * p1f;
  const g2 = Math.max(0, Math.min(1, (k - 0.4) / 0.6)) * R.reached;
  arrow(ctx, X0, 38, xAt(g1), '#c8372d');
  if (R.reached > 0 && k > 0.4) arrow(ctx, X0, 28, xAt(Math.max(g1, g2)), '#7a1d16');
}
function arrow(ctx, x0, y, x1, c) {
  if (x1 - x0 < 2) return;
  ctx.fillStyle = '#141113'; ctx.fillRect(x0, y - 2, x1 - x0, 5);
  ctx.fillStyle = c; ctx.fillRect(x0, y - 1, x1 - x0, 3);
  ctx.fillStyle = '#141113'; ctx.fillRect(x1, y - 4, 2, 9); ctx.fillRect(x1 + 2, y - 3, 2, 7); ctx.fillRect(x1 + 4, y - 2, 2, 5); ctx.fillRect(x1 + 6, y - 1, 1, 3);
  ctx.fillStyle = c; ctx.fillRect(x1, y - 3, 2, 7); ctx.fillRect(x1 + 2, y - 2, 2, 5); ctx.fillRect(x1 + 4, y - 1, 2, 3);
}

function beep(f = 660, d = 0.06, type = 'square', v = 0.035) {
  if (S.muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.value = f; o.connect(g); g.connect(AC.destination);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.start(t); o.stop(t + d + 0.02);
  } catch (e) {}
}
const seq = (notes, gap = 90, d = 0.09, type) => notes.forEach((f, i) => setTimeout(() => beep(f, d, type), i * gap));

  else if (left <= 0) say('NURSE PIKA', `That's everyone for day ${S.day}. Nice work! Ready for tomorrow?`, 'sys');
  else say('NURSE PIKA', `Day ${S.day}. ${left} patient${left === 1 ? ' is' : 's are'} waiting. Watch out for allergies and drug interactions!`, 'sys');
}

}
function panelHTML() {
  switch (UI.tab) {
    case 'talk': return talkHTML();

/* ====================== ACTIONS ====================== */
function startOrNext() {
  if (!S.started) { S.started = true; S.dayLen = PATIENTS_PER_DAY(S.lvl); persist(); howto(true); return; }
  if (S.dayDone >= dayLen()) { S.day++; S.dayDone = 0; S.dayScores = []; S.clock = 0; S.dayLen = PATIENTS_PER_DAY(S.lvl); }
  nextPatient();
}
function nextPatient() {
  const seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
  P = genPatient(S.lvl, seed, S.recent);
  CS = newCaseState();
  UI.tab = 'talk'; UI.filter = 'All';
  UI.anim = { phase: 'in', t0: performance.now() };
  persist(); renderAll();
  say('', '…', 'sys', false);
  SFX.tap();
  setTimeout(() => { if (P) { say(speaker(), P.complaint); UI.talkUntil = performance.now() + 1800; persist(); } }, 1400);
}
function ask(id) {
  if (!CS.asked.includes(id)) { CS.asked.push(id); if (!(P.told || []).includes(id)) CS.time += 1; }
  say(speaker(), P.ans[id]); UI.talkUntil = performance.now() + 1500; SFX.blip();
  persist(); renderPanel(); renderHud();
}
function exam(id) {
  const t = TOOL[id];
  if (t.lvl > S.lvl) { toast(`${t.n} unlocks at ${RANKS[t.lvl - 1].t} (LV${t.lvl})`); return; }
  if (!CS.exams.includes(id)) { CS.exams.push(id); CS.time += t.t; }
  say('EXAM · ' + t.n.toUpperCase(), P.find[id].join('\n'), 'exam');
  UI.fx = { icon: id, until: performance.now() + 1500 }; SFX.tool();
  persist(); renderPanel(); renderHud();
}
function openDoc(id) {
  if (!CS.docs.includes(id)) { CS.docs.push(id); CS.time += 1; }
  SFX.paper(); persist(); renderPanel(); renderHud();
  const d = P.docs.find(x => x.id === id);
  let body = '';
  if (d.rows) body = `<table>${d.rows.map(([a, b]) => `<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join('')}</table>`;
  else body = `<ul>${d.lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul>`;
  const head = { card: 'PIXEL HEALTH INSURANCE', allergy: '⚠ ALLERGY PASS', meds: 'MEDICATION PLAN', letter: 'ST. PIXEL HOSPITAL · DISCHARGE LETTER', lab: 'LAB REPORT (last year)', slip: 'PRESCRIPTION SLIP' }[d.kind];
  modal(`<button class="x" data-act="close">CLOSE</button><h2>${esc(d.t.toUpperCase())}</h2>
    <div class="paper ${d.kind}"><div class="ph">${esc(head)}<span>${esc(P.name)}</span></div>${body}
    ${d.kind === 'letter' ? '<p style="margin:10px 0 0">Please continue current medication. Kind regards, Dr. Byte</p>' : ''}
    ${d.kind === 'meds' ? '<p style="margin:10px 0 0;font-size:19px">Plan printed by family doctor. Over-the-counter products not listed.</p>' : ''}
    ${d.kind === 'card' || d.kind === 'allergy' ? '' : '<span class="stamp">VERIFIED</span>'}</div>`);
}
function toggleRx(id) {
  const i = CS.rx.indexOf(id);
  if (i >= 0) CS.rx.splice(i, 1);
  else { if (CS.rx.length >= 5) { toast('Max 5 orders. Remove one first.'); return; } CS.rx.push(id); }
  SFX.tap(); persist(); renderPanel();
}
function toggleStop(id) { const i = CS.stops.indexOf(id); if (i >= 0) CS.stops.splice(i, 1); else CS.stops.push(id); SFX.tap(); persist(); renderPanel(); }
function toggleRefer() { CS.refer = !CS.refer; SFX.tap(); persist(); renderPanel(); }

function drugInfo(id, free) {
  const D = DRUGS[id];
  if (!free && P && !CS.looks.includes('d:' + id)) { CS.looks.push('d:' + id); CS.time += 1; persist(); renderHud(); }

    <h3 style="font-family:var(--font-d);font-size:9px;color:var(--mute)">WATCH OUT FOR</h3>
    ${c.length ? `<ul class="caut">${c.map(x => `<li class="${x.sev}"><b>${x.sev.toUpperCase()}</b>${esc(x.msg)}</li>`).join('')}</ul>` : '<p class="hint">No major interactions in this game. A safe choice for most patients.</p>'}
    ${P && !free ? '<div class="row"><button class="btn primary" data-act="rxclose" data-id="' + id + '">' + (CS.rx.includes(id) ? 'REMOVE FROM ORDERS' : 'ADD TO ORDERS') + '</button></div>' : ''}`);

function dxPicker(q = '') {

  const groups = SYS.filter(s => pool.some(d => d.sys === s));
  const html = groups.map(s => `<div class="dxg">${esc(s.toUpperCase())}</div>${pool.filter(d => d.sys === s).map(d => `<div class="dxr ${CS.dx === d.id ? 'sel' : ''}"><button class="main" data-act="dx" data-id="${d.id}">${esc(d.n)}</button><button class="inf" data-act="dxinfo" data-id="${d.id}" aria-label="About ${esc(d.n)}">i</button></div>`).join('')}`).join('');

function dxInfo(id, free) {

function confirmSign() {

  modal(`<button class="x" data-act="close">BACK</button><h2>SIGN THE CHART?</h2>

    <div class="row"><button class="btn" data-act="close">KEEP WORKING</button><button class="btn primary" data-act="finish">SIGN</button></div>`);

function finish() {
  const res = gradeCase(P, CS, S.lvl);
  const pBefore = P, prevLvl = S.lvl;
  const leveled = recordResult(S, P, res);
  S.clock += CS.time + 4;
  UI.outLook = pBefore.look; UI.anim = { phase: 'out', t0: performance.now() };
  P = null; CS = null; persist();
  res.score >= 85 ? SFX.good() : res.score >= 55 ? SFX.ok() : SFX.bad();
  report(res, pBefore, prevLvl, leveled);
  renderAll();
  say('NURSE PIKA', res.score >= 85 ? 'Great work, Doctor!' : res.score >= 55 ? 'Not bad. Check the report for tips.' : 'Ouch. Let\'s review what went wrong.', 'sys', false);
}

/* ---------- report ---------- */
function report(r, p, prevLvl, leveled) {
  const d = r.correct;
  const right = r.chosen === d.id, close = !right && (d.related || []).includes(r.chosen);
  const part = (label, pts, max, items) => `<div class="part"><div class="ph2"><span>${label}</span><b>${pts}/${max}</b></div><div class="pbar"><i style="width:${Math.round(100 * pts / max)}%"></i></div><ul>${items}</ul></div>`;
  const dxItems = right ? `<li class="ok">${esc(d.n)}</li>` : `<li class="no">You said: ${esc(nameOf(r.chosen))}</li><li class="info">Actually: ${esc(d.n)}${close ? ' (close!)' : ''}</li>`;
  const txItems = r.txNotes.map(n => `<li class="${n.ok ? 'ok' : 'no'}">${esc(n.t)}</li>`).join('') || '<li class="ok">Nothing required</li>';
  const thItems = r.missed.length ? r.missed.map(m => `<li class="no">${m.why ? `Missed: ${esc(m.why)}. ` : 'Missed a key clue. '}${esc(m.how.slice(0, 2).join(' or '))}</li>`).join('') : '<li class="ok">You found every key clue</li>';
  const efItems = `<li class="info">${r.time} min used · target about ${r.par} min</li>`;
  const pr = rankProgress(S);
  const dayOver = S.dayDone >= dayLen();
  UI.after = { leveled, prevLvl, dayOver };
  modal(`<h2>VISIT REPORT · ${esc(p.name.toUpperCase())}</h2>
    <div class="rep-top"><div class="grade g-${r.letter}">${r.letter}</div><div class="rep-score">${r.score}/100<small>${gradeLine(r.letter)}</small></div></div>
    <div class="parts">
      ${part('DIAGNOSIS', r.dxPts, 35, dxItems)}
      ${part('TREATMENT', r.txPts, 35, txItems)}
      ${part('INVESTIGATION', r.thorPts, 15, thItems)}
      ${part('EFFICIENCY', r.effPts, 15, efItems)}
    </div>
    ${r.issues.length ? `<h2 style="font-size:10px;color:var(--bad)">MISTAKES</h2>${r.issues.map(i => `<div class="issue ${i.sev}"><b>${i.sev.toUpperCase()}</b><span>${esc(i.msg)}</span><em>−${i.pts}</em></div>`).join('')}` : ''}
    ${r.good.length ? r.good.map(g => `<div class="goodl">${esc(g.msg)}${g.pts ? ` <b style="color:var(--good);font-weight:normal">+${g.pts}</b>` : ''}</div>`).join('') : ''}
    <div class="teach"><b>DOCTOR'S NOTE</b>${esc(d.teach)}</div>
    ${leveled ? '' : pr.max ? '' : `<div class="card" style="margin-top:10px"><span class="k">PROMOTION TRACK</span><div class="meter"><i style="width:${Math.min(100, pr.avg)}%"></i><b style="left:${pr.target}%"></b></div><span class="hint" style="margin:0">${pr.n}/${pr.need} patients · average ${pr.avg} (need ${pr.target})</span></div>`}
    <div class="row"><button class="btn primary big" data-act="afterReport">${leveled ? 'CONTINUE ★' : dayOver ? 'END OF DAY' : 'NEXT PATIENT'}</button></div>`);
}
function gradeLine(l) { return { S: 'Flawless! Textbook medicine.', A: 'Excellent care.', B: 'Good job, a few slips.', C: 'Patient survived. Review the notes.', D: 'Risky visit. Learn from the mistakes.', F: 'That went badly. Check every mistake below.' }[l]; }
function afterReport() {
  const a = UI.after || {}; UI.after = null;
  if (a.leveled) { levelUp(a.leveled, a.dayOver); return; }
  if (a.dayOver) { daySummary(); return; }
  closeModal(); nextPatient();
}
function levelUp(lvl, dayOver) {
  SFX.level();
  const u = unlocksFor(lvl);
  const rows = []

function sceneOpts(ts) {
  const a = UI.anim; let patient = null, door = 0;
  const look = P ? Object.assign({ seed: P.seed % 997 }, P.look) : UI.outLook;
  if (a.phase === 'in' && P) {
    const k = Math.min(1, (ts - a.t0) / 1300); door = k < 0.95 ? 1 : 0;
    patient = { x: 136 - 40 * k, walking: k < 1, look };
    if (k >= 1) a.phase = 'idle';
  } else if (a.phase === 'out' && UI.outLook) {
    const k = Math.min(1, (ts - a.t0) / 1300); door = k > 0.05 ? 1 : 0;
    patient = { x: 96 + 40 * k, walking: k < 1, look: UI.outLook };
    if (k >= 1) { a.phase = 'none'; UI.outLook = null; }
  } else if (P) patient = { x: 96, walking: false, look, talking: ts < UI.talkUntil };
  return { t: ts, lvl: S.lvl, clock: 480 + S.clock + (CS ? CS.time : 0), patient, door, fx: UI.fx && ts < UI.fx.until ? UI.fx : null };
}
let lastDraw = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (ts - lastDraw < (reduced ? 250 : 70)) return; lastDraw = ts;
  document.querySelectorAll('canvas[data-scene]').forEach(cv => {
    const ctx = cv.getContext('2d');
    if (cv.dataset.scene.startsWith('dr-')) { drScene(cv, ts); return; }
    if (cv.dataset.scene === 'hub') drawScene(ctx, { t: ts, lvl: Math.max(5, S.lvl), clock: 540 + (ts / 400) % 540, patient: { x: 96, look: DEMO, talking: Math.floor(ts / 2600) % 2 === 1 }, fx: Math.floor(ts / 2600) % 3 === 2 ? { icon: 'thermo' } : null });
    else drawScene(ctx, sceneOpts(ts));
  });
}

function drBlowHints(L, op) {

  const tryIt = (label, mod) => { const x = JSON.parse(JSON.stringify(L)); mod(x); const P = drProject(x, DRS, op); const g = (P.shock - P.defense) - (P0.shock - P0.defense); if (g >= 3) out.push({ label, g }); };
  if (L.frontage !== 'narrow') tryIt(op.doctrine === 'strong' ? 'narrow frontage (risky in streets)' : 'narrow frontage', x => x.frontage = 'narrow');
  ['lmg', 'slr', 'mortar', 'at', 'eng'].forEach(a => { if (!L.arms.includes(a)) tryIt(`${ARMS[a].n.toLowerCase()} (${ARMS[a].cost} arms)`, x => x.arms.push(a)); });
  const bestC = Object.keys(COLORS).sort((a, b) => COLORS[b].m[op.terrain] - COLORS[a].m[op.terrain])[0];
  if (!CUTS[L.cut].civ && L.color !== bestC) tryIt(`${COLORS[bestC].n.toLowerCase()} uniforms`, x => { x.color = bestC; x.color2 = bestC; });
  if (L.echelon !== 'allin') tryIt('a heavier first echelon', x => x.echelon = 'allin');
  return out.sort((a, b) => b.g - a.g).slice(0, 4);
}
const sec = (t, inner, note) => `<section class="dr-sec"><h3><span>${t}</span>${note ? `<em>${note}</em>` : ''}</h3>${inner}</section>`;
const tagz = arr => arr.filter(Boolean).map(x => `<i>${x}</i>`).join('');
function opt(k, v, title, sub, tags, sel, dis) {
  return `<button class="opt" data-dr="set" data-k="${k}" data-v="${v}" aria-pressed="${sel}" ${dis ? 'disabled' : ''}><span class="t">${esc(title)}</span>${sub ? `<small>${esc(sub)}</small>` : ''}<span class="fx">${tagz(tags)}</span></button>`;
}
function tog(k, v, title, tags, sel, dis) {
  return `<button class="chip2" data-dr="tog" data-k="${k}" data-v="${v}" aria-pressed="${sel}" ${dis ? 'disabled' : ''}>${esc(title)}${tags && tags.length ? `<small>${tagz(tags)}</small>` : ''}</button>`;
}
const cst = o => [o.cloth && `${o.cloth} cloth`, o.dye && `${o.dye} dye`, o.hours && `${o.hours} h`].filter(Boolean).join(' · ');

function drBriefHTML() {
  const op = curOp(), e = op.enemy;
  const hz = Object.entries(op.haz).filter(([, v]) => v).map(([k, v]) => `<span class="hz">${HAZ_N[k]} <b>${'■'.repeat(v)}${'□'.repeat(4 - v)}</b></span>`);
  if (op.warmNeed >= 7) hz.push(`<span class="hz">Cold <b>${'■'.repeat(Math.min(4, Math.round(op.warmNeed / 3.3)))}${'□'.repeat(4 - Math.min(4, Math.round(op.warmNeed / 3.3)))}</b></span>`);
  if (op.heat) hz.push(`<span class="hz">Heat <b>${'■'.repeat(op.heat)}${'□'.repeat(4 - op.heat)}</b></span>`);
  const last = DRS.reports[DRS.reports.length - 1];
  return `${sec('DIRECTIVE FROM THE COUNCIL', `<div class="dr-paper"><div class="ph">OPERATION ${esc(op.n)}<span>${esc(op.season.toUpperCase())}</span></div><p>${esc(op.brief)}</p>

    <tr><td>Terrain</td><td>${esc(TERRAIN_N[op.terrain])}${op.river ? ', river line' : ''}</td></tr><tr><td>Population</td><td>${op.pop === 'rural' ? 'Villages and collective farms' : 'Workers\' districts'}</td></tr>
    <tr><td>Rations needed</td><td>${op.kcal} kcal a day</td></tr><tr><td>Warmth needed</td><td>${op.warmNeed}${op.heat ? ' (and it will be hot)' : ''}</td></tr></table></div>`)}
  ${sec('ENEMY PLAN', drEnemyPlanHTML(op), 'partisan intelligence')}
  ${sec('ENEMY & ENVIRONMENT', `<div class="dr-kv"><span>Defence <b>${e.def}</b></span><span>Belts <b>${e.belts}</b></span><span>Reserve <b>${e.reserve}</b></span><span>Armor <b>${e.armor ? '■'.repeat(e.armor) : 'none'}</b></span></div><div class="hzs">${hz.join('')}</div>`)}
  ${sec('THE COLUMN', `<div class="dr-kv"><span>Fighters <b>${DRS.force}</b></span><span>Scurvy <b>${DRS.scurvy >= 2 ? 'spreading' : DRS.scurvy === 1 ? 'warning' : 'none'}</b></span><span>Caffeine crash <b>${DRS.caffDebt ? 'yes' : 'no'}</b></span></div>
    ${last ? `<p class="hint">Last operation: ${esc(OPS.find(o => o.id === last.op).n)}, grade ${last.letter}, ${last.km} km, ${last.dead} dead.</p>` : ''}`)}
  ${sec('FACTIONS', `<div class="facs">${FACTION_ORDER.map(f => `<button class="fac" data-dr="fac" data-v="${f}"><span>${esc(FACTIONS[f].n)}</span><div class="sbar"><i style="width:${DRS.appr[f]}%"></i></div><small>${DRS.appr[f]} · affects ${esc(FACTIONS[f].eff.split('.')[0].toLowerCase())}</small></button>`).join('')}</div>`, 'tap for details')}
  <div class="dr-next"><button class="btn primary big block" data-dr="tab" data-v="atelier">TO THE ATELIER ▸</button></div>`;
}

function drAtelierHTML() {
  const L = DRS.L, op = curOp(), U = drUniform(L, op), civ = !!CUTS[L.cut].civ;
  const bar = (lab, v, max, txt, good = true) => `<div class="stat"><span>${lab}</span><div class="sbar"><i style="width:${clamp(v / max, 0, 1) * 100}%;background:${good ? 'var(--good)' : 'var(--bad)'}"></i></div><b>${txt}</b></div>`;
  const prot = [['Insects', U.p.insects], ['Fire', U.p.fire], ['Wet', U.p.wet], ['Chemical', U.p.chem], ['Microbes', U.p.micro]].filter(([, v]) => v !== 0).map(([n, v]) => `<i class="${v < 0 ? 'neg' : ''}">${n} ${Math.round(v * 100)}%</i>`).join('');
  const preview = `<div class="dr-prev"><canvas data-fighter="cur" width="48" height="64" aria-label="Preview of your uniform on ${esc(TERRAIN_N[op.terrain])}"></canvas>
    <div class="dr-stats">
      <label class="nm"><span>LOOK NAME</span><input id="lookname" maxlength="28" placeholder="Name this look…" value="${esc(L.name || '')}"></label>
      ${bar('Mobility', U.mob + 10, 24, sgn(U.mob))}
      ${bar('Warmth', U.warm, op.warmNeed * 1.4, `${U.warm}/${op.warmNeed}`, U.warm >= op.warmNeed && !(op.heat && U.warm > op.warmNeed + 4))}
      ${bar('Conceal', U.conceal, 10, `${U.conceal}`, U.conceal >= 6)}
      ${bar('Durability', U.dur, 14, `${U.dur}`)}
      ${bar('Medic access', U.access + 5, 15, sgn(U.access), U.access >= 0)}
      <div class="prot">${prot || '<i>No protective finishes</i>'}</div>
    </div></div>
    ${U.notes.length ? `<div class="labnotes">${U.notes.map(n => `<p>⚗ ${esc(n)}</p>`).join('')}</div>` : ''}`;
  const cuts = Object.entries(CUTS).map(([id, c]) => opt('cut', id, c.n, c.sub, [`MOB ${sgn(c.mob)}`, `WARM ${c.warm}`, `ACCESS ${sgn(c.access)}`, cst(c) || 'free'], L.cut === id)).join('');
  const dets = Object.entries(DETAILS).map(([id, d]) => tog('details', id, d.n, [d.mob && `MOB ${sgn(d.mob)}`, d.warm && `WARM +${d.warm}`, d.access && `ACCESS +${d.access}`, d.dur && `DUR +${d.dur}`, d.cap && 'AMMO +2', d.vent && 'VENT', d.insect && 'INSECTS', cst(d)], L.details.includes(id), civ || (!L.details.includes(id) && L.details.length >= 3))).join('');
  const fabs = Object.entries(FABRICS).map(([id, f]) => opt('fabric', id, f.n, f.desc, [`WT ${f.weight}`, `WARM ${f.warm}`, `BREATH ${f.breath}`, `DUR ${f.dur}`, f.fire < 0 ? 'MELTS' : f.fire >= 0.4 ? 'CHARS' : '', `×${f.mult} cloth`], L.fabric === id, civ)).join('');
  const sw = k => `<div class="swatches">${Object.entries(COLORS).map(([id, c]) => `<button class="sw" data-dr="set" data-k="${k}" data-v="${id}" aria-pressed="${L[k] === id}" aria-label="${esc(c.n)}" ${civ ? 'disabled' : ''}><i style="background:${c.c}"></i><small>${esc(c.n)}</small><em>${c.m[op.terrain]}/10</em></button>`).join('')}</div>`;
  const pats = Object.entries(PATTERNS).filter(([id, p]) => !p.secret || DRS.bday).map(([id, p]) => opt('pattern', id, p.n, '', [`×${p[op.terrain] || p.mult} conceal here`, cst(p)], L.pattern === id, civ)).join('');
  const treatSlot = i => {
    const t = L.treat[i];
    return `<div class="tslot"><div class="chips2">${['none'].concat(Object.keys(TREATMENTS)).map(id => {
      const T = TREATMENTS[id]; const sel = id === 'none' ? !t : t && t.id === id; const other = L.treat[1 - i];
      return `<button class="chip2" data-dr="treat" data-k="${i}" data-v="${id}" aria-pressed="${!!sel}" ${other && other.id === id ? 'disabled' : ''}>${id === 'none' ? 'Empty' : esc(T.n)}${id !== 'none' ? `<small><i>${esc(T.role)}</i></small>` : ''}</button>`;
    }).join('')}</div>
    ${t ? `<div class="seg">${STRENGTH_N.map((n, s) => `<button data-dr="str" data-k="${i}" data-v="${s + 1}" aria-pressed="${t.s === s + 1}">${n}<small>${TREATMENTS[t.id].dye[s]} dye${(TREATMENTS[t.id].irr || [0, 0, 0])[s] ? ' · irritant' : ''}</small></button>`).join('')}</div><p class="hint">${esc(TREATMENTS[t.id].desc)}</p>` : ''}</div>`;
  };
  const loads = Object.entries(LOADS).map(([id, l]) => opt('load', id, l.n, l.desc, [`AMMO ${l.ammo}`, `WT ${l.weight}`, `ACCESS ${sgn(l.access)}`, cst(l)], L.load === id)).join('');
  const ins = Object.entries(INSIGNIA).map(([id, x]) => opt('insignia', id, x.n, x.desc, [`C2 ${sgn(x.c2)}`, x.mor && `MORALE +${x.mor}`, cst(x)], L.insignia === id)).join('');
  const retool = drRetool(L, DRS);
  return `${preview}
  ${sec('CUT', `<div class="opts">${cuts}</div>${retool ? '<p class="hint">Changing the cut from last cycle costs 3 extra hours to re-make the patterns.</p>' : ''}`, esc(CUTS[L.cut].desc.split('.')[0]))}
  ${sec('CONSTRUCTION DETAILS', `<div class="chips2">${dets}</div>`, civ ? 'n/a for own clothes' : `${L.details.length}/3`)}
  ${sec('FABRIC', `<div class="opts">${fabs}</div>`)}
  ${sec('COLOUR', sw('color') + (L.pattern !== 'solid' && !civ ? `<p class="hint">Second colour</p>${sw('color2')}` : ''), `x/10 = concealment on ${esc(TERRAIN_N[op.terrain].toLowerCase())}`)}
  ${sec('PATTERN', `<div class="opts">${pats}</div>`)}
  ${sec('TREATMENT BATH', `<p class="hint">Two vats. Finishes interact: read the lab notes under the preview.</p><h4>VAT 1</h4>${treatSlot(0)}<h4>VAT 2</h4>${treatSlot(1)}`)}
  ${sec('LOAD-BEARING', `<div class="opts">${loads}</div>`)}
  ${sec('INSIGNIA', `<div class="opts">${ins}</div>`)}
  <div class="dr-next"><button class="btn primary big block" data-dr="tab" data-v="mess">TO THE MESS & MEDIC ▸</button></div>`;
}

function drMessHTML() {
  const L = DRS.L, op = curOp(), D = drDerive(L, DRS, op);
  const kc = D.kcal, vit = sum(L.rations.map(r => RATIONS[r].vit));
  const rat = Object.entries(RATIONS).map(([id, r]) => tog('rations', id, r.n, [`${r.kcal} kcal`, r.vit && `VIT C ${r.vit}`, r.mor > 1 && `MORALE +${r.mor}`, r.mor < 0 && 'MORALE −1', r.smoke && 'SMOKE', `${r.cost} food`], L.rations.includes(id), !L.rations.includes(id) && L.rations.length >= 6)).join('');

      <div class="stat"><span>Calories</span><div class="sbar"><i style="width:${clamp(kc / op.kcal, 0, 1.2) / 1.2 * 100}%;background:${kc >= op.kcal * 0.95 ? 'var(--good)' : 'var(--bad)'}"></i></div><b>${kc}/${op.kcal}</b></div>

      <div class="stat"><span>Weight</span><div class="sbar"><i style="width:${clamp(D.rw / 10, 0, 1) * 100}%;background:${D.rw > 7 ? 'var(--bad)' : 'var(--good)'}"></i></div><b>${D.rw}</b></div>
      <div class="stat"><span>Cook smoke</span><div class="sbar"><i style="width:${clamp(D.smoke / 6, 0, 1) * 100}%;background:${D.smoke >= 4 ? 'var(--bad)' : 'var(--good)'}"></i></div><b>${D.smoke}</b></div>
    </div><div class="chips2">${rat}</div>`, `${L.rations.length}/6 items`)}
  ${sec('DISTRIBUTION', `<div class="opts">${dist}</div>`)}
