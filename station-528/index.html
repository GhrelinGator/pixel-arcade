<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f2ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101315" media="(prefers-color-scheme: dark)">
<meta name="description" content="Station 528: spaced retrieval, confidence bets and calibration for MCAT study.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Station 528">
<title>Station 528</title>
<style>
:root {
  --bg: #f4f2ed; --panel: #ffffff; --panel2: #ecE9e2; --ink: #1b1f24; --ink2: #4a5260; --mute: #6b7280; --rule: #d6d1c6;
  --accent: #0e6b6b; --accent-ink: #ffffff; --accent-soft: #d7ecea;
  --good: #1f7a3a; --good-soft: #dcefe1; --warn: #9a5b00; --warn-soft: #f6e7cf; --bad: #b42318; --bad-soft: #f8dcd8;
  --lit: #e6a23c; --unlit: #e3dfd6; --band: rgba(27, 31, 36, .09);
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101315; --panel: #181c20; --panel2: #20252a; --ink: #e9e7e2; --ink2: #b9bec6; --mute: #8a919b; --rule: #2d333a;
    --accent: #4fb0ad; --accent-ink: #0b1414; --accent-soft: #17302f;
    --good: #57c27a; --good-soft: #15291c; --warn: #e2a64a; --warn-soft: #2e2413; --bad: #f07b6e; --bad-soft: #321a17;
    --lit: #f0b44f; --unlit: #2a3036; --band: rgba(233, 231, 226, .10);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; min-height: 100dvh; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
#app { max-width: 680px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }
.mono { font-family: var(--mono); }
.lbl { font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
.muted { color: var(--mute); }
.small { font-size: 14.5px; }
h1 { font-family: var(--mono); font-size: 15px; letter-spacing: .14em; margin: 0; font-weight: 700; }
h2 { font-size: 21px; margin: 0 0 6px; line-height: 1.25; }
h3 { font-size: 16px; margin: 18px 0 8px; }
p { margin: 8px 0; }
hr { border: 0; border-top: 1px solid var(--rule); margin: 18px 0; }

/* top bar */
.top { display: flex; align-items: center; gap: 10px; padding: 4px 0 12px; border-bottom: 1px solid var(--rule); margin-bottom: 14px; }
.top .grow { flex: 1; min-width: 0; }
.top .sub { font-family: var(--mono); font-size: 12px; color: var(--mute); margin-top: 2px; }
.ib { min-width: 44px; height: 44px; border: 1px solid var(--rule); background: var(--panel); border-radius: 10px; display: grid; place-items: center; font-size: 17px; padding: 0 10px; text-decoration: none; color: var(--ink); }

/* panels and buttons */
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; padding: 16px; margin: 12px 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 11px; border: 1px solid var(--rule); background: var(--panel); text-decoration: none; color: var(--ink); font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink2); font-weight: 500; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .opt:focus-visible, .conf button:focus-visible, .ib:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.stack > * + * { margin-top: 10px; }

/* today */
.today { display: grid; gap: 10px; }
.task { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid var(--rule); border-radius: 12px; background: var(--panel); }
.task .grow { flex: 1; min-width: 0; }
.task b { display: block; font-size: 17px; }
.task .n { font-family: var(--mono); font-size: 26px; font-weight: 700; min-width: 2.2ch; text-align: right; }
.task.done { background: var(--good-soft); border-color: transparent; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.tile { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 10px 10px 9px; }
.tile .v { font-family: var(--mono); font-size: 22px; font-weight: 700; line-height: 1.15; margin-top: 4px; }
.tile .d { font-size: 12.5px; color: var(--mute); line-height: 1.3; margin-top: 2px; }
.banner { border-radius: 12px; padding: 12px 14px; margin: 12px 0; background: var(--warn-soft); border: 1px solid transparent; font-size: 15px; }
.banner .row { margin-top: 8px; }

/* station plan */
.plan { margin: 6px 0 4px; }
.sect { margin: 14px 0 6px; display: flex; align-items: center; gap: 8px; }
.sect::after { content: ""; flex: 1; border-top: 1px dashed var(--rule); }
.wings { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.wing { position: relative; text-align: left; background: var(--panel); border: 1.5px solid var(--ink2); border-radius: 10px; padding: 10px 10px 9px; min-height: 92px; }
.wing.empty { border-style: dashed; border-color: var(--rule); color: var(--mute); background: transparent; }
.wing .nm { font-weight: 650; font-size: 15px; line-height: 1.2; padding-right: 28px; }
.wing .fc { position: absolute; top: 9px; right: 9px; font-family: var(--mono); font-size: 11px; color: var(--mute); }
.win { display: flex; gap: 3px; margin: 9px 0 6px; }
.win i { width: 11px; height: 11px; border-radius: 2px; background: var(--unlit); }
.win i.on { background: var(--lit); }
.pips { display: flex; gap: 3px; align-items: center; }
.pips i { width: 14px; height: 4px; border-radius: 2px; background: var(--unlit); }
.pips i.on { background: var(--accent); }
.wing .meta { font-family: var(--mono); font-size: 11.5px; color: var(--mute); margin-top: 5px; }

/* runner */
.prog { height: 4px; background: var(--panel2); border-radius: 2px; overflow: hidden; margin: -6px 0 14px; }
.prog i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.prompt { font-size: 19.5px; line-height: 1.45; margin: 4px 0 16px; overflow-wrap: anywhere; }
.prompt sup, .opt sup, .expl sup { font-size: .7em; line-height: 0; }
.ans { display: flex; gap: 8px; align-items: center; }
.ans input { flex: 1; min-width: 0; height: 52px; border-radius: 11px; border: 1.5px solid var(--rule); background: var(--panel); padding: 0 14px; font-size: 18px; }
.ans input:focus { outline: none; border-color: var(--accent); }
.ans .u { font-family: var(--mono); color: var(--mute); font-size: 15px; }
.keys { display: flex; gap: 6px; margin-top: 8px; }
.key { min-width: 52px; height: 40px; border-radius: 9px; border: 1px solid var(--rule); background: var(--panel2); font-family: var(--mono); font-size: 15px; }
.reveal { width: 100%; position: relative; overflow: hidden; }
.reveal .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent-soft); z-index: 0; }
.reveal span { position: relative; z-index: 1; }
.reveal.go .fill { animation: fill 3s linear forwards; }
@keyframes fill { to { width: 100%; } }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 13px 14px; border-radius: 11px; border: 1.5px solid var(--rule); background: var(--panel); font-size: 17px; line-height: 1.4; width: 100%; }
.opt .k { font-family: var(--mono); font-size: 13px; color: var(--mute); padding-top: 2px; min-width: 1ch; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.dim { opacity: .62; }
.conf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.conf button { min-height: 62px; border-radius: 11px; border: 1.5px solid var(--rule); background: var(--panel); padding: 6px 4px; display: grid; gap: 2px; place-items: center; }
.conf button b { font-size: 15.5px; }
.conf button span { font-family: var(--mono); font-size: 12px; color: var(--mute); }
.conf button[data-c="3"] { border-color: var(--ink2); }
.conf button:disabled { opacity: .4; }
.confhint { font-size: 13.5px; color: var(--mute); margin-top: 8px; text-align: center; }
.verdict { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; font-weight: 650; margin-bottom: 12px; }
.verdict.ok { background: var(--good-soft); color: var(--good); }
.verdict.no { background: var(--bad-soft); color: var(--bad); }
.verdict.dk { background: var(--panel2); color: var(--ink2); }
.verdict .pts { margin-left: auto; font-family: var(--mono); font-size: 14px; }
.surprise { border: 2px solid var(--bad); border-radius: 12px; padding: 14px; margin: 12px 0; }
.surprise b { color: var(--bad); }
.yours { font-size: 15.5px; margin: 8px 0; }
.yours code { font-family: var(--mono); background: var(--panel2); padding: 1px 6px; border-radius: 5px; }
.expl { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 13px 14px; margin: 12px 0; font-size: 16.5px; }
.expl ul { margin: 8px 0 0; padding-left: 18px; }
.expl li { margin: 6px 0; }
details.why summary { cursor: pointer; color: var(--accent); font-weight: 600; padding: 6px 0; }
.where { font-family: var(--mono); font-size: 11.5px; color: var(--mute); letter-spacing: .04em; margin-top: 10px; }
.foot { display: flex; gap: 8px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
.foot .grow { flex: 1; }

/* debrief & charts */
.big { font-family: var(--mono); font-size: 40px; font-weight: 700; line-height: 1.1; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 15.5px; }
.kv span:nth-child(even) { font-family: var(--mono); text-align: right; }
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--mono); font-size: 12px; fill: var(--mute); }
.chart .val { fill: var(--ink); font-size: 13px; font-weight: 700; }
.chart .bar { fill: var(--accent); }
.chart .band { fill: var(--band); }
.chart .axis { stroke: var(--rule); }
table.t { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.t th, table.t td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--rule); }
table.t td.n, table.t th.n { text-align: right; font-family: var(--mono); }
.st { font-family: var(--mono); font-size: 12px; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
.st.ok { background: var(--good-soft); color: var(--good); }
.st.over { background: var(--bad-soft); color: var(--bad); }
.st.under { background: var(--warn-soft); color: var(--warn); }
.st.few { background: var(--panel2); color: var(--mute); }

/* settings */
.units { display: grid; gap: 2px; }
.chk { display: flex; gap: 12px; align-items: center; padding: 9px 2px; border-bottom: 1px solid var(--rule); font-size: 16px; }
.chk input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.chk .grow { flex: 1; }
.chk .c { font-family: var(--mono); font-size: 12px; color: var(--mute); }
.course { font-weight: 700; }
.field { display: grid; gap: 6px; margin: 12px 0; }
.field input, .field select { height: 46px; border: 1.5px solid var(--rule); border-radius: 10px; background: var(--panel); padding: 0 12px; }
.flag-item { padding: 10px 0; border-bottom: 1px solid var(--rule); }

/* toast & sheet */
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 15px; max-width: calc(100% - 32px); opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
#toast.on { opacity: 1; }
.sheet-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
.sheet { background: var(--bg); width: 100%; max-width: 680px; border-radius: 16px 16px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 85vh; overflow: auto; }
@media (min-width: 700px) { .sheet-bg { align-items: center; } .sheet { border-radius: 16px; } }
@media (max-width: 360px) { .tiles { grid-template-columns: 1fr 1fr; } .conf button b { font-size: 14px; } }
@media (prefers-reduced-motion: reduce) { .reveal.go .fill { animation-duration: .01s; } .prog i { transition: none; } }

/* delta v2: check-in, weekly card, sleep row, blocks, post-mortems, trend */
.task .sub2 { display: block; margin-top: 2px; }
.task.now { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.two .field { margin: 8px 0; }
.chip { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--rule); background: var(--panel); font-size: 15px; font-weight: 600; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.ghost { background: transparent; border-color: transparent; color: var(--mute); padding: 0 10px; }
.chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.sleep { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 8px 8px 8px 14px; margin: 12px 0; border: 1px dashed var(--rule); border-radius: 12px; }
.essentials { border-radius: 12px; padding: 12px 14px; margin: 12px 0; background: var(--good-soft); font-size: 15.5px; }
.note { display: flex; align-items: center; gap: 8px; border-radius: 12px; padding: 8px 8px 8px 14px; margin: 12px 0; background: var(--panel2); }
.note .grow { flex: 1; }
.week .plantext, .plantext { font-weight: 600; margin: 6px 0; }
.week .btn.small, .btn.small { min-height: 40px; padding: 0 14px; font-size: 15px; }
.weekrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 10px 2px 0; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--unlit); }
.dots i.on { background: var(--accent); }
.dots i.td { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--ink2); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }
.seg button { min-height: 52px; border-radius: 10px; border: 1.5px solid var(--rule); background: var(--panel); display: grid; place-content: center; text-align: center; line-height: 1.2; }
.seg button span { font-family: var(--mono); font-size: 12px; color: var(--mute); }
.seg button.on { border-color: var(--accent); background: var(--accent-soft); }
.seg button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.cheer { display: flex; gap: 12px; align-items: center; background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; margin: 12px 0; font-size: 15.5px; }
.cheer .beacon { font-size: 24px; color: var(--lit); line-height: 1; }
.pm { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--rule); }
.rest { position: fixed; inset: 0; z-index: 20; background: #0b0d0e; color: #8a919b; display: grid; place-items: center; transition: background 1.2s, color 1.2s; }
.rest.up { background: var(--bg); color: var(--ink); }
.restin { text-align: center; max-width: 320px; padding: 20px; }
.restin p { font-size: 18px; }
.restbar { height: 4px; border-radius: 2px; background: rgba(138, 145, 155, .25); overflow: hidden; margin: 18px 0; }
.restbar i { display: block; height: 100%; width: 0; background: #4fb0ad; }
.restbar i.go { width: 100%; transition: width 120s linear; }
.smxrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.chart.smx text { font-size: 10.5px; }
.chart.smx .pt { fill: var(--ink); font-weight: 700; font-size: 11px; }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
.chart .dot { fill: var(--accent); stroke: var(--panel); stroke-width: 2; }
.hbar { display: block; height: 10px; border-radius: 0 4px 4px 0; background: var(--accent); min-width: 2px; }
.pmt td { vertical-align: middle; }
@media (prefers-reduced-motion: reduce) { .restbar i.go { transition: none; width: 100%; } .rest { transition: none; } }
.sleep { display: block; padding: 6px 8px 10px 14px; }
.sleepbtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 2px; }
.chart .grid { stroke: var(--rule); stroke-dasharray: 2 3; }
.field select { width: 100%; min-width: 0; }
.seg.seg4 { grid-template-columns: repeat(4, 1fr); }
.seg.seg4 button { min-height: 44px; }
.tpre { white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 12px; line-height: 1.45; max-height: 60vh; overflow: auto; background: var(--panel2); border-radius: 10px; padding: 12px; margin-top: 8px; }

</style>

<body>
<main id="app" aria-live="polite"></main>
<div id="toast" role="status"></div>
<script>
/* ==== engine.js ==== */
/* Station 528 engine: FSRS-6 memory model, behavior-derived grading, certainty-based marking,
   and the exam-date scheduling rules from the build spec (§6–7). No DOM in this file. */
'use strict';

const DAY = 86400000;
const ROLLOVER_H = 4; /* a study day runs 4am to 4am, like Anki */

/* ---------- FSRS-6 ---------- */
/* Default FSRS-6 parameters w0..w20 (the ones Anki and py-fsrs 6 ship). */
const FSRS_W = [0.212, 1.2931, 2.3065, 8.2956, 6.4133, 0.8334, 3.0194, 0.001, 1.8722, 0.1666, 0.796,
  1.4835, 0.0614, 0.2629, 1.6483, 0.6014, 1.8729, 0.5425, 0.0912, 0.0658, 0.1542];
const S_MIN = 0.001, S_MAX = 36500;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const fsrsFactor = w => Math.pow(0.9, -1 / w[20]) - 1;

/* Recall probability after t days at stability s: R = (1 + factor·t/s)^(−w20). R(s, s) = 0.9. */
function retr(tDays, s, w = FSRS_W) {
  if (!(s > 0)) return 0;
  return Math.pow(1 + fsrsFactor(w) * Math.max(0, tDays) / s, -w[20]);
}
const initS = (g, w = FSRS_W) => Math.max(S_MIN, w[g - 1]);
const initDRaw = (g, w = FSRS_W) => w[4] - Math.exp(w[5] * (g - 1)) + 1;
const initD = (g, w = FSRS_W) => clamp(initDRaw(g, w), 1, 10);
function nextD(d, g, w = FSRS_W) {
  const dp = d + (-w[6] * (g - 3)) * (10 - d) / 9;            /* linear damping */
  return clamp(w[7] * initDRaw(4, w) + (1 - w[7]) * dp, 1, 10); /* mean reversion toward D0(Easy) */
}
function sRecall(d, s, r, g, w = FSRS_W) {
  const hard = g === 2 ? w[15] : 1, easy = g === 4 ? w[16] : 1;
  return clamp(s * (1 + Math.exp(w[8]) * (11 - d) * Math.pow(s, -w[9]) * (Math.exp((1 - r) * w[10]) - 1) * hard * easy), S_MIN, S_MAX);
}
function sForget(d, s, r, w = FSRS_W) {
  const longTerm = w[11] * Math.pow(d, -w[12]) * (Math.pow(s + 1, w[13]) - 1) * Math.exp((1 - r) * w[14]);
  return clamp(Math.min(longTerm, s / Math.exp(w[17] * w[18])), S_MIN, S_MAX);
}
function sShortTerm(s, g, w = FSRS_W) { /* a second review on the same day */
  let inc = Math.exp(w[17] * (g - 3 + w[18])) * Math.pow(s, -w[19]);
  if (g >= 2) inc = Math.max(inc, 1); /* as py-fsrs: Hard, Good and Easy never lower stability */
  return clamp(s * inc, S_MIN, S_MAX);
}
/* One review. card: {s, d, last (ms) or null}. Returns the new {s, d}.
   Elapsed time is counted in whole study days, as the reference implementations do (the parameters were fit that way);
   a second review on the same study day uses the short-term formula. Stability is updated with the pre-review difficulty. */
function fsrsStep(card, g, now, w = FSRS_W) {
  if (!card.last) return { s: initS(g, w), d: initD(g, w) };
  const tDays = Math.max(0, dayOf(now) - dayOf(card.last));
  let s;
  if (tDays < 1) s = sShortTerm(card.s, g, w);
  else s = g === 1 ? sForget(card.d, card.s, retr(tDays, card.s, w), w) : sRecall(card.d, card.s, retr(tDays, card.s, w), g, w);
  return { s, d: nextD(card.d, g, w) };
}

const ITEMS = [];
function addItem(u, id, o) {
  const unit = UNIT[u]; if (!unit) throw new Error('no unit ' + u);

  const it = Object.assign({ id: u + '.' + id, unit: u, cat, fc: parseInt(cat, 10), sec: secOfCat(cat), sk: 1, hy: false, cs: [], kind: 'fact' }, o);

/* Typed recall: the player writes the answer. accepted: answers that count. */

/* Choice: options[0] is the key (shuffled on screen); lures[i] says why options[i+1] is wrong. */
function C(u, id, prompt, options, lures, expl, o = {}) { return addItem(u, id, Object.assign({ type: 'choice', prompt, options, lures, expl }, o)); }
/* Generated problem: gen(rnd) returns {prompt, value, tol|tolPct, unit, expl}. New numbers every review; code computes the key. */
function G(u, id, title, gen, o = {}) { return addItem(u, id, Object.assign({ type: 'gen', kind: 'problem', sk: 2, title, gen }, o)); }

/* helpers for generators */
const pickR = (rnd, a) => a[Math.floor(rnd() * a.length)];

const sig = (x, n = 3) => { if (x === 0 || !isFinite(x)) return String(x); const p = Math.pow(10, n - 1 - Math.floor(Math.log10(Math.abs(x)))); return String(Math.round(x * p) / p); };
const sci = (x, n = 2) => { if (x === 0) return '0'; const e = Math.floor(Math.log10(Math.abs(x))); const m = x / Math.pow(10, e); return (Math.abs(e) < 4) ? sig(x, n + 1) : `${sig(m, n)} × 10^${e}`; };

C('c-eq', 'inert', 'You add argon to a fixed-volume vessel containing N₂ + 3 H₂ ⇌ 2 NH₃ at equilibrium. What happens?', ['No shift: the partial pressures of the reacting gases are unchanged', 'Shift toward NH₃ (fewer moles of gas)', 'Shift toward N₂ and H₂', 'K increases'],

  'Compressing raises all partial pressures; the side with fewer moles of gas is favored.', { cs: ['cs-lechat'] });
C('c-eq', 'q-k', 'If Q < K, the reaction will:', ['Proceed forward, making more products', 'Proceed in reverse', 'Stay put; it is at equilibrium', 'Change K until it matches Q'],
  ['Reverse happens when Q > K.', 'Equilibrium means Q = K.', 'K is fixed at a given temperature; Q moves toward K.'],

C('c-eq', 'k-change', 'Which change alters the value of an equilibrium constant?', ['Changing the temperature', 'Adding a reactant', 'Compressing the container', 'Adding a catalyst'],
  ['This shifts the position, not K.', 'This shifts the position, not K.', 'A catalyst changes neither the position nor K.'],
  'K = e^(−ΔG°/RT) depends only on temperature (for a given reaction).', { hy: true, cs: ['cs-lechat'] });
C('c-eq', 'solids', 'How do pure solids and pure liquids appear in an equilibrium expression?', ['They are left out (their activity is 1)', 'As their molar concentrations', 'As their masses', 'In the denominator only'],

C('c-eq', 'dg-k', 'If K > 1 for a reaction, then ΔG° is:', ['Negative', 'Positive', 'Zero', 'Undefined'],
  ['Positive ΔG° gives K < 1.', 'ΔG° = 0 gives K = 1.', 'ΔG° = −RT ln K is defined for any positive K.'],
  'ΔG° = −RT ln K. ln K > 0 when K > 1, so ΔG° < 0: products are favored at standard conditions.', { hy: true, cs: ['cs-gibbs'] });
G('c-eq', 'g-kc', 'Calculate K', rnd => {
  const A = pickR(rnd, [0.1, 0.2, 0.5]), B = pickR(rnd, [0.1, 0.2, 0.4]), Cc = pickR(rnd, [0.2, 0.4, 0.6, 1.0]);

G('c-acid', 'g-ph-log', 'pH from [H⁺]', rnd => {

});

});

C('b-mol', 'cellulose', 'What makes cellulose indigestible to humans while starch is digestible?', ['Cellulose uses β(1→4) glycosidic bonds; starch uses α(1→4)', 'Cellulose is made of fructose', 'Cellulose is a protein', 'Starch is branched and cellulose is not'],

C('b-cell', 'prok-lack', 'Which do prokaryotic cells lack?', ['A membrane-bound nucleus', 'Ribosomes', 'A plasma membrane', 'DNA'],

C('b-cell', 'ribosome-size', 'Eukaryotic cytoplasmic ribosomes are:', ['80S, made of 60S and 40S subunits', '70S, made of 50S and 30S subunits', '80S, made of 50S and 30S subunits', '100S'],

C('b-cell', 'microtubule', 'Microtubules are made of ___ and form ___.', ['Tubulin; the mitotic spindle, cilia and flagella', 'Actin; the cleavage furrow', 'Keratin; anchoring junctions', 'Myosin; thick filaments'],

C('b-cell', 'intermediate-fil', 'Keratin and nuclear lamins are examples of:', ['Intermediate filaments', 'Microtubules', 'Microfilaments', 'Motor proteins'],

C('b-cell', 'gap', 'Which junction lets ions and small molecules pass directly between neighboring cells?', ['Gap junctions', 'Tight junctions', 'Desmosomes', 'Adherens junctions'],

C('b-mem', 'hypotonic', 'A red blood cell is placed in a hypotonic solution. What happens?', ['Water enters; the cell swells and may burst', 'Water leaves; the cell shrinks', 'Nothing: the solution is isotonic', 'Solute enters and the cell shrinks'],

C('b-energy', 'uncoupler', 'An uncoupler such as DNP makes the inner mitochondrial membrane leaky to H⁺. What happens?', ['O₂ use continues or rises, ATP synthesis falls, and heat is released', 'O₂ use stops and ATP synthesis stops', 'ATP synthesis rises', 'The ETC reverses'],

G('b-gen', 'g-mono', 'Monohybrid cross', rnd => {
  const cross = pickR(rnd, [['Aa', 'Aa'], ['Aa', 'aa'], ['AA', 'Aa']]), ask = pickR(rnd, ['aa', 'Aa', 'dominant phenotype']);
  const gam = s => [s[0], s[1]], g1 = gam(cross[0]), g2 = gam(cross[1]);
  let hit = 0;
  for (const x of g1) for (const y of g2) { const geno = [x, y].sort().join(''); if (ask === 'dominant phenotype' ? geno.includes('A') : geno === ask) hit++; }
  const p = hit / 4;
  return { prompt: `${cross[0]} × ${cross[1]}. What fraction of offspring ${ask === 'dominant phenotype' ? 'show the dominant phenotype' : 'are ' + ask}? (Answer as a decimal or fraction.)`, value: p, tol: 0.01, unit: '', fraction: true,
    expl: `Gametes ${g1.join('/')} × ${g2.join('/')} give four equally likely boxes; ${hit} of 4 match: ${p}.` };
}, { hy: true, sk: 1 });
G('b-gen', 'g-dihybrid', 'Dihybrid cross', rnd => {
  const ask = pickR(rnd, [['aabb', 1 / 16], ['both dominant traits', 9 / 16], ['dominant A trait and recessive b trait', 3 / 16], ['AaBb', 4 / 16]]);
  return { prompt: `AaBb × AaBb (genes on different chromosomes). What fraction of offspring are ${ask[0]}?`, value: ask[1], tol: 0.005, unit: '', fraction: true,
    expl: `Multiply the single-gene probabilities. ${ask[0] === 'aabb' ? '¼ × ¼ = 1/16' : ask[0] === 'both dominant traits' ? '¾ × ¾ = 9/16' : ask[0] === 'AaBb' ? '½ × ½ = 4/16 = ¼' : '¾ × ¼ = 3/16'}.` };
});
G('b-gen', 'g-hw', 'Hardy–Weinberg', rnd => {
  const q2 = pickR(rnd, [0.01, 0.04, 0.09, 0.16, 0.25, 0.0001]), q = Math.sqrt(q2), p = 1 - q;
  return { prompt: `A recessive condition affects ${sig(q2 * 100)}% of a population in Hardy–Weinberg equilibrium. What fraction of the population are carriers (heterozygotes)?`, value: 2 * p * q, tolPct: 2, unit: '',
    expl: `q² = ${q2}, so q = ${sig(q)} and p = ${sig(p)}. Carriers = 2pq = ${sig(2 * p * q)}.`, hint: 'q² is the affected fraction; carriers are 2pq.' };
}, { hy: true });
G('b-gen', 'g-map', 'Map distance', rnd => {
  const total = pickR(rnd, [200, 500, 1000]), rf = pickR(rnd, [0.05, 0.1, 0.15, 0.2, 0.3]);
  const rec = Math.round(total * rf);
  return { prompt: `A test cross gives ${total} offspring, ${rec} of them recombinant. How many map units (cM) apart are the genes?`, value: 100 * rec / total, tolPct: 2, unit: 'cM',
    expl: `Recombination frequency = ${rec}/${total} = ${sig(rec / total)}, i.e. ${sig(100 * rec / total)} cM.` };
});

C('b-sys', 'desc-loop', 'The descending limb of the loop of Henle is:', ['Permeable to water but not to salt', 'Permeable to salt but not to water', 'Impermeable to both', 'Where ADH acts'],

/* ==== content_phys.js ==== */
/* Physics starter deck. Original items; MCAT conventions (g = 10 m/s²). Code computes every numeric key. */
'use strict';

/* ---------- Kinematics (4A) ---------- */
C('p-kin', 'apex', 'A ball is thrown upward at an angle. At the top of its path (no air resistance):', ['Vertical velocity is zero, but acceleration is still g downward', 'Velocity and acceleration are both zero', 'Acceleration is zero and velocity is horizontal', 'Horizontal velocity is zero'],
  ['The horizontal velocity is unchanged throughout the flight.', 'Gravity never switches off; only the vertical velocity is momentarily zero.', 'Horizontal velocity stays constant the whole time.'],
  'Gravity accelerates the ball at 10 m/s² downward everywhere on its path, including the top.', { hy: true, sk: 2, cs: ['cs-projectile'] });
C('p-kin', 'horiz-v', 'Ignoring air resistance, a projectile\'s horizontal velocity:', ['Stays constant', 'Increases steadily', 'Decreases steadily', 'Is zero at the top'],
  ['No horizontal force acts, so nothing speeds it up.', 'Only air resistance would slow it.', 'Only the vertical component is zero at the top.'],
  'Horizontal and vertical motion are independent; only the vertical has an acceleration (g).', { cs: ['cs-projectile'] });
C('p-kin', 'drop-vs-throw', 'One ball is dropped and another is thrown horizontally from the same height at the same moment. Which lands first?', ['They land at the same time', 'The dropped ball', 'The thrown ball', 'It depends on their masses'],
  ['Horizontal speed does not affect vertical fall.', 'Its horizontal motion does not slow its fall.', 'Free-fall acceleration does not depend on mass.'],
  'Both start with zero vertical velocity and fall with the same acceleration, so both fall the same height in the same time.', { sk: 2, cs: ['cs-projectile'] });
C('p-kin', 'vt-slope', 'The slope of a velocity–time graph gives:', ['Acceleration', 'Displacement', 'Velocity', 'Jerk'],
  ['Displacement is the area under a v–t graph.', 'Velocity is the slope of a position–time graph.', 'Jerk is the slope of an acceleration–time graph.'],
  'Slope = rise/run = Δv/Δt = acceleration.', { hy: true, cs: ['cs-graphs'] });
C('p-kin', 'vt-area', 'The area under a velocity–time graph gives:', ['Displacement', 'Acceleration', 'Average speed', 'Force'],
  ['Acceleration is the slope.', 'You would still divide by time to get an average.', 'Force needs mass and acceleration.'],
  'Area = velocity × time = displacement (areas below the axis count as negative).', { cs: ['cs-graphs'] });
C('p-kin', 'xt-slope', 'The slope of a position–time graph gives:', ['Velocity', 'Acceleration', 'Displacement', 'Distance traveled'],
  ['Acceleration would show as the curvature, or the slope of v–t.', 'Displacement is read from the graph directly as a change in position.', 'Distance needs the path length, not the slope.'],
  'Δx/Δt = velocity. A straight line means constant velocity; a curve means acceleration.', { cs: ['cs-graphs'] });
C('p-kin', 'speed-vel', 'A runner completes one lap of a 400 m track in 80 s. Her average velocity is:', ['0 m/s', '5 m/s', '400 m/s', '80 m/s'],
  ['5 m/s is her average speed (distance/time).', 'That is the distance, not a velocity.', 'That is the time.'],
  'She ends where she started, so displacement is zero and average velocity is zero. Speed uses distance; velocity uses displacement.', { sk: 2 });
G('p-kin', 'g-fall', 'Free-fall time', rnd => {
  const h = pickR(rnd, [5, 20, 45, 80, 125, 180]), t = Math.sqrt(2 * h / 10);
  return { prompt: `An object is dropped from rest ${h} m above the ground. How long (s) does it take to land? (g = 10 m/s², no air resistance)`, value: t, tolPct: 2, unit: 's',
    expl: `h = ½gt² → t = √(2h/g) = √(2 × ${h} / 10) = ${sig(t)} s.`, hint: 'h = ½gt²' };
}, { hy: true, cs: ['cs-projectile'] });
G('p-kin', 'g-vf', 'Final velocity', rnd => {
  const v0 = pickR(rnd, [0, 2, 5, 10]), a = pickR(rnd, [2, 3, 4, 5]), t = pickR(rnd, [2, 3, 4, 5, 10]);
  return { prompt: `A cart starts at ${v0} m/s and accelerates at ${a} m/s² for ${t} s. What is its final speed, in m/s?`, value: v0 + a * t, tolPct: 1, unit: 'm/s',
    expl: `v = v₀ + at = ${v0} + ${a} × ${t} = ${v0 + a * t} m/s.` };
}, { sk: 1 });
G('p-kin', 'g-vsq', 'v² = v₀² + 2aΔx', rnd => {
  const v0 = pickR(rnd, [10, 20, 30]), a = pickR(rnd, [2, 4, 5]);
  const d = v0 * v0 / (2 * a);
  return { prompt: `A car moving at ${v0} m/s brakes at a constant ${a} m/s². How far (m) does it travel before stopping?`, value: d, tolPct: 2, unit: 'm',
    expl: `0 = v₀² − 2ad → d = v₀² / (2a) = ${v0 * v0} / ${2 * a} = ${sig(d)} m. Doubling the speed quadruples the stopping distance.`, hint: 'v² = v₀² + 2aΔx, with v = 0' };
}, { hy: true });
G('p-kin', 'g-proj', 'Horizontal launch', rnd => {
  const h = pickR(rnd, [5, 20, 45, 80]), v = pickR(rnd, [3, 5, 10, 15]);
  const t = Math.sqrt(2 * h / 10);
  return { prompt: `A ball rolls off a ${h} m high cliff at ${v} m/s horizontally. How far from the base of the cliff (m) does it land? (g = 10 m/s²)`, value: v * t, tolPct: 2, unit: 'm',
    expl: `Fall time t = √(2h/g) = ${sig(t)} s. Horizontal distance = v·t = ${v} × ${sig(t)} = ${sig(v * t)} m.` };
}, { cs: ['cs-projectile'] });

/* ---------- Forces & Newton's laws (4A) ---------- */
C('p-force', 'third-law', 'A book rests on a table. By Newton\'s third law, the reaction to Earth\'s gravitational pull on the book is:', ['The book\'s gravitational pull on Earth', 'The table\'s normal force on the book', 'The book\'s weight', 'Friction from the table'],
  ['The normal force balances gravity on the same object; that is the first law (equilibrium), not a third-law pair.', 'Weight is the force in question, not its partner.', 'No horizontal force is involved.'],
  'Third-law pairs act on different objects and are the same type of force: Earth pulls the book, the book pulls Earth.', { hy: true, sk: 2 });
C('p-force', 'const-v', 'An object moves at constant velocity. The net force on it is:', ['Zero', 'In the direction of motion', 'Opposite to the motion', 'Equal to its weight'],
  ['A net force would change the velocity.', 'That would slow it down.', 'Weight is only one of the forces, and it is balanced.'],
  'Newton\'s first law: constant velocity (including rest) means balanced forces.', { hy: true });
C('p-force', 'friction', 'For two surfaces, how do the coefficients of static and kinetic friction usually compare?', ['μs > μk', 'μk > μs', 'They are always equal', 'μs is always zero'],
  ['Kinetic friction is the smaller one.', 'They are usually different.', 'Static friction is what lets you walk.'],
  'It takes more force to start something sliding than to keep it sliding.');
C('p-force', 'mass-weight', 'An astronaut goes from Earth to the Moon. What happens to her mass and weight?', ['Mass is unchanged; weight decreases', 'Both decrease', 'Mass decreases; weight is unchanged', 'Both are unchanged'],
  ['Mass is the amount of matter and does not depend on location.', 'This reverses them.', 'Weight = mg depends on the local g.'],
  'The Moon\'s g is about 1/6 of Earth\'s, so her weight drops to about 1/6.');
C('p-force', 'centripetal', 'For an object moving in a circle at constant speed, the net force points:', ['Toward the center', 'Along the direction of motion', 'Outward from the center', 'There is no net force'],
  ['Constant speed means no tangential force.', '"Centrifugal force" is not a real force in an inertial frame.', 'Its direction changes constantly, so it is accelerating.'],
  'Centripetal acceleration v²/r points inward; something (tension, gravity, friction) must supply the inward force.', { hy: true });
C('p-force', 'elevator', 'You stand on a scale in an elevator accelerating upward. The scale reads:', ['More than your weight', 'Less than your weight', 'Exactly your weight', 'Zero'],
  ['That happens when accelerating downward.', 'Only at rest or constant velocity.', 'Only in free fall.'],
  'N − mg = ma, so N = m(g + a) > mg.', { sk: 2 });
T('p-force', 'newton-unit', 'What is the SI unit of force?', ['newton', 'newtons', 'n'],
  'The newton: 1 N = 1 kg·m/s².');
G('p-force', 'g-fma', 'F = ma with friction', rnd => {
  const m = pickR(rnd, [2, 4, 5, 10]), F = pickR(rnd, [20, 30, 40, 60]), mu = pickR(rnd, [0, 0.1, 0.2]);
  const f = mu * m * 10, a = (F - f) / m;
  if (a <= 0) return { prompt: `A ${m} kg box is pushed with ${F + 50} N on a frictionless floor. What is its acceleration (m/s²)?`, value: (F + 50) / m, tolPct: 2, unit: 'm/s²', expl: `a = F/m = ${F + 50}/${m} = ${sig((F + 50) / m)} m/s².` };
  return { prompt: `A ${m} kg box is pushed horizontally with ${F} N. The coefficient of kinetic friction is ${mu}. What is its acceleration (m/s²)? (g = 10 m/s²)`, value: a, tolPct: 2, unit: 'm/s²',
    expl: `Friction = μmg = ${mu} × ${m} × 10 = ${f} N. Net force = ${F} − ${f} = ${F - f} N. a = ${F - f}/${m} = ${sig(a)} m/s².` };
}, { hy: true });
G('p-force', 'g-incline', 'Frictionless incline', rnd => {
  const th = pickR(rnd, [30, 45, 60]), s = { 30: 0.5, 45: Math.SQRT1_2, 60: Math.sqrt(3) / 2 }[th];
  return { prompt: `A block slides down a frictionless ${th}° incline. What is its acceleration (m/s²)? (g = 10 m/s²; sin 30° = 0.5, sin 45° ≈ 0.71, sin 60° ≈ 0.87)`, value: 10 * s, tolPct: 2, unit: 'm/s²',
    expl: `Only the component of gravity along the slope accelerates it: a = g sin θ = 10 × ${sig(s, 2)} = ${sig(10 * s)} m/s². Mass cancels.` };
});
G('p-force', 'g-circ', 'Centripetal acceleration', rnd => {
  const v = pickR(rnd, [2, 4, 5, 10, 20]), r = pickR(rnd, [1, 2, 5, 10, 50]);
  return { prompt: `A car rounds a curve of radius ${r} m at ${v} m/s. What is its centripetal acceleration (m/s²)?`, value: v * v / r, tolPct: 2, unit: 'm/s²',
    expl: `a = v²/r = ${v * v}/${r} = ${sig(v * v / r)} m/s², pointing toward the center.` };
}, { hy: true });

/* ---------- Work, energy & power (4A) ---------- */
C('p-energy', 'normal-work', 'A box slides 5 m across a level floor. How much work does the normal force do?', ['Zero', 'Equal to the weight times 5 m', 'Negative, equal to friction\'s work', 'Positive, equal to the kinetic energy gained'],
  ['W = Fd cos θ, and θ = 90° between the normal force and the motion.', 'That is friction\'s job, not the normal force\'s.', 'The normal force does no work here at all.'],
  'Forces perpendicular to the displacement do no work. The same goes for gravity during horizontal motion.', { hy: true, sk: 2 });
C('p-energy', 'conservative', 'Which is a conservative force, whose work does not depend on the path?', ['Gravity', 'Kinetic friction', 'Air resistance', 'A push from your hand'],
  ['Friction\'s work depends on how far you slide, so a longer path loses more energy.', 'Drag depends on path and speed.', 'Applied forces in general are path-dependent.'],
  'Gravity, spring forces and electrostatic forces are conservative, so each has a potential energy.', { cs: ['cs-conservative'] });
C('p-energy', 'wet', 'The net work done on an object equals:', ['Its change in kinetic energy', 'Its change in potential energy', 'Its momentum', 'Its power'],
  ['Potential energy is tied to the work of conservative forces only.', 'Momentum is a different quantity, mv.', 'Power is work per unit time.'],
  'The work–energy theorem: W_net = ΔKE.', { hy: true });
T('p-energy', 'watt', 'What is the SI unit of power?', ['watt', 'watts', 'w', 'j/s', 'joules per second', 'joule per second'],
  'The watt: 1 W = 1 J/s.');
C('p-energy', 'ramp', 'Pushing a crate up a long, gentle frictionless ramp instead of lifting it straight up:', ['Takes less force but the same work', 'Takes less work', 'Takes more work', 'Takes less force and less work'],
  ['Work = mgh either way, ignoring friction.', 'It takes the same work without friction (more with friction).', 'Simple machines trade force for distance; they never reduce the work.'],
  'Force × distance is conserved: a smaller force over a longer distance does the same mgh of work.', { sk: 2 });
G('p-energy', 'g-ke', 'Kinetic energy', rnd => {
  const m = pickR(rnd, [1, 2, 4, 10, 50]), v = pickR(rnd, [2, 3, 4, 10, 20]);
  return { prompt: `What is the kinetic energy (J) of a ${m} kg object moving at ${v} m/s?`, value: 0.5 * m * v * v, tolPct: 1, unit: 'J',
    expl: `KE = ½mv² = ½ × ${m} × ${v}² = ${0.5 * m * v * v} J. Doubling v quadruples KE.` };
}, { sk: 1 });
G('p-energy', 'g-drop-v', 'Energy conservation', rnd => {
  const h = pickR(rnd, [5, 20, 45, 80]), v = Math.sqrt(20 * h);
  return { prompt: `A ball slides from rest down a frictionless track, dropping ${h} m in height. What is its speed at the bottom (m/s)? (g = 10 m/s²)`, value: v, tolPct: 2, unit: 'm/s',
    expl: `mgh = ½mv² → v = √(2gh) = √(2 × 10 × ${h}) = ${sig(v)} m/s. Mass and track shape do not matter.` };
}, { hy: true });
G('p-energy', 'g-work', 'Work at an angle', rnd => {
  const F = pickR(rnd, [10, 20, 50]), d = pickR(rnd, [2, 4, 5, 10]), th = pickR(rnd, [0, 60, 90]);
  const c = { 0: 1, 60: 0.5, 90: 0 }[th];
  return { prompt: `A ${F} N force pulls a sled ${d} m. The force makes a ${th}° angle with the motion. How much work (J) does it do?${th === 60 ? ' (cos 60° = 0.5)' : ''}`, value: F * d * c, tol: 0.5, unit: 'J',
    expl: `W = Fd cos θ = ${F} × ${d} × ${c} = ${F * d * c} J.${th === 90 ? ' A perpendicular force does no work.' : ''}` };
});
G('p-energy', 'g-power', 'Power', rnd => {
  const m = pickR(rnd, [50, 60, 70, 80]), h = pickR(rnd, [3, 5, 10]), t = pickR(rnd, [2, 4, 5, 10]);
  const P = m * 10 * h / t;
  return { prompt: `A ${m} kg person climbs ${h} m of stairs in ${t} s. What average power (W) does she produce against gravity? (g = 10 m/s²)`, value: P, tolPct: 2, unit: 'W',
    expl: `P = W/t = mgh/t = ${m} × 10 × ${h} / ${t} = ${sig(P)} W.` };
});

/* ---------- Momentum, torque & equilibrium (4A) ---------- */
C('p-mom', 'conserve', 'The total momentum of a system is conserved when:', ['The net external force on the system is zero', 'Kinetic energy is conserved', 'The collision is elastic', 'All objects have the same mass'],
  ['Momentum is conserved even when kinetic energy is not (inelastic collisions).', 'Momentum is conserved in elastic and inelastic collisions alike.', 'Masses do not matter.'],
  'Internal forces come in third-law pairs and cancel; only an outside force can change total momentum.', { hy: true, cs: ['cs-collisions'] });
C('p-mom', 'elastic', 'In an elastic collision:', ['Both momentum and kinetic energy are conserved', 'Only momentum is conserved', 'Only kinetic energy is conserved', 'Neither is conserved'],
  ['That is an inelastic collision.', 'Momentum is always conserved in an isolated collision.', 'Momentum is conserved in every isolated collision.'],
  'Elastic collisions keep kinetic energy; inelastic ones turn some into heat, sound or deformation.', { hy: true, cs: ['cs-collisions'] });
C('p-mom', 'inelastic', 'In a perfectly inelastic collision:', ['The objects stick together and the most kinetic energy is lost', 'Kinetic energy is conserved', 'Momentum is lost', 'The objects bounce apart at their original speeds'],
  ['That is elastic.', 'Momentum is still conserved.', 'That describes a perfectly elastic bounce (seen from the center-of-mass frame), the opposite extreme.'],
  'Sticking together loses the maximum kinetic energy allowed while still conserving momentum.', { cs: ['cs-collisions'] });
C('p-mom', 'equilibrium', 'An object is in static equilibrium. Which must be true?', ['Net force is zero and net torque is zero', 'Net force is zero only', 'Net torque is zero only', 'All forces are equal'],
  ['A seesaw with balanced forces can still rotate if torques are unbalanced.', 'An object can be balanced in rotation yet still slide.', 'Forces can differ as long as they cancel.'],
  'Translational equilibrium (ΣF = 0) and rotational equilibrium (Στ = 0) are both needed.', { hy: true });
G('p-mom', 'g-inelastic', 'Perfectly inelastic collision', rnd => {
  const m1 = pickR(rnd, [1, 2, 3, 4]), v1 = pickR(rnd, [4, 6, 8, 10]), m2 = pickR(rnd, [1, 2, 4, 6]);
  const vf = m1 * v1 / (m1 + m2);
  return { prompt: `A ${m1} kg cart moving at ${v1} m/s hits a stationary ${m2} kg cart, and they stick. What is their speed afterward (m/s)?`, value: vf, tolPct: 2, unit: 'm/s',
    expl: `Momentum: ${m1} × ${v1} = (${m1} + ${m2})v → v = ${m1 * v1}/${m1 + m2} = ${sig(vf)} m/s.` };
}, { hy: true, cs: ['cs-collisions'] });
G('p-mom', 'g-impulse', 'Impulse', rnd => {
  const m = pickR(rnd, [0.1, 0.2, 0.5]), v = pickR(rnd, [10, 20, 30]), t = pickR(rnd, [0.01, 0.02, 0.05, 0.1]);
  const F = m * v / t;
  return { prompt: `A ${m} kg ball moving at ${v} m/s is caught and stopped in ${t} s. What is the average force (N) on it?`, value: F, tolPct: 2, unit: 'N',
    expl: `Impulse = FΔt = Δp, so F = mΔv/Δt = ${m} × ${v} / ${t} = ${sig(F)} N. A longer stopping time (soft hands, airbags) lowers the force.` };
});
G('p-mom', 'g-seesaw', 'Torque balance', rnd => {
  const m1 = pickR(rnd, [20, 30, 40]), r1 = pickR(rnd, [1, 1.5, 2]), m2 = pickR(rnd, [20, 40, 60]);
  const r2 = m1 * r1 / m2;
  return { prompt: `A ${m1} kg child sits ${r1} m from a seesaw\'s pivot. How far (m) on the other side must a ${m2} kg child sit to balance it?`, value: r2, tolPct: 2, unit: 'm',
    expl: `Torques balance: m₁gr₁ = m₂gr₂ → r₂ = ${m1} × ${r1} / ${m2} = ${sig(r2)} m.` };
}, { hy: true });
G('p-mom', 'g-torque', 'Torque', rnd => {
  const F = pickR(rnd, [10, 20, 40]), r = pickR(rnd, [0.2, 0.5, 1]), th = pickR(rnd, [90, 30, 0]);
  const s = { 90: 1, 30: 0.5, 0: 0 }[th];
  return { prompt: `A ${F} N force is applied ${r} m from a hinge, at ${th}° to the lever arm. What is the torque (N·m)?${th === 30 ? ' (sin 30° = 0.5)' : ''}`, value: F * r * s, tol: 0.05, unit: 'N·m',
    expl: `τ = rF sin θ = ${r} × ${F} × ${s} = ${sig(F * r * s) } N·m.${th === 0 ? ' A force along the lever arm cannot rotate it.' : ''}` };
});

/* ---------- Fluids (4B) ---------- */
C('p-fluid', 'depth', 'Three tanks of different shapes are filled with water to the same depth. The pressure at the bottom is:', ['The same in all three', 'Greatest in the widest tank', 'Greatest in the tank with the most water', 'Greatest in the narrowest tank'],
  ['Width does not enter P = ρgh.', 'Total volume does not matter, only depth.', 'Shape does not matter.'],
  'Hydrostatic pressure depends only on fluid density, g and depth (plus the pressure at the surface).', { hy: true, sk: 2 });
C('p-fluid', 'archimedes', 'The buoyant force on a submerged object equals:', ['The weight of the fluid it displaces', 'The object\'s own weight', 'The object\'s volume times its density', 'The pressure at its depth'],
  ['Only true for a floating object, and then because it displaces its own weight of fluid.', 'That is the object\'s mass, not the buoyant force.', 'Pressure is force per area; buoyancy comes from the pressure difference.'],
  'Archimedes\' principle: F_b = ρ_fluid × V_submerged × g.', { hy: true });
C('p-fluid', 'float', 'An object floats with exactly 60% of its volume under water. What is its density?', ['600 kg/m³', '400 kg/m³', '1600 kg/m³', '60 kg/m³'],
  ['That is the fraction above water (40%) times water\'s density.', 'An object denser than water would sink.', 'Off by a factor of 10.'],
  'Fraction submerged = ρ_object / ρ_fluid, so ρ = 0.60 × 1000 kg/m³ = 600 kg/m³.', { sk: 2 });
C('p-fluid', 'continuity', 'Water flows from a wide pipe into a narrower one. Its speed:', ['Increases', 'Decreases', 'Stays the same', 'Drops to zero'],
  ['The same volume per second must pass through a smaller area.', 'Flow rate is constant, so speed must rise.', 'The fluid keeps moving.'],
  'Continuity: A₁v₁ = A₂v₂ for an incompressible fluid.', { hy: true, cs: ['cs-bernoulli'] });

G('p-elec', 'g-req', 'Equivalent resistance', rnd => {
  const kind = pickR(rnd, ['series', 'parallel', 'mixed']);
  const a = pickR(rnd, [2, 3, 4, 6, 12]), b = pickR(rnd, [3, 4, 6, 12]), c = pickR(rnd, [2, 4, 5, 10]);
  const par = (x, y) => x * y / (x + y);
  let R, desc, ex;
  if (kind === 'series') { R = a + b + c; desc = `${a} Ω, ${b} Ω and ${c} Ω in series`; ex = `${a} + ${b} + ${c} = ${R} Ω.`; }
  else if (kind === 'parallel') { R = par(a, b); desc = `${a} Ω and ${b} Ω in parallel`; ex = `R = (${a} × ${b})/(${a} + ${b}) = ${sig(R)} Ω. Always less than the smallest branch.`; }
  else { R = c + par(a, b); desc = `${c} Ω in series with a parallel pair of ${a} Ω and ${b} Ω`; ex = `Parallel pair: ${sig(par(a, b))} Ω; plus ${c} Ω = ${sig(R)} Ω.`; }
  return { prompt: `What is the equivalent resistance (Ω) of ${desc}?`, value: R, tolPct: 2, unit: 'Ω', expl: ex };
}, { hy: true, cs: ['cs-series-parallel'] });

C('c-acid', 'salt-hydrolysis', 'Which salt makes an acidic solution in water?', ['NH₄Cl', 'NaCl', 'CH₃COONa', 'KNO₃'],

  'NH₄⁺ is the conjugate acid of the weak base NH₃, so it donates H⁺ to water.', { hy: true, sk: 2, cs: ['cs-acid-strength'] });
C('c-acid', 'pka-pkb', 'For a conjugate acid–base pair in water at 25 °C, pKa + pKb equals:', ['14', '7', '1', '0'],
  ['7 is neutral pH, not this sum.', 'Off by a lot.', 'They are not opposites that cancel.'],
  'Ka × Kb = Kw = 10^-14, so pKa + pKb = 14. A stronger acid has a weaker conjugate base.', { cs: ['cs-acid-strength'] });
C('c-acid', 'polyprotic', 'Phosphoric acid (H₃PO₄) has three acidic protons. How do its successive dissociation constants compare?', ['Ka₁ > Ka₂ > Ka₃', 'Ka₁ = Ka₂ = Ka₃', 'Ka₁ < Ka₂ < Ka₃', 'Ka₂ is the largest'],
  ['Each proton comes off a more negative ion, so they are not equal.', 'Each later proton is harder to remove, not easier.', 'The first proton, leaving a neutral molecule, is the easiest to remove.'],

C('c-acid', 'indicator', 'For a weak acid titrated with NaOH (equivalence pH ≈ 8.5), the best indicator is one whose color change is near:', ['pH 8–10, like phenolphthalein', 'pH 3–4, like methyl orange', 'pH 5', 'pH 12–13'],
  ['That would change color long before equivalence.', 'Too early.', 'Too late: the curve has already passed the steep rise.'],
  'Choose an indicator whose pKa sits within the steep part of the curve, near the equivalence pH.', { cs: ['cs-titration'] });
G('c-acid', 'g-weak-ph', 'pH of a weak acid', rnd => {
  const n = pickR(rnd, [4, 5, 6]), m = pickR(rnd, [1, 2]);
  const pH = (n + m) / 2;
  return { prompt: `A weak acid has Ka = 1 × 10^-${n}. What is the pH of a 1 × 10^-${m} M solution? (Assume x is small.)`, value: pH, tol: 0.05, unit: '',
    expl: `[H⁺] ≈ √(Ka·C) = √(10^-${n} × 10^-${m}) = 10^-${pH}. pH = ${pH}. Shortcut: pH = ½(pKa − log C).`, hint: '[H⁺] ≈ √(Ka × C)' };
}, { hy: true });
G('c-acid', 'g-ka', 'Ka from pH', rnd => {
  const pH = pickR(rnd, [2, 3, 4]), C = pickR(rnd, [0.1, 0.01]);
  const h = Math.pow(10, -pH), Ka = h * h / C;
  if (h > 0.05 * C) return { prompt: `A 0.1 M weak acid solution has pH 3. Estimate Ka.`, value: 1e-5, tolPct: 5, unit: '', expl: '[H⁺] = 10^-3; Ka ≈ x²/C = (10^-3)² / 0.1 = 1 × 10^-5.' };
  return { prompt: `A ${C} M weak acid solution has pH ${pH}. Estimate Ka.`, value: Ka, tolPct: 5, unit: '',
    expl: `[H⁺] = [A⁻] = 10^-${pH}; Ka ≈ x²/C = (10^-${pH})² / ${C} = ${sci(Ka, 2)}.` };
});

/* ---------- Deeper: solubility & colligative properties (5A) ---------- */
G('c-sol', 'g-osmotic', 'Osmotic pressure', rnd => {
  const c = pickR(rnd, [{ f: 'NaCl', i: 2 }, { f: 'glucose', i: 1 }, { f: 'CaCl₂', i: 3 }]), M = pickR(rnd, [0.1, 0.2, 0.5]), T = pickR(rnd, [300, 310]);
  const pi = c.i * M * 0.0821 * T;
  return { prompt: `What is the osmotic pressure (atm) of ${M} M ${c.f} at ${T} K? (R = 0.0821 L·atm/(mol·K); assume complete dissociation.)`, value: pi, tolPct: 2, unit: 'atm',
    expl: `π = iMRT = ${c.i} × ${M} × 0.0821 × ${T} = ${sig(pi)} atm.`, hint: 'π = iMRT' };
}, { cs: ['cs-colligative'] });
G('c-sol', 'g-raoult', 'Raoult\'s law', rnd => {
  const x = pickR(rnd, [0.9, 0.8, 0.95, 0.75]), P0 = pickR(rnd, [24, 40, 100, 760]);
  return { prompt: `Pure water has a vapor pressure of ${P0} torr. What is the vapor pressure (torr) of a solution with a nonvolatile solute where the mole fraction of water is ${x}?`, value: x * P0, tolPct: 2, unit: 'torr',
    expl: `P = X_solvent × P° = ${x} × ${P0} = ${sig(x * P0)} torr.` };
}, { cs: ['cs-colligative'] });

C('c-redox', 'conc-cell', 'A concentration cell has the same metal and solution in both halves, at different concentrations. Which is true?', ['E°cell = 0, but current flows until the concentrations become equal', 'It produces no current at all', 'The more dilute side is the cathode', 'Its voltage rises over time'],
  ['A difference in concentration drives it (Nernst equation).', 'Reduction happens on the more concentrated side, which is the cathode.', 'The voltage falls as the concentrations even out.'],
  'E = −(RT/nF) ln Q. Q < 1 while the cathode side is more concentrated, so E > 0.', { sk: 2, cs: ['cs-cells'] });
C('c-redox', 'nernst', 'In a running galvanic cell, product concentrations rise. What happens to the cell voltage?', ['It falls toward zero', 'It rises', 'It stays at E°', 'It reverses sign at once'],
  ['Q increases, which lowers E.', 'E equals E° only at standard conditions.', 'It approaches zero at equilibrium (a dead battery).'],

G('c-redox', 'g-dg-nfe', 'ΔG° = −nFE°', rnd => {
  const n = pickR(rnd, [1, 2, 3]), E = pickR(rnd, [0.46, 0.78, 1.10, 1.56]);
  const dG = -n * 96500 * E / 1000;
  return { prompt: `A cell reaction transfers ${n} mol of electrons with E° = +${E} V. What is ΔG°, in kJ? (F = 96,500 C/mol)`, value: dG, tolPct: 2, unit: 'kJ',
    expl: `ΔG° = −nFE° = −${n} × 96,500 × ${E} J = ${sig(dG)} kJ. Negative, so spontaneous.`, hint: 'ΔG° = −nFE°' };
}, { hy: true, cs: ['cs-cells'] });
G('c-redox', 'g-faraday', 'Electrolysis', rnd => {
  const I = pickR(rnd, [1, 2, 5]), t = pickR(rnd, [965, 1930, 9650]), metal = pickR(rnd, [{ f: 'Cu²⁺', n: 2, M: 63.5 }, { f: 'Ag⁺', n: 1, M: 108 }]);
  const mol = I * t / 96500 / metal.n, g = mol * metal.M;
  return { prompt: `A current of ${I} A runs for ${t} s through a ${metal.f} solution. What mass of metal (g) plates out? (F = 96,500 C/mol; molar mass ${metal.M} g/mol)`, value: g, tolPct: 2, unit: 'g',
    expl: `Charge = It = ${I * t} C → ${sig(I * t / 96500)} mol e⁻ → ÷ ${metal.n} = ${sig(mol)} mol metal → × ${metal.M} = ${sig(g)} g.` };
}, { cs: ['cs-cells'] });

/* Storage: IndexedDB (cards, append-only review log, key-value), with in-memory copies. */
'use strict';

const DB_NAME = 'station528', DB_VER = 1;
let IDB = null;
const MEM = { cards: {}, kv: {} };

function idbOpen() {
  return new Promise((res, rej) => {
    if (!('indexedDB' in self)) return rej(new Error('IndexedDB unavailable'));
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('cards')) d.createObjectStore('cards', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('logs')) d.createObjectStore('logs', { keyPath: 'n', autoIncrement: true });
      if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv', { keyPath: 'k' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn) {
  return new Promise((res, rej) => {
    const t = IDB.transaction(store, mode), s = t.objectStore(store);
    let out; try { out = fn(s); } catch (e) { rej(e); return; }
    t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
    t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const getAll = store => new Promise((res, rej) => { const r = IDB.transaction(store).objectStore(store).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

async function dbLoad() {
  IDB = await idbOpen();
  for (const c of await getAll('cards')) MEM.cards[c.id] = c;
  for (const e of await getAll('kv')) MEM.kv[e.k] = e.v;
}
function saveCard(c) { MEM.cards[c.id] = c; return tx('cards', 'readwrite', s => s.put(c)).catch(dbFail); }
function saveCards(list) { for (const c of list) MEM.cards[c.id] = c; return tx('cards', 'readwrite', s => { for (const c of list) s.put(c); }).catch(dbFail); }
function kvGet(k, d) { return k in MEM.kv ? MEM.kv[k] : d; }
function kvSet(k, v) { MEM.kv[k] = v; return tx('kv', 'readwrite', s => s.put({ k, v })).catch(dbFail); }
function addLog(entry) { return tx('logs', 'readwrite', s => s.add(entry)).catch(dbFail); }

function dbFail(e) { if (!dbFailed) { dbFailed = true; console.error(e); if (self.toast) toast('Could not save to this browser\'s storage. Export a backup now.'); } }

async function exportAll() {
  return { app: 'station-528', version: 1, exportedAt: new Date().toISOString(), cards: Object.values(MEM.cards), logs: await allLogs(), kv: MEM.kv };
}
async function importAll(data) {
  if (!data || data.app !== 'station-528' || !Array.isArray(data.cards) || !Array.isArray(data.logs) || typeof data.kv !== 'object') throw new Error('This file is not a Station 528 backup.');
  await tx('cards', 'readwrite', s => { s.clear(); for (const c of data.cards) s.put(c); });
  await tx('logs', 'readwrite', s => { s.clear(); for (const l of data.logs) s.put(l); });
  await tx('kv', 'readwrite', s => { s.clear(); for (const [k, v] of Object.entries(data.kv)) s.put({ k, v }); });

const TYPE_LABEL = { typed: 'typed recall', num: 'number', choice: 'multiple choice', gen: 'calculation (new numbers each time)' };
const PM_TEXT = { misread: 'misread it', content: "didn't know it", reasoning: 'reasoning slip', trap: 'fell for a trap', careless: 'careless' };

function answerOf(it) {
  if (it.type === 'choice') return it.options[0];
  if (it.type === 'typed') { const a = it.accepted[0]; return SHOW[it.id] || a[0].toUpperCase() + a.slice(1); }

      const a = Object.assign({}, l); out.push(a);
      if (!l.correct) lastWrong[l.itemId] = a;
    } else if (l.mode === 'appeal') { const w = lastWrong[l.itemId]; if (w) { w.voided = true; delete lastWrong[l.itemId]; } }
    else if (l.mode === 'postmortem') { const w = lastWrong[l.itemId]; if (w) w.postMortem = l.postMortem; }
  }
  return out.filter(a => !a.voided);
}

const TUTOR_INSTRUCTIONS = `## Instructions for the tutor

You're tutoring a college student preparing for the MCAT. This file comes from Station 528, a spaced-repetition study app that schedules their reviews, so don't build a study schedule. Your job is understanding: fix the ideas behind the misses below.

How to tutor:
1. **Start by asking which area they want to work on**, or suggest the top one from "Where to start". Work on one concept at a time.
2. **Make them retrieve before you explain.** Open each topic with a short question and let them answer before teaching. Never give the answer to a question you've just asked until they've tried.
3. **Go after the misconception, not the fact.** Their wrong answers are listed. Work out what belief would produce that answer, name it, and show why it fails. Misses they bet "Sure" on matter most: confident errors are very fixable but tend to creep back, so revisit them later in the session.
4. **Use their own diagnosis.** Each confident miss may carry their label: misread, didn't know it, reasoning slip, fell for a trap, careless. Misreads call for slowing down on the question stem; missing content needs teaching; trap answers need practice spotting why a tempting option is wrong.
5. **Ask them to explain.** Have them say why an answer is right and why each tempting alternative is wrong. Push for the mechanism ("why does that happen?").
6. **For calculations**, show one fully worked example, then give a similar problem with fewer steps shown, then one they solve alone.
7. **Contrast look-alikes.** When two ideas get confused, put them side by side and quiz the difference.
8. **Keep it at MCAT level.** Stay inside the AAMC content outline; skip detail beyond it.
9. **If an answer key here looks wrong or ambiguous, say so** and explain why. The student can flag it in the app.
10. **Wrap up** with 3 to 5 short questions mixing today's topics, then a two-line summary of what to keep reviewing.

Be concise and conversational. Ask one question at a time.
`;

/* inp: { logs, cards, items (id→item), units (id→unit), courses (id→course), flags, today, examDay, phase,
   openUnits, rangeStart (day index or null for everything), rangeLabel, instructions, now } */
function tutorPack(inp) {
  const { items, cards, units, courses, today: t, now: nowMs } = inp;
  const inRange = l => inp.rangeStart == null || dayOf(l.ts) >= inp.rangeStart;
  const all = tutorAttempts(inp.logs.slice().sort((a, b) => a.ts - b.ts));
  const att = all.filter(inRange).filter(a => items[a.itemId]);
  const first = att.filter(a => a.firstAttempt);
  const studyDays = new Set(att.map(a => dayOf(a.ts))).size;
  const fmtD = ms => new Date(ms).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const pctS = x => Math.round(100 * x) + '%';
  const unitName = id => { const u = units[id]; return u ? `${u.name} (${courses[u.course] ? courses[u.course].name : u.course})` : id; };

  /* misses, grouped by card */
  const byItem = {};
  for (const a of att) {
    const g = byItem[a.itemId] = byItem[a.itemId] || { id: a.itemId, tries: 0, right: 0, misses: [] };
    g.tries++; if (a.correct) g.right++; else g.misses.push(a);
  }
  const missed = Object.values(byItem).filter(g => g.misses.length);
  const weight = g => g.misses.reduce((s, m) => s + ({ 3: 4, 2: 2, 1: 1 }[m.confidence] || 1), 0);
  missed.sort((a, b) => weight(b) - weight(a) || b.misses.length - a.misses.length || b.misses[b.misses.length - 1].ts - a.misses[a.misses.length - 1].ts);

  /* units: first-attempt accuracy in range, plus current recall of their cards */
  const ust = {};
  for (const a of first) { const u = items[a.itemId].unit, s = ust[u] = ust[u] || { n: 0, right: 0, sureMiss: 0 }; s.n++; if (a.correct) s.right++; else if (a.confidence === 3) s.sureMiss++; }
  const unitRows = Object.entries(ust).filter(([, s]) => s.n >= 3).map(([u, s]) => {
    const cs = Object.values(cards).filter(c => items[c.id] && items[c.id].unit === u && c.state === 'review' && !c.suspended);
    const rec = cs.length ? cs.reduce((x, c) => x + rNow(c, nowMs), 0) / cs.length : null;
    return { u, acc: s.right / s.n, n: s.n, sureMiss: s.sureMiss, rec };
  }).sort((a, b) => a.acc - b.acc || b.sureMiss - a.sureMiss);

  /* calibration from first attempts in range */
  const cal = {};
  for (const a of first) if (a.confidence >= 1 && a.confidence <= 3) { const b = cal[a.confidence] = cal[a.confidence] || { n: 0, correct: 0 }; b.n++; if (a.correct) b.correct++; }
  const calc = calibration(cal);
  const pms = {}; for (const a of att) if (a.postMortem) pms[a.postMortem] = (pms[a.postMortem] || 0) + 1;

  const active = Object.values(cards).filter(c => c.state === 'review' && !c.suspended && items[c.id]);
  const exRecall = active.length ? active.reduce((x, c) => x + rExam(c, inp.examDay), 0) / active.length : null;

  const L = [];
  L.push(`# Station 528 tutor pack`, '');
  L.push(`MCAT study data for an AI tutor. Generated ${dateOfDay(t)}; covers ${inp.rangeLabel}.`, '');
  if (inp.instructions) L.push(TUTOR_INSTRUCTIONS);
  L.push(`## The student`, '');
  L.push(`- Exam date: ${dateOfDay(inp.examDay)} (${inp.examDay - t} days away), study phase ${inp.phase}.`);
  L.push(`- Cards in regular review: ${active.length}. Projected recall on exam day if they stopped reviewing now: ${exRecall == null ? 'n/a' : pctS(exRecall)}.`);
  L.push(`- Units opened so far (what their classes have covered): ${inp.openUnits.length ? inp.openUnits.map(id => units[id] ? units[id].name : id).join('; ') : 'none yet'}.`);
  L.push(`- In this period: ${att.length} answers on ${studyDays} study day${studyDays === 1 ? '' : 's'}; ${first.length} first tries, ${first.filter(a => a.correct).length} right.`, '');
  L.push(`How the app works, so the data makes sense: the student types answers (or picks from options shown only after they've thought) and bets on each first try: Unsure (right less than 2 in 3 times), Fairly sure (2 to 4 in 5), or Sure (at least 4 in 5). Each card is a short MCAT fact, concept or calculation.`, '');

  /* where to start */
  L.push(`## Where to start`, '');
  if (!att.length) L.push(`No answers in this period yet.`, '');
  else {
    const top = [];
    const sure = missed.filter(g => g.misses.some(m => m.confidence === 3));
    if (sure.length) top.push(`${sure.length} card${sure.length === 1 ? ' was' : 's were'} missed while betting Sure. Start there (marked ★ below).`);
    const weakU = unitRows.filter(r => r.acc < 0.7).slice(0, 3);
    if (weakU.length) top.push(`Weakest units: ${weakU.map(r => `${units[r.u] ? units[r.u].name : r.u} (${pctS(r.acc)} right first try)`).join('; ')}.`);
    const calcMiss = missed.filter(g => items[g.id].type === 'gen' || items[g.id].type === 'num').length;
    if (calcMiss) top.push(`${calcMiss} calculation card${calcMiss === 1 ? '' : 's'} missed: worth one worked example each.`);
    const nBets = Object.values(cal).reduce((a, b) => a + b.n, 0);
    if (nBets >= 20 && calc.overconfidence != null && calc.overconfidence > 0.1) top.push(`They tend to bet higher than their accuracy (overconfidence index +${Math.round(calc.overconfidence * 100)} points). Ask "how sure are you?" before revealing answers.`);
    if (!top.length) top.push(`Few misses in this period. Probe understanding with "why" questions on recent units instead.`);
    top.forEach((x, i) => L.push(`${i + 1}. ${x}`));
    L.push('');
  }

  /* missed cards */
  if (missed.length) {
    L.push(`## Missed cards`, '');
    L.push(`Most important first. ★ means at least one miss came with a "Sure" bet. "Their answers" are exactly what they typed or picked.`, '');
    missed.slice(0, TUTOR_MAX_ITEMS).forEach((g, i) => {
      const it = items[g.id], last = g.misses[g.misses.length - 1], star = g.misses.some(m => m.confidence === 3) ? '★ ' : '';
      const card = cards[g.id];
      L.push(`### ${i + 1}. ${star}${unitName(it.unit)}`);
      L.push(`AAMC category ${it.cat} · ${TYPE_LABEL[it.type] || it.type}${it.sk >= 2 ? ' · reasoning item' : ''}`, '');
      if (it.type === 'gen') {
        const withPrompt = g.misses.filter(m => m.prompt).pop();
        if (withPrompt) {
          L.push(`**Question (the version they missed):** ${oneLine(withPrompt.prompt)}`);
          L.push(`**Correct answer:** ${withPrompt.value != null ? sig(withPrompt.value, 3) + (withPrompt.unit ? ' ' + withPrompt.unit : '') : 'see the worked solution'}`);
          if (withPrompt.expl) L.push(`**Card's worked solution:** ${oneLine(withPrompt.expl)}`);
        } else {
          L.push(`**Problem type:** ${oneLine(it.title)} (numbers change each time; this miss was logged before the app saved the exact question).`);
          if (last.value != null) L.push(`**Correct answer to the version they missed:** ${sig(last.value, 3)}`);
        }
      } else {
        L.push(`**Question:** ${oneLine(last.alt && it.alt ? it.alt : it.prompt)}`);
        if (it.type === 'choice') {
          L.push(`**Options:** ${it.options.map((o, k) => `${k === 0 ? '(correct) ' : ''}${oneLine(o)}`).join(' | ')}`);
        }
        L.push(`**Correct answer:** ${oneLine(answerOf(it))}${it.type === 'typed' && it.accepted.length > 1 ? ` (also accepted: ${it.accepted.slice(1, 5).join(', ')})` : ''}${it.type === 'num' && (it.num.tol != null || it.num.tolPct != null) ? ` (within ${it.num.tol != null ? '±' + it.num.tol : '±' + it.num.tolPct + '%'})` : ''}`);
      }
      const ans = g.misses.slice(-4).map(m => `${m.response ? quote(m.response) : "\"I don't know\""} (${m.confidence ? BET[m.confidence] : 'no bet'}, ${fmtD(m.ts)}${m.postMortem ? `; their label: ${PM_TEXT[m.postMortem]}` : ''})`);
      L.push(`**Their answers:** ${ans.join('; ')}`);
      if (it.type === 'choice') {
        const picked = [...new Set(g.misses.map(m => it.options.indexOf(m.response)).filter(k => k > 0))];
        for (const k of picked) if (it.lures && it.lures[k - 1]) L.push(`**Why "${oneLine(it.options[k])}" is wrong (card's note):** ${oneLine(it.lures[k - 1])}`);
      }
      if (it.type !== 'gen' && it.expl) L.push(`**Card's explanation:** ${oneLine(it.expl)}`);
      L.push(`**Record in this period:** ${g.right} of ${g.tries} right${card && card.lapses ? ` · missed ${card.lapses} time${card.lapses === 1 ? '' : 's'} overall` : ''}`, '');
    });
    if (missed.length > TUTOR_MAX_ITEMS) L.push(`(${missed.length - TUTOR_MAX_ITEMS} more missed cards left out to keep this file short.)`, '');
  }

  /* units */
  if (unitRows.length) {
    L.push(`## Units, weakest first`, '');
    L.push(`| Unit | First tries | Right | "Sure" misses | Recall now |`, `|---|---|---|---|---|`);
    for (const r of unitRows.slice(0, 12)) L.push(`| ${unitName(r.u)} | ${r.n} | ${pctS(r.acc)} | ${r.sureMiss} | ${r.rec == null ? '–' : pctS(r.rec)} |`);
    L.push('', `"Recall now" is the app's estimate of how much of that unit they'd remember today.`, '');
  }

  /* calibration */
  if (Object.keys(cal).length) {
    L.push(`## Calibration (how well their bets match their accuracy)`, '');
    L.push(`| Bet | Target | Times | Right |`, `|---|---|---|---|`);
    const target = { 1: 'under 67%', 2: '67–80%', 3: '80% or more' };
    for (const c of [1, 2, 3]) if (cal[c]) L.push(`| ${BET[c]} | ${target[c]} | ${cal[c].n} | ${pctS(cal[c].correct / cal[c].n)} |`);
    const nb = Object.values(cal).reduce((a, b) => a + b.n, 0);
    L.push('', nb < 30 ? `Only ${nb} bets so far, so treat these as rough.` : `Overconfidence index: ${calc.overconfidence > 0 ? '+' : ''}${Math.round(calc.overconfidence * 100)} points (0 is ideal; positive means bets run higher than accuracy).`);
    if (Object.keys(pms).length) L.push(`Their own labels for missed "Sure" bets: ${Object.entries(pms).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${PM_TEXT[k]} ×${n}`).join(', ')}.`);
    L.push('');
  }

  /* stubborn cards outside the range */
  const shown = new Set(missed.slice(0, TUTOR_MAX_ITEMS).map(g => g.id));
  const leeches = Object.values(cards).filter(c => items[c.id] && (c.lapses || 0) >= 3 && !shown.has(c.id)).sort((a, b) => b.lapses - a.lapses).slice(0, 10);
  if (leeches.length) {
    L.push(`## Other cards that keep slipping (missed 3+ times overall)`, '');
    for (const c of leeches) { const it = items[c.id]; L.push(`- ${oneLine(it.type === 'gen' ? it.title : it.prompt)} → **${oneLine(answerOf(it) || 'calculated')}** (${units[it.unit] ? units[it.unit].name : it.unit}; missed ${c.lapses} times)`); }
    L.push('');
  }

  /* flagged keys */
  const fl = Object.entries(inp.flags || {}).filter(([id]) => items[id]);
  if (fl.length) {
    L.push(`## Answer keys the student or the app flagged`, '');
    L.push(`Please check these keys and say whether each is right.`, '');
    for (const [id, f] of fl) { const it = items[id]; L.push(`- ${oneLine(it.type === 'gen' ? it.title : it.prompt)} → key: **${oneLine(answerOf(it) || 'calculated')}**${f.auto ? ' (auto-flagged: missed twice while betting Sure)' : f.reason ? ` (their note: ${quote(f.reason)})` : ''}`); }
    L.push('');
  }
  L.push(`---`, `Cards © Station 528, CC BY-NC-SA 4.0.`);
  return { text: L.join('\n'), missed: missed.length, units: unitRows.length, answers: att.length };
}

/* First visit of each study day: spot a return after idle days (D2) and season changes (D16). */
function dailyCheck() {
  const t = today();
  if (kvGet('primerPhase') == null) kvSet('primerPhase', phase());
  if (kvGet('lastVisit') === t) return;
  kvSet('lastVisit', t);
  const L = kvGet('lastActive', null);
  const idle = L == null ? 0 : t - L - 1; /* whole days with no answers */
  let season = kvGet('season', null), fresh = null, prev = null;
  if (!season) kvSet('season', { id: 1, start: t, trigger: 'start' });
  else {
    const trig = idle >= 7 && season.start <= L ? 'lapse'
      : monthOf(t) !== monthOf(season.start) ? 'month'
      : (S.semesterStarts || []).some(x => { const d = dayOfDate(x); return d > season.start && d <= t; }) ? 'semester' : null;
    if (trig) { prev = seasonRecap(season, t); fresh = { id: season.id + 1, start: t, trigger: trig }; kvSet('season', fresh); }
  }
  if (idle >= 1 || fresh) kvSet('checkin', { day: t, welcome: idle >= 1, season: fresh, prev, done: false });
}

}

/* ---------- delta v2: calibration trend (D15) ---------- */
function calTrend() {
  const cm = kvGet('calibMonth', {}), months = Object.keys(cm).sort().slice(-6);
  if (months.length < 2) return `<p class="small muted">The monthly trend appears once you have bets from two different months.</p>`;
  const names = ['Unsure', 'Fairly sure', 'Sure'], W = 112, H = 140, pad = { l: 6, r: 6, t: 22, b: 20 };
  const x = i => pad.l + (months.length === 1 ? 0 : i * (W - pad.l - pad.r) / (months.length - 1)), y = v => pad.t + (1 - v) * (H - pad.t - pad.b);
  const mlabel = m => new Date(m + '-15T12:00:00').toLocaleDateString(undefined, { month: 'short' });
  const panels = [1, 2, 3].map(c => {
    const band = CAL_BANDS[c];
    const pts = months.map((m, i) => { const b = (cm[m] || {})[c]; return b && b.n >= 5 ? { i, m, acc: b.correct / b.n, n: b.n } : null; });
    const segs = []; let cur = [];
    for (const p of pts) { if (p) cur.push(p); else if (cur.length) { segs.push(cur); cur = []; } }
    if (cur.length) segs.push(cur);
    let g = `<text x="${pad.l}" y="12" class="pt">${names[c - 1]}</text>`;
    g += `<rect class="band" x="${pad.l}" y="${y(band[1])}" width="${W - pad.l - pad.r}" height="${y(band[0]) - y(band[1])}" rx="2"><title>Target ${Math.round(band[0] * 100)}–${Math.round(band[1] * 100)}%</title></rect>`;
    g += `<line class="grid" x1="${pad.l}" y1="${y(0.5)}" x2="${W - pad.r}" y2="${y(0.5)}"/><line class="grid" x1="${pad.l}" y1="${y(1)}" x2="${W - pad.r}" y2="${y(1)}"/><line class="axis" x1="${pad.l}" y1="${y(0)}" x2="${W - pad.r}" y2="${y(0)}"/>`;
    for (const sg of segs) if (sg.length > 1) g += `<polyline class="ln" points="${sg.map(p => `${x(p.i)},${y(p.acc)}`).join(' ')}"/>`;
    for (const p of pts) if (p) g += `<circle class="dot" cx="${x(p.i)}" cy="${y(p.acc)}" r="4"><title>${mlabel(p.m)}: ${pct(p.acc)} right of ${p.n}</title></circle>`;
    g += `<text x="${pad.l}" y="${H - 4}">${mlabel(months[0])}</text><text x="${W - pad.r}" y="${H - 4}" text-anchor="end">${mlabel(months[months.length - 1])}</text>`;
    return `<svg class="chart smx" viewBox="0 0 ${W} ${H}" role="img" aria-label="${names[c - 1]}: accuracy by month against its target band">${g}</svg>`;
  }).join('');
  const rows = months.map(m => `<tr><td>${esc(mlabel(m))} ${m.slice(0, 4)}</td>${[1, 2, 3].map(c => { const b = (cm[m] || {})[c]; return `<td class="n">${b && b.n ? pct(b.correct / b.n) + `<span class="muted"> /${b.n}</span>` : '—'}</td>`; }).join('')}</tr>`).join('');
  return `<div class="smxrow">${panels}</div><p class="small muted">Share right each month, from 0% at the bottom line to 100% at the top. Shaded: the target range for that bet. Months with fewer than 5 bets at a level are left out.</p>
    <details class="why"><summary>Show as a table</summary><table class="t"><thead><tr><th>Month</th><th class="n">Unsure</th><th class="n">Fairly</th><th class="n">Sure</th></tr></thead><tbody>${rows}</tbody></table></details>`;
}

/* ---------- runs (Daily Rounds and Intake) ---------- */
function getRun(kind) {
  const t = today(), key = 'sess:' + kind;
  let sess = kvGet(key);
  if (sess && sess.day === t && (sess.queue.length || kind === 'rounds')) return sess;
  if (kind === 'rounds') {
    const list = Object.values(MEM.cards).filter(c => isActive(c));
    const T = examDay();
    const b = buildRounds(list, t, now(), capNow(), T, id => ITEM[id] && ITEM[id].hy, S.sweepDone);
    if (b.swept) { S.sweepDone = true; saveSettings(); }
    saveCards(list);
    sess = newSession('rounds', t, b.queue);
    sess.taken = b.taken;
  } else {
    const remaining = Math.max(0, quotaToday().quota - dayStats(t).newCards);
    const ids = pickIntake(ITEMS, MEM.cards, S.openUnits, remaining, UNIT_ORDER, focusWing());
    const prev = sess && sess.day === t ? sess : null;
    sess = prev ? Object.assign(prev, { queue: ids.map(id => ({ id, kind: 'new' })), done: false }) : newSession('intake', t, ids.map(id => ({ id, kind: 'new' })));

}
function startRun(kind) {

    return go('#/');

function nextCard(kind, sess) {

  if (!sess.queue.length) { sess.done = true; kvSet('sess:' + kind, sess); markCleared(kind); return go('#/debrief/' + kind); }
  const q = sess.queue[0], it = ITEM[q.id];
  if (!it || it.status === 'quarantined' || (cardOf(q.id) && cardOf(q.id).suspended)) { sess.queue.shift(); kvSet('sess:' + kind, sess); return nextCard(kind, sess); }

function calChart(cal) {

  const y = v => y0 + h - v * h;

  for (const v of [0, 0.5, 1]) g += `<text x="${x0 - 6}" y="${y(v) + 4}" text-anchor="end">${v * 100}%</text>`;
  cal.levels.forEach((L, i) => {

    g += `<rect class="band" x="${bx - 6}" y="${y(L.hi)}" width="${bw + 12}" height="${y(L.lo) - y(L.hi)}" rx="3"><title>Target for ${['Unsure', 'Fairly sure', 'Sure'][i]}: ${Math.round(L.lo * 100)}–${Math.round(L.hi * 100)}%</title></rect>`;

    }
    g += `<text x="${bx + bw / 2}" y="${y(0) + 17}" text-anchor="middle">${['Unsure', 'Fairly', 'Sure'][i]}</text><text x="${bx + bw / 2}" y="${y(0) + 32}" text-anchor="middle">n=${L.n}</text>`;
  });
